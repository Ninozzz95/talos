
apply plugin: 'com.android.application'
// C0 (fase 9): il codice nuovo nasce in Kotlin, i plugin Java restano Java.
apply plugin: 'kotlin-android'

/**
 * ⛔ La firma di rilascio, letta da FUORI il repository.
 *
 * ## Perche' non e' un dettaglio di configurazione
 *
 * Fuori dal Play Store non esiste rotazione delle chiavi. Il telefono accetta
 * un aggiornamento solo se e' firmato dalla STESSA chiave dell'installazione
 * che ha gia': perderla significa che nessuno potra' piu' aggiornare, e
 * l'unica via sarebbe disinstallare — cioe' cancellare chat, Libreria e
 * memoria di chi ci aveva creduto.
 *
 * E TALOS sara' pubblico e FOSS: una chiave finita nella storia di git e'
 * pubblica per sempre, e la storia non si riscrive dopo che qualcuno ha
 * clonato. Chi ce l'ha puo' pubblicare aggiornamenti che il telefono accetta
 * come nostri.
 *
 * Quindi: il file della chiave vive fuori dal repository, e qui entra solo il
 * PERCORSO, scritto in `keystore.properties` che il `.gitignore` esclude.
 *
 * ## Cosa succede se il file non c'e'
 *
 * Niente di rotto: il blocco `signingConfigs` non viene creato e il build di
 * rilascio resta non firmato, come prima. Chi clona il repository per leggerlo
 * o per contribuire non deve procurarsi una chiave per compilare.
 */
def proprietaFirma = new Properties()
def fileFirma = rootProject.file('keystore.properties')
if (fileFirma.exists()) {
    fileFirma.withInputStream { proprietaFirma.load(it) }
}
def firmaDisponibile = proprietaFirma.containsKey('storeFile') &&
        file(proprietaFirma['storeFile']).exists()

android {
    namespace = "ai.talos"

    buildFeatures {
        // ⛔ Da AGP 8 la generazione di BuildConfig e' SPENTA per impostazione
        // predefinita. Serve accesa perche' `BuildConfig.DEBUG` e' una
        // `static final boolean`: il compilatore elimina il ramo morto, e il
        // codice diagnostico non finisce nel bytecode di rilascio. Un controllo
        // a runtime lo lascerebbe li dentro, spento ma presente.
        buildConfig true
    }
    compileSdk = rootProject.ext.compileSdkVersion
    // Fissato, non lasciato al valore predefinito di AGP: il motore locale è
    // compilato da questo NDK e una versione diversa è un compilatore diverso.
    ndkVersion = "27.0.12077973"
    defaultConfig {
        applicationId "ai.talos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        /*
         * ⛔⛔ LA VERSIONE LA DECIDE IL TAG, NON QUESTA RIGA.
         *
         * Un numero scritto qui e un tag scritto su GitHub sono due fonti per
         * lo stesso fatto, e due fonti divergono: il giorno che qualcuno
         * pubblica `v0.2.0` dimenticando di toccare il gradle, l'APK dentro la
         * release dice `1.0` e nessuno se ne accorge — perche' il numero che si
         * vede sulla pagina e' quello del tag, e quello che il telefono mostra
         * nelle impostazioni e' questo.
         *
         * ⇒ Il workflow passa `-PtalosVersionName=0.1.0 -PtalosVersionCode=1`.
         * Senza quelle proprieta' — cioe' per chiunque compili in locale — i
         * valori qui sotto restano, e non serve procurarsi niente.
         *
         * ## Perche' `versionCode` e' un intero separato e non deriva dal nome
         *
         * Android confronta SOLO `versionCode` per decidere se un pacchetto e'
         * un aggiornamento, e deve crescere in modo monotono. Derivarlo dal
         * nome (0.1.0 -> 100) sembra elegante e si rompe alla prima versione a
         * due cifre. ⇒ Lo si passa esplicito, e la release note dice quale.
         */
        versionCode project.hasProperty('talosVersionCode')
                ? project.property('talosVersionCode').toInteger()
                : 1
        /*
         * ⛔ IL RIPIEGO E' `0.0.0`, ED E' UNA SCELTA.
         *
         * Trovato provando al contrario: col ripiego a `"1.0-dev"` una build
         * locale usciva `1.0-dev-dev`, perche' il tipo debug aggiunge gia' il
         * suo `-dev`. Ma il difetto vero era un altro, e stava nell'altra
         * direzione: un ripiego `"1.0"` avrebbe fatto sembrare una release
         * VERA un pacchetto costruito a mano senza tag.
         *
         * `0.0.0` non puo' mentire in nessuno dei due versi: non si confonde
         * con niente di pubblicato, e non puo' MAI risultare piu' alta di una
         * versione vera.
         */
        versionName project.hasProperty('talosVersionName')
                ? project.property('talosVersionName')
                : "0.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // Solo arm64. Da quando esiste codice nativo questa riga decide su
            // quali telefoni l'app si installa: i 32 bit restano fuori. È una
            // perdita accettata e non subita — Google impone i 64 bit dal 2019 e
            // llama.cpp su ARM a 32 bit non è una strada seria — ma va detta,
            // perché prima di oggi l'app si installava ovunque.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release',
                        '-DBUILD_SHARED_LIBS=ON',
                        '-DLLAMA_BUILD_APP=OFF',
                        '-DLLAMA_BUILD_COMMON=OFF',
                        '-DLLAMA_BUILD_UI=OFF',
                        '-DLLAMA_OPENSSL=OFF',
                        // Il computer che compila non è il telefono che esegue:
                        // GGML_NATIVE accorderebbe il codice su questa macchina.
                        '-DGGML_NATIVE=OFF',
                        // Le due che rendono l'app distribuibile: ggml costruisce
                        // più varianti CPU e sceglie a runtime quella che il
                        // telefono regge davvero. Con minSdk 26 il parco va da
                        // ARMv8.0 in su, e una singola build accordata sul
                        // telefono di oggi si rifiuterebbe di partire su quelli.
                        '-DGGML_BACKEND_DL=ON',
                        '-DGGML_CPU_ALL_VARIANTS=ON',
                        '-DGGML_LLAMAFILE=OFF'
                /*
                 * ⛔⛔ SOLO RICERCA: `-PtalosResearchBackend=cpu|opencl|vulkan`.
                 *
                 * Senza la proprietà non cambia una virgola: la build che
                 * spediamo resta quella qui sopra. Questa manopola serve a
                 * QUALIFICARE un acceleratore, e la qualificazione è il lavoro
                 * in cui «la GPU» non è ancora una risposta.
                 *
                 * ⛔ UN BACKEND ALLA VOLTA, e non è pigrizia. Con due
                 * acceleratori compilati insieme il registro ne elenca due e
                 * l'ordine di caricamento delle librerie sceglierebbe per noi;
                 * separarli dà fallimenti isolabili, un artefatto nativo più
                 * piccolo e un inventario dei dispositivi deterministico. Si
                 * combinano soltanto DOPO che il targeting esplicito funziona.
                 *
                 * ⛔ E i prerequisiti si dicono per NOME. Un `FATAL_ERROR` di
                 * CMake su un compilatore host mancante manda a cercare il
                 * guasto dentro llama.cpp, che è il posto sbagliato: manca un
                 * pezzo di questa macchina, non del progetto.
                 */
                if (project.hasProperty('talosResearchBackend')) {
                    def scelto = project.property('talosResearchBackend').toString().toLowerCase()
                    def ndkHome = android.ndkDirectory
                    if (scelto == 'cpu') {
                        // Esplicito: è già il predefinito, ma dirlo rende
                        // l'artifact della corsa CPU indistinguibile a occhio da
                        // quello di un acceleratore spento a mano.
                        arguments '-DGGML_OPENCL=OFF', '-DGGML_VULKAN=OFF'
                    } else if (scelto == 'opencl') {
                        /*
                         * ⛔ Header OpenCL e ICD loader NON stanno nell'NDK.
                         * MISURATO il 2026-08-20: `sysroot/usr/include/CL/` non
                         * esiste. Si passano dall'esterno con
                         * `-PtalosOpenclRoot=<cartella con CL/ e libOpenCL.so>`.
                         *
                         * ⛔ `GGML_OPENCL_PROFILING` resta SPENTA: upstream dice
                         * che aumenta il costo sulla CPU, e una misura di
                         * prestazioni presa con la sonda accesa non è quella
                         * misura.
                         *
                         * ⛔ `GGML_OPENCL_USE_ADRENO_BIN_KERNELS` resta SPENTA:
                         * il pacchetto binario upstream mira alle Adreno X2, e
                         * questo telefono ha una 830.
                         */
                        if (!project.hasProperty('talosOpenclRoot')) {
                            throw new GradleException(
                                    "⛔ `-PtalosResearchBackend=opencl` richiede anche " +
                                    "`-PtalosOpenclRoot=<cartella>`.\n" +
                                    "   Dentro servono `CL/` (header Khronos) e " +
                                    "`libOpenCL.so` per arm64.\n" +
                                    "   L'NDK non li porta: verificato che " +
                                    "`sysroot/usr/include/CL/` non esiste.")
                        }
                        def openclRoot = project.property('talosOpenclRoot').toString()
                        arguments '-DGGML_OPENCL=ON',
                                '-DGGML_VULKAN=OFF',
                                '-DGGML_OPENCL_EMBED_KERNELS=ON',
                                '-DGGML_OPENCL_USE_ADRENO_KERNELS=ON',
                                '-DGGML_OPENCL_TARGET_VERSION=300',
                                "-DOpenCL_INCLUDE_DIR=${openclRoot}/include".toString(),
                                "-DOpenCL_LIBRARY=${openclRoot}/lib/libOpenCL.so".toString()
                    } else if (scelto == 'vulkan') {
                        /*
                         * ⛔⛔ IL COMPILATORE È DUE, e confonderli è un errore di
                         * sistema di build, non un guasto di Vulkan a runtime.
                         *
                         * `vulkan-shaders-gen` gira su QUESTO computer e genera
                         * gli shader; `ggml-vulkan` viene compilato per il
                         * telefono. Il CMake di upstream cerca il compilatore
                         * host con `find_program(NAMES cl gcc clang)` e, se non
                         * lo trova, si ferma con «Host compiler not found».
                         *
                         * MISURATO il 2026-08-20 su questa macchina: cl, gcc,
                         * clang e g++ sono TUTTI assenti, e la cartella di
                         * Visual Studio 18 è vuota. ⇒ La corsia Vulkan è
                         * bloccata da un prerequisito della macchina, non dal
                         * progetto — e il messaggio lo deve dire.
                         *
                         * ⛔ `glslc` invece c'è, dentro l'NDK, e va indicato: il
                         * `find_package(Vulkan COMPONENTS glslc REQUIRED)` di
                         * upstream non guarda in `shader-tools/`.
                         */
                        def finestre = org.gradle.internal.os.OperatingSystem.current().isWindows()
                        def glslc = new File(ndkHome,
                                "shader-tools/${finestre ? 'windows-x86_64/glslc.exe'
                                        : 'linux-x86_64/glslc'}")

                        /*
                         * ⛔⛔ I PREREQUISITI SI CONTANO TUTTI IN UNA VOLTA.
                         *
                         * MISURATO il 2026-08-20: senza questo blocco la corsa
                         * moriva su SPIRV-Headers dentro venti righe di CMake,
                         * e il compilatore host — che manca ANCHE lui — si
                         * sarebbe scoperto solo al giro dopo. Scoprire un
                         * prerequisito per volta costa una compilazione a testa,
                         * e ognuna finisce con un errore che parla di un'altra
                         * cosa.
                         */
                        def mancanti = []
                        if (!glslc.exists()) {
                            mancanti << "glslc — atteso in ${glslc}, di norma arriva con l'NDK"
                        }
                        if (!project.hasProperty('talosSpirvHeaders')) {
                            mancanti << "SPIRV-Headers — `-PtalosSpirvHeaders=<cartella con " +
                                    "SPIRV-HeadersConfig.cmake>`. ⛔ Il clone non basta: " +
                                    "quel file nasce dall'installazione " +
                                    "(`cmake --install`), e `find_package` cerca lui"
                        }
                        /*
                         * ⛔ `vulkan.hpp` NON è nell'NDK, e `vulkan.h` sì.
                         *
                         * MISURATO il 2026-08-20: con SPIRV-Headers e il
                         * compilatore host a posto, la compilazione arrivava
                         * fino a
                         *
                         *   ggml-vulkan.cpp:22:10: fatal error:
                         *     'vulkan/vulkan.hpp' file not found
                         *
                         * L'NDK porta l'intestazione C e la `libvulkan.so`, ma i
                         * binding C++ di Khronos stanno in un repository a
                         * parte. ⛔ La versione va fatta combaciare con quella
                         * del loader — qui 1.3.275, come dice `find_package`.
                         */
                        if (!project.hasProperty('talosVulkanHeaders')) {
                            mancanti << "Vulkan-Hpp — `-PtalosVulkanHeaders=<cartella include>` " +
                                    "da github.com/KhronosGroup/Vulkan-Headers, al tag che " +
                                    "combacia col loader dell'NDK. L'NDK porta `vulkan.h`, " +
                                    "non `vulkan.hpp`"
                        }
                        /*
                         * ⛔ IL COMPILATORE È DUE, e confonderli è un errore di
                         * sistema di build, non un guasto di Vulkan a runtime.
                         *
                         * `vulkan-shaders-gen` gira su QUESTO computer e genera
                         * gli shader; `ggml-vulkan` viene compilato per il
                         * telefono. Upstream cerca l'host con
                         * `find_program(NAMES cl gcc clang)` e si ferma con
                         * «Host compiler not found».
                         */
                        if (!project.hasProperty('talosVulkanHostToolchain')) {
                            def trovato = ['cl', 'gcc', 'clang', 'g++', 'clang++'].find { nome ->
                                System.getenv('PATH')?.split(File.pathSeparator)?.any { cartella ->
                                    new File(cartella, finestre ? "${nome}.exe" : nome).exists()
                                }
                            }
                            if (trovato == null) {
                                mancanti << "un compilatore C++ per QUESTA macchina (cl, gcc o " +
                                        "clang sul PATH) — serve a costruire `vulkan-shaders-gen`, " +
                                        "che gira qui e non sul telefono. In alternativa " +
                                        "`-PtalosVulkanHostToolchain=<file toolchain CMake>`"
                            }
                        }
                        if (!mancanti.isEmpty()) {
                            throw new GradleException(
                                    "⛔ La corsia Vulkan è BLOCCATA da prerequisiti di questa " +
                                    "macchina, non dal progetto.\n   Mancano:\n" +
                                    mancanti.collect { "     · ${it}" }.join('\n'))
                        }

                        arguments '-DGGML_VULKAN=ON',
                                '-DGGML_OPENCL=OFF',
                                "-DVulkan_GLSLC_EXECUTABLE=${glslc.absolutePath.replace('\\', '/')}".toString(),
                                "-DSPIRV-Headers_DIR=" +
                                        project.property('talosSpirvHeaders').toString()
                                                .replace('\\', '/'),
                                // ⛔ Solo gli header: la `libvulkan.so` resta
                                // quella dell'NDK, che è la stessa che il
                                // telefono ha. Sostituire anche quella
                                // significherebbe linkare contro una libreria
                                // che sul dispositivo non c'è.
                                "-DVulkan_INCLUDE_DIR=" +
                                        project.property('talosVulkanHeaders').toString()
                                                .replace('\\', '/'),
                                /*
                                 * ⛔⛔ LO STUB DELL'API 28, NON QUELLO DI minSdk.
                                 *
                                 * MISURATO il 2026-08-20: con lo stub del
                                 * livello 26 — che è il nostro minSdk — il
                                 * collegamento moriva con
                                 *
                                 *   ld.lld: error: undefined symbol:
                                 *     vkGetPhysicalDeviceFeatures2
                                 *
                                 * `vkGetPhysicalDeviceFeatures2` è Vulkan 1.1, e
                                 * l'NDK lo espone a partire dall'API 28.
                                 * Verificato livello per livello con
                                 * `llvm-readelf --dyn-syms`: 26 → no, 27 → no,
                                 * 28 → sì.
                                 *
                                 * ⛔ E QUESTO È IL MOTIVO PER CUI LA CORSIA
                                 * VULKAN NON SI PUÒ PROMUOVERE COSÌ COM'È: una
                                 * `libggml-vulkan.so` legata a quei simboli non
                                 * si carica su Android 8 e 8.1, che il nostro
                                 * `minSdk 26` ammette. Per la ricerca va bene —
                                 * il Pad è Android 16 — ma una promozione
                                 * richiederebbe o alzare minSdk, o il carico
                                 * dinamico dei simboli, e sono due decisioni di
                                 * prodotto, non di build.
                                 */
                                "-DVulkan_LIBRARY=" + new File(ndkHome,
                                        "toolchains/llvm/prebuilt/" +
                                        (finestre ? "windows-x86_64" : "linux-x86_64") +
                                        "/sysroot/usr/lib/aarch64-linux-android/28/libvulkan.so")
                                        .absolutePath.replace('\\', '/')
                        if (project.hasProperty('talosVulkanHostToolchain')) {
                            arguments "-DGGML_VULKAN_SHADERS_GEN_TOOLCHAIN=" +
                                    project.property('talosVulkanHostToolchain').toString()
                        }
                    } else {
                        throw new GradleException(
                                "⛔ `-PtalosResearchBackend=${scelto}` non è una scelta valida.\n" +
                                "   Le tre sono: cpu, opencl, vulkan — una alla volta.")
                    }
                    println "⛔ BUILD DI RICERCA: backend `${scelto}`. Non è la build che si spedisce."
                }
                /*
                 * ⛔⛔ SOLO RICERCA — P2-5: `-PtalosLlamaCandidateSrc=<percorso>`
                 * compila da un CHECKOUT ISOLATO di llama.cpp — un candidato
                 * diverso dal pin di produzione, preparato da
                 * `scripts/research/qualify-llama-candidate.mjs` (un
                 * `git worktree`, mai `third_party/llama.cpp` stesso). Senza
                 * la proprietà non cambia niente: `CMakeLists.txt` legge il
                 * pin di sempre.
                 *
                 * ⛔ Il percorso arriva da Node/Windows con `\`: CMake vuole
                 * `/`, stesso `.replace('\\', '/')` già in uso qui sopra per
                 * i percorsi Vulkan.
                 */
                if (project.hasProperty('talosLlamaCandidateSrc')) {
                    def candidato = project.property('talosLlamaCandidateSrc').toString().replace('\\', '/')
                    arguments "-DTALOS_LLAMA_CANDIDATE_SRC=${candidato}".toString()
                    println "⛔ BUILD DI RICERCA: sorgente candidato ${candidato}, non il pin di produzione."
                }
                /*
                 * ⛔⛔⛔ HWASAN, SOLO A RICHIESTA: `-PtalosHwasan`.
                 *
                 * I test in Java provano che nessuno PUÒ arrivare al codice
                 * nativo pericoloso. Non provano che quel codice sia sano — le
                 * guardie fermano la chiamata prima, quindi il pezzo rischioso
                 * non viene nemmeno eseguito. Dicono «la porta è chiusa a
                 * chiave», non «dietro non c'è il burrone».
                 *
                 * HWAddress Sanitizer guarda dietro la porta: è lo strumento
                 * corrente su ARM64 per gli use-after-free, vede le librerie
                 * JNI — e NON vede il codice Java, quindi è esattamente
                 * complementare a quei test, non un doppione.
                 *
                 * ⛔ STL CONDIVISA, e non è un dettaglio: `new` e `delete` della
                 * libreria standard sono compilati senza frame pointer, e HWASan
                 * porta la propria versione — che non può sostituire nulla se la
                 * STL è legata staticamente dentro l'app.
                 *
                 * ⛔ Fuori dal giro normale apposta. Rallenta, cambia il modo in
                 * cui la memoria viene allocata, e una build così non è quella
                 * che si spedisce: è quella con cui si guarda.
                 */
                if (project.hasProperty('talosHwasan')) {
                    /*
                     * ⛔ FLAG ESPLICITI, non `ANDROID_SANITIZE`.
                     *
                     * Con `-DANDROID_SANITIZE=hwaddress` la STL passava davvero a
                     * condivisa — quindi gli argomenti arrivavano — ma la libreria
                     * usciva SENZA un solo simbolo del sanitizer e senza dipendere
                     * dal suo runtime. Verificato con `llvm-readelf` sull'APK, non
                     * dedotto: l'opzione veniva accettata e ignorata.
                     *
                     * ⇒ I flag del compilatore non si possono ignorare, e CMake li
                     * propaga a tutti i sottoprogetti — llama.cpp e ggml compresi,
                     * che e dove vive il codice da guardare.
                     */
                    arguments '-DANDROID_STL=c++_shared',
                            '-DCMAKE_C_FLAGS=-fsanitize=hwaddress -fno-omit-frame-pointer',
                            '-DCMAKE_CXX_FLAGS=-fsanitize=hwaddress -fno-omit-frame-pointer',
                            '-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=hwaddress',
                            '-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=hwaddress'
                }
                /*
                 * ⛔⛔ SOLO RICERCA — P2-2: `-PtalosCpuKleidiAI=true`.
                 *
                 * Senza la proprietà non cambia niente: il flag upstream
                 * `GGML_CPU_KLEIDIAI` è OFF di default (verificato in
                 * `ggml/CMakeLists.txt`), come ogni altra corsia di ricerca
                 * qui sopra.
                 *
                 * ⛔ Non è vendored: attivarlo fa scaricare a CMake il
                 * sorgente KleidiAI da GitHub Releases (`FetchContent`, URL
                 * fisso `v1.24.0`, verificato con hash MD5 pinnato nello
                 * script upstream) — la prima build con questo flag richiede
                 * rete, quelle successive riusano la cache di
                 * `FetchContent` nella cartella di build finché non viene
                 * pulita.
                 *
                 * ⛔ CR-18 (revisione avversariale del programma): "enabled"
                 * non prova che i kernel siano usati — questo flag da solo
                 * qualifica SOLO se il backend si registra, mai se un
                 * modello reale ci passa attraverso. Il conteggio
                 * bytes/tensori per buffer type resta un blocco separato,
                 * dichiarato esplicitamente non ancora costruito.
                 */
                if (project.hasProperty('talosCpuKleidiAI')) {
                    arguments '-DGGML_CPU_KLEIDIAI=ON'
                    println "⛔ BUILD DI RICERCA: KleidiAI attivo. Non è la build che si spedisce."
                }
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
             //
             // ⛔⛔ E le DUE aggiunte nostre, con la misura che le ha volute.
             //
             // MISURATO il 2026-08-09 aprendo l'APK: dentro c'erano 2,45 MB di
             // SOURCEMAP di pdf.js (`pdf.worker.mjs.map` da sola pesa 1,21 MB)
             // e 0,79 MB di un PDF di ESEMPIO che pdf.js si porta dietro per la
             // sua pagina dimostrativa — `compressed.tracemonkey-pldi-09.pdf`,
             // un articolo accademico del 2009 che con TALOS non c'entra nulla.
             //
             // Tre megabyte e mezzo su trentaquattro — il 10% — spediti a ogni
             // persona che installa l'app, per servire il debug di una libreria
             // di terzi che noi non stiamo debuggando. Una mappa serve a chi
             // legge una traccia nel browser; nessuno legge tracce dentro un
             // APK firmato sul telefono di qualcun altro.
             //
             // `*.map` e' volutamente largo: qualunque libreria vendorizzata ne
             // porti una domani, resta fuori senza che nessuno se ne accorga —
             // che e' il modo in cui questi tre megabyte erano entrati.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.map:!compressed.tracemonkey-pldi-09.pdf'
        }
    }
    // ⛔ PRIMA di `buildTypes`: Gradle risolve i nomi nell'ordine in cui
    // legge il file, e un blocco di firma dichiarato dopo non esiste ancora
    // quando il tipo di build lo cerca.
    if (firmaDisponibile) {
        signingConfigs {
            rilascio {
                storeFile file(proprietaFirma['storeFile'])
                storePassword proprietaFirma['storePassword']
                keyAlias proprietaFirma['keyAlias']
                keyPassword proprietaFirma['keyPassword']
                // Entrambi gli schemi: v2 e' il minimo per Android 7+, v3
                // permette la sostituzione della chiave se un giorno servisse.
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    /*
     * ⛔⛔⛔ LA BASELINE — il debito si dichiara, non si nasconde.
     *
     * Il primo giro del cancello Lint ha trovato 20 errori, tutti PREESISTENTI:
     *
     *     14  NewApi          chiamate ad API 29 e 34 con minSdk 26
     *      1  MissingPermission
     *      1  MissingSuperCall
     *      1  GestureBackNavigation
     *      1  PropertyEscape
     *      1  StartActivityAndCollapseDeprecated
     *      1  MissingTranslation
     *
     * ⛔ E un cancello ROSSO ALL'ARRIVO lo spegne il primo che ci sbatte. L'ho
     * scritto io stesso a proposito dei test nel browser, e poi ho aggiunto
     * questo senza provarlo prima: e' un errore mio, non una scelta.
     *
     * ⇒ La baseline congela le venti in un file che si puo' APRIRE e CONTARE, e
     * fa fallire il build su ogni errore NUOVO. Non e' un silenziatore: e' un
     * elenco di cose da guardare, con un cancello attorno perche' non cresca.
     *
     * ⛔ I 14 `NewApi` non sono rumore: sono chiamate a funzioni piu' nuove del
     * minimo dichiarato, cioe' un crash su un dispositivo vecchio se non sono
     * protette da un controllo che Lint non vede. Vanno guardate una a una.
     */
    lint {
        baseline = file('lint-baseline.xml')
        // ⛔ Gli avvisi restano avvisi: alzarli tutti a errore riempirebbe la
        // baseline di 84 righe e la renderebbe illeggibile — cioe' inutile.
        abortOnError = true
    }
    buildTypes {
        debug {
            // Copia affiancata. Il computer nuovo ha una chiave di debug diversa
            // da quella che ha firmato l'app sul telefono dell'owner, quindi un
            // aggiornamento sul posto e' rifiutato e l'unica alternativa sarebbe
            // disinstallare — cioe' cancellargli chat e libreria. Con
            // -PtalosSideBySide l'app si installa come pacchetto separato e la
            // sua resta intatta. Il FileProvider usa gia' ${applicationId},
            // quindi le due autorita' non si scontrano. Senza la proprieta' il
            // build e' identico a prima: questo blocco non fa nulla.
            if (project.hasProperty('talosSideBySide')) {
                applicationIdSuffix '.dev'
                versionNameSuffix '-dev'
            }
        }
        release {
            /*
             * ⛔⛔ R8 ACCESO, e le regole vengono da un INVENTARIO.
             *
             * 26 plugin Capacitor: coperti dalle sue stesse consumerProguardFiles
             * — verificato nel suo build.gradle, non supposto. 5 classi con
             * metodi nativi: tenute per nome, perché il legame fra Java e C++ è
             * un nome dentro il simbolo. Sta scritto in proguard-rules.pro quale
             * riga risponde a quale fatto.
             *
             * ⛔ proguard-android-OPTIMIZE.txt e non proguard-android.txt: il
             * primo lascia lavorare le ottimizzazioni, il secondo le disattiva.
             * Accendere R8 col file che spegne metà del suo lavoro è prendersi
             * il rischio senza il guadagno.
             *
             * ⛔⛔⛔ E NON BASTA CHE COMPILI. R8 rompe a RUNTIME, sul primo
             * percorso che raggiunge una classe per nome — cioè quando la
             * persona apre qualcosa. Prima di pubblicare, ogni plugin va toccato
             * una volta sul dispositivo. Il fatto che questo build produca un
             * APK non è la prova che l'app funzioni.
             */
            minifyEnabled true
            /*
             * ⛔ DOPO R8, mai prima: le risorse si tolgono in base a ciò che il
             * codice RIMASTO usa davvero, e prima di R8 il codice rimasto non si
             * sa ancora quale sia.
             */
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            /*
             * ⛔⛔ E L'AFFIANCAMENTO VALE ANCHE QUI — anzi, soprattutto qui.
             *
             * La ragione è la stessa del blocco debug: la chiave di firma di
             * questa macchina non è quella che ha firmato l'app sul telefono
             * dell'owner, quindi un aggiornamento sul posto viene rifiutato e
             * l'unica alternativa sarebbe disinstallare — cioè cancellargli chat
             * e libreria.
             *
             * ⇒ Ma su una release pesa di più: è la build con R8 acceso, cioè
             * quella che PUÒ rompersi a runtime. Provarla è esattamente il
             * momento in cui non si vuole avere l'app vera in mezzo.
             *
             * Senza la proprietà il build è identico a prima: questo blocco non
             * fa nulla.
             */
            if (project.hasProperty('talosSideBySide')) {
                applicationIdSuffix '.dev'
                versionNameSuffix '-dev'
            }
            if (firmaDisponibile) {
                signingConfig signingConfigs.rilascio
            }
            /*
             * ⛔⛔ FASE 7(a) — qui, non nel `defaultConfig` sopra: solo la
             * build di RILASCIO porta GGML_OPENCL. Il debug resta come prima
             * — CPU, a meno che una persona non chieda un backend con
             * `-PtalosResearchBackend` per qualificarlo — perché quella
             * manopola serve a isolare i fallimenti UN backend alla volta, e
             * un default che l'accende ovunque la spegnerebbe.
             *
             * Se qualcuno passa `-PtalosResearchBackend` insieme a
             * `assembleRelease` vince la sua richiesta esplicita, non questo
             * default: altrimenti "un backend alla volta" varrebbe per il
             * debug e non per il rilascio, che è il posto dove conta di più.
             */
            if (!project.hasProperty('talosResearchBackend')) {
                def headerOpencl = file('../../third_party/opencl-headers')
                def libreriaOpencl = file("${buildDir}/opencl-icd-loader/libOpenCL.so")
                externalNativeBuild {
                    cmake {
                        arguments '-DGGML_OPENCL=ON',
                                '-DGGML_VULKAN=OFF',
                                // Stesse impostazioni già qualificate nel ramo di
                                // ricerca (§DECISIONE-0.1.17.md): profiling e i
                                // kernel binari Adreno restano spenti per la
                                // stessa ragione misurata lì.
                                '-DGGML_OPENCL_EMBED_KERNELS=ON',
                                '-DGGML_OPENCL_USE_ADRENO_KERNELS=ON',
                                '-DGGML_OPENCL_TARGET_VERSION=300',
                                "-DOpenCL_INCLUDE_DIR=${headerOpencl.path}",
                                "-DOpenCL_LIBRARY=${libreriaOpencl.path}"
                    }
                }
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            // La stessa con cui llama.cpp costruisce il proprio esempio Android.
            version '3.31.6'
        }
    }
    sourceSets {
        main {
            // ⛔ I binari del ponte NON stanno nella repo: ce li mette
            // `preparaPonteAdb` scaricandoli e verificandoli. Vedi il compito
            // sotto per il perche'.
            jniLibs.srcDirs += ["${buildDir}/ponte/jniLibs"]
            /*
             * ⛔ Nemmeno i modelli della parola di attivazione stanno nella
             * repo: ce li mette `preparaOrecchioParola`, scaricando e
             * verificando ogni impronta dichiarata in `PROVENIENZA-PAROLA.md`.
             *
             * Una cartella sola, e non tre come ai tempi di sherpa: adesso sono
             * solo pesi letti a runtime. La libreria nativa la porta
             * `onnxruntime-android` da Maven, e non c'e' nessuna interfaccia
             * Kotlin da scaricare e compilare con noi.
             */
            assets.srcDirs += ["${buildDir}/parola/assets"]
        }
    }
    packagingOptions {
        jniLibs {
            // Le librerie native vanno ESTRATTE all'installazione.
            //
            // Il predefinito moderno è lasciarle dentro l'APK e mapparle da lì:
            // occupano meno spazio e si installa più in fretta. Ma ggml cerca i
            // suoi backend ELENCANDO una cartella, e una cartella che non
            // contiene file non elenca niente — il registro resta vuoto e ogni
            // modello «non si apre». Costa ~11 MB sul dispositivo, e li paghiamo
            // per tenere le sette varianti CPU scelte a runtime, che sono ciò
            // che fa girare l'app anche sui telefoni vecchi che minSdk 26
            // ammette.
            useLegacyPackaging = true

            /*
             * ⛔⛔ LA `libOpenCL.so` DEL TELEFONO NON SI SPEDISCE — e non è una
             * questione di licenza soltanto: non funzionerebbe.
             *
             * MISURATO il 2026-08-20 sul Pad, ed è costato un giro intero.
             * Compilando con `-PtalosResearchBackend=opencl`, CMake copia nella
             * cartella di uscita la libreria contro cui ha linkato, e AGP la
             * impacchetta. Sul telefono l'esito era:
             *
             *   libggml-opencl.so  3.198.104 B  presente nella cartella nativa
             *   backend registrati: 1                        ← solo la CPU
             *
             * Cioè: la libreria c'era e non si apriva, senza un errore che lo
             * dicesse. La causa sta nelle sue dipendenze —
             *
             *   libOpenCL.so (vendor) NEEDED → liblog, libcutils, libc++, ...
             *
             * — e `libcutils.so` e `libc++.so` un'applicazione NON può
             * caricarle: vivono nello spazio dei nomi del vendor. La copia
             * dentro l'app OSCURA quella di sistema, fallisce l'apertura, e con
             * lei fallisce silenziosamente `libggml-opencl.so`.
             *
             * ⇒ Non serve spedirla. Questo Android dichiara `libOpenCL.so` fra
             * le VENDOR PUBLIC LIBRARIES — letto in logcat:
             *
             *   InitVendorPublicLibraries: … libfastcvopt.so:libOpenCL.so:…
             *
             * quindi l'app può caricare quella di sistema, che risolve le
             * proprie dipendenze dove esse vivono. Si linka contro una copia in
             * fase di build, e a runtime si usa la sua.
             *
             * ⛔ Non vale più solo per la build di ricerca. Da Fase 7(a) la
             * build di RILASCIO linka anche lei contro uno stub (l'ICD loader
             * compilato da `costruisciOpenclIcdLoader`, non un binario di
             * ricerca) — la stessa ragione vale identica: si linka a build
             * time, si usa quella di sistema a runtime, mai la propria.
             */
            excludes += '**/libOpenCL.so'
        }
    }
}

/**
 * ⛔ Le proprietà passate a Gradle NON arrivano da sole alla JVM dei test.
 *
 * Serve per `TalosPonteVeroTest`, l'unica prova che parla con un `adbd` in carne
 * e ossa: senza bersaglio si salta da sola, e con `-Dtalos.adbd=IP:PORTA` si
 * collega davvero. Senza questa riga la proprietà si perde per strada e la prova
 * risulta «saltata» anche quando gliel'hai data — cioè mente su un esito.
 */
tasks.withType(Test).configureEach {
    def bersaglio = System.getProperty('talos.adbd')
    if (bersaglio != null) systemProperty 'talos.adbd', bersaglio
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // TalosArtifactActivity, 2026-08-27: prima arrivava solo in transitiva da
    // @capacitor/android — dichiarata qui esplicitamente perché è la libreria
    // che porta il Profilo/WebViewAssetLoader su cui si regge l'isolamento
    // dell'HTML generato dal modello, non un dettaglio da lasciare implicito.
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // TalosBiometricKeyPlugin: BiometricPrompt + CryptoObject, so the database
    // key's second wrapping is bound to biometrics in the hardware Keystore.
    implementation "androidx.biometric:biometric:1.1.0"
    // P0 web-read SSRF boundary: maintained TLS/HTTP client with injectable
    // DNS so the exact validated A/AAAA set is used for the connection.
    implementation "com.squareup.okhttp3:okhttp:5.4.0"
    /*
     * ⛔⛔ IL MOTORE DELLA PAROLA DI ATTIVAZIONE — qui c'era sherpa-onnx.
     *
     * Non e' un cambio di gusto: il modello di sherpa non funzionava per questo
     * compito, e la misura sta in `src/main/jniLibs/PROVENIENZA-PAROLA.md`.
     * Adesso i tre modelli sono ONNX normali e il runtime arriva da Maven
     * invece che da un archivio scompattato a mano.
     *
     * ⛔ `abiFilters 'arm64-v8a'` sopra vale anche per questa: nell'APK entra
     * una sola architettura.
     */
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.29.0"
    // Pocket v2 stays behind its own model/runtime adapter. The module uses
    // this same pinned ORT dependency, so Gradle packages one runtime rather
    // than a second native inference stack.
    implementation project(':pocket-tts-runtime')
    /*
     * ⛔⛔ SHIZUKU E' USCITO — 2026-08-09.
     *
     * Qui c'erano `dev.rikka.shizuku:api` e `:provider`. Le due strade
     * arrivavano alla STESSA identita' — uid 2000, la shell — e su OxygenOS 16,
     * misurato, Shizuku non riusciva nemmeno ad autorizzarci: lo fa con un
     * `pm grant` che questa ROM alla shell ha tolto. La strada «preferita» era
     * quella che non funziona.
     *
     * Il ponte in casa fa lo stesso senza un'app di terzi da installare, e il
     * suo accoppiamento e' provato contro il servizio vero di Android.
     */
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // Test-only: the download policy is proved against the SAME case table
    // the TypeScript side runs, and that table is JSON. Android ships a
    // stub org.json that throws in unit tests, so the real one is needed
    // here — and only here; nothing of this reaches the APK.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// ---------------------------------------------------------------------------
// ⛔⛔ IL PONTE ADB: i binari NON stanno nella repo, si scaricano e si VERIFICANO
// ---------------------------------------------------------------------------
//
// ## Perché non sono committati
//
// Sono 56 file, 10,4 MB, e nessuno di essi l'abbiamo scritto noi. Metterli
// nella repo pubblica di TALOS significherebbe lasciarceli PER SEMPRE: la
// storia di git non si cancella, si riscrive. Undici megabyte di binari altrui
// dentro il progetto di una persona, per una scorciatoia che per contratto è
// temporanea (compito #47), sono un prezzo che non vale la pena pagare.
//
// ## ⭐ E scaricandoli si guadagna la cosa che serviva davvero
//
// La verifica delle impronte smette di essere un rito fatto una volta da me e
// diventa parte di OGNI compilazione. Se domani Termux ripubblica un pacchetto
// diverso, il build si ferma qui — non se ne accorge nessuno sei mesi dopo.
//
// La fonte di verità è `src/main/jniLibs/PROVENIENZA.md`, che invece nella repo
// c'è: è un documento leggibile da una persona, ed è lì che si passa per
// cambiare qualcosa.
import org.apache.commons.compress.archivers.ar.ArArchiveInputStream
import org.apache.commons.compress.archivers.tar.TarArchiveInputStream
import org.apache.commons.compress.compressors.xz.XZCompressorInputStream
import java.security.MessageDigest

static String improntaDi(byte[] dati) {
    return MessageDigest.getInstance('SHA-256').digest(dati).encodeHex().toString()
}

/**
 * ⛔⛔ FASE 7(a) — la libreria GPU nella build di RILASCIO, non solo nella
 * ricerca.
 *
 * Fino a qui `-PtalosResearchBackend=opencl` andava accoppiato a
 * `-PtalosOpenclRoot=<cartella>`, e quella cartella la costruiva una persona
 * a mano: header Khronos e un `libOpenCL.so` pescati da qualche parte —
 * misurato il 21/8, dal vendor di UN telefono. Buono per qualificare un
 * backend su UN dispositivo, sbagliato per una build che milioni di
 * telefoni diversi installeranno: legare l'artefatto a un binario di un
 * chip preciso non è quello che serve, perché il driver VERO si carica a
 * runtime sul telefono della persona, non a build time sul runner.
 *
 * ⇒ Questo task compila lo stesso stub che ogni sistema Linux con OpenCL usa
 * per il *linking* — l'ICD loader di Khronos, la stessa ABI che `libOpenCL.so`
 * espone ovunque — da un submodule vendorizzato
 * (`third_party/opencl-icd-loader`, pin `v2024.10.24`) contro gli header
 * vendorizzati (`third_party/opencl-headers`, pin `v2026.05.29`). Nessun
 * binario committato: si compila da sorgente ad ogni corsa, con lo stesso NDK
 * che compila llama.cpp — coerente con F-01/F-02, niente di non verificabile
 * nella catena di rilascio.
 */
tasks.register('costruisciOpenclIcdLoader') {
    description = 'Compila l\'ICD loader OpenCL dai submodule vendorizzati, per la build di rilascio'

    def sorgente = file('../../third_party/opencl-icd-loader')
    def header = file('../../third_party/opencl-headers')
    def cartellaBuild = file("${buildDir}/opencl-icd-loader")
    def libreria = file("${cartellaBuild}/libOpenCL.so")

    inputs.dir sorgente
    inputs.dir header
    outputs.file libreria

    doLast {
        if (!file("${sorgente}/CMakeLists.txt").exists()) {
            throw new GradleException(
                    "Manca ${sorgente}/CMakeLists.txt: il submodule opencl-icd-loader non e' " +
                            "inizializzato.\n   git submodule update --init mobile/third_party/opencl-icd-loader")
        }
        if (!file("${header}/CL/cl.h").exists()) {
            throw new GradleException(
                    "Manca ${header}/CL/cl.h: il submodule opencl-headers non e' inizializzato.\n" +
                            "   git submodule update --init mobile/third_party/opencl-headers")
        }

        // ⛔ Stessa regola di "il gestore si cerca, non si assume" già scritta
        // per l'NDK nel workflow di rilascio: il pacchetto cmake dell'SDK vive
        // sotto una cartella con la VERSIONE nel nome, e quella versione non è
        // la stessa su ogni macchina. Si prende la più recente installata.
        def radiceCmake = new File(android.sdkDirectory, 'cmake')
        def versioni = radiceCmake.exists() ? radiceCmake.listFiles({ f -> f.isDirectory() } as FileFilter) : null
        def cartellaCmake = versioni ? versioni.sort { it.name }.last() : null
        if (cartellaCmake == null) {
            throw new GradleException(
                    "Nessun pacchetto cmake sotto ${radiceCmake}: 'sdkmanager \"cmake;<versione>\"' prima " +
                            "di questo task.")
        }
        def binCmake = new File(cartellaCmake, 'bin')
        def eseguibileCmake = new File(binCmake, 'cmake.exe').exists() ? new File(binCmake, 'cmake.exe') : new File(binCmake, 'cmake')
        def eseguibileNinja = new File(binCmake, 'ninja.exe').exists() ? new File(binCmake, 'ninja.exe') : new File(binCmake, 'ninja')
        if (!eseguibileCmake.exists() || !eseguibileNinja.exists()) {
            throw new GradleException("cmake o ninja non trovati sotto ${binCmake}.")
        }

        def toolchain = new File(android.ndkDirectory, 'build/cmake/android.toolchain.cmake')
        if (!toolchain.exists()) {
            throw new GradleException("Toolchain NDK non trovata: ${toolchain}")
        }

        exec {
            commandLine eseguibileCmake.path, '-G', 'Ninja', '-B', cartellaBuild.path, '-S', sorgente.path,
                    "-DCMAKE_MAKE_PROGRAM=${eseguibileNinja.path}",
                    "-DCMAKE_TOOLCHAIN_FILE=${toolchain.path}",
                    '-DANDROID_ABI=arm64-v8a',
                    '-DANDROID_PLATFORM=android-26',
                    "-DOPENCL_ICD_LOADER_HEADERS_DIR=${header.path}",
                    '-DOPENCL_ICD_LOADER_BUILD_SHARED_LIBS=ON',
                    '-DOPENCL_ICD_LOADER_BUILD_TESTING=OFF',
                    '-DCMAKE_BUILD_TYPE=Release'
        }
        exec {
            commandLine eseguibileCmake.path, '--build', cartellaBuild.path, '--target', 'OpenCL'
        }

        if (!libreria.exists()) {
            throw new GradleException("La build dell'ICD loader non ha prodotto ${libreria}.")
        }
    }
}

// Deve finire PRIMA che CMake configuri la release: gli argomenti qui sotto
// le puntano dritto all'artefatto di questo task.
tasks.matching { it.name.startsWith('configureCMakeRelease') }.configureEach {
    dependsOn 'costruisciOpenclIcdLoader'
}

tasks.register('preparaPonteAdb') {
    description = 'Scarica e verifica i binari del ponte ADB dichiarati in PROVENIENZA.md'
    def scheda = file('src/main/jniLibs/PROVENIENZA.md')
    def fuori = file("${buildDir}/ponte/jniLibs/arm64-v8a")
    // La cache sta FUORI da build/: un `clean` non deve costare un altro
    // scaricamento di dieci megabyte.
    def cache = new File(gradle.gradleUserHomeDir, 'talos-ponte-adb')

    inputs.file scheda
    outputs.dir fuori

    doLast {
        if (!scheda.exists()) {
            throw new GradleException("Manca ${scheda}: senza la scheda di provenienza il ponte non si costruisce.")
        }
        def testo = scheda.getText('UTF-8')

        // Le tre tabelle, riconosciute dal numero di colonne.
        def attesi = [:]      // nome nell'APK -> [pacchetto, impronta]
        def pacchetti = [:]   // pacchetto -> [url, impronta del .deb]
        def rinominati = [:]  // nome nell'APK -> nome vero dentro il pacchetto
        testo.eachLine { riga ->
            def r = riga.trim()
            def m = (r =~ /^\|\s*`(\S+\.so)`\s*\|\s*(\S+)[^|]*\|[^|]*\|\s*`([0-9a-f]{64})`\s*\|$/)
            if (m.matches()) { attesi[m[0][1]] = [m[0][2], m[0][3]]; return }
            def d = (r =~ /^\|\s*(\S+)\s*\|\s*\[[^\]]+\]\((\S+)\)\s*\|\s*`([0-9a-f]{64})`\s*\|$/)
            if (d.matches()) { pacchetti[d[0][1]] = [d[0][2], d[0][3]]; return }
            def n = (r =~ /^\|\s*`([^`]+)`\s*\|\s*`([^`]+)`\s*\|$/)
            if (n.matches() && n[0][2].endsWith('.so')) { rinominati[n[0][2]] = n[0][1] }
        }
        if (attesi.isEmpty() || pacchetti.isEmpty()) {
            throw new GradleException(
                    "PROVENIENZA.md non ha prodotto nessuna riga: la tabella è cambiata e questo "
                            + "compito non la riconosce più. Non è una scheda vuota.")
        }

        // Cosa serve da ciascun pacchetto: nome vero dentro -> nome nell'APK.
        def daPrendere = [:].withDefault { [:] }
        attesi.each { apk, dati ->
            daPrendere[dati[0]][rinominati.getOrDefault(apk, apk)] = apk
        }

        cache.mkdirs()
        fuori.mkdirs()
        def scritti = [] as Set

        daPrendere.each { pacchetto, voluti ->
            def riga = pacchetti[pacchetto]
            if (riga == null) {
                throw new GradleException("PROVENIENZA.md cita il pacchetto '${pacchetto}' fra i file ma non fra i .deb.")
            }
            def url = riga[0]
            def improntaDeb = riga[1]
            def deb = new File(cache, url.tokenize('/').last())

            if (!deb.exists() || improntaDi(deb.bytes) != improntaDeb) {
                logger.lifecycle("ponte adb: scarico ${deb.name}")
                deb.withOutputStream { uscita -> new URL(url).withInputStream { uscita << it } }
            }
            def improntaVera = improntaDi(deb.bytes)
            if (improntaVera != improntaDeb) {
                deb.delete()
                throw new GradleException(
                        "IMPRONTA DIVERSA per ${deb.name}.\n  atteso  ${improntaDeb}\n  trovato ${improntaVera}\n"
                                + "Il pacchetto pubblicato non è più quello dichiarato in PROVENIENZA.md. "
                                + "NON si aggiorna il numero senza sapere perché è cambiato.")
            }

            // Un .deb è un archivio `ar`; dentro, `data.tar.xz`.
            byte[] corpo = null
            deb.withInputStream { flusso ->
                def ar = new ArArchiveInputStream(flusso)
                def voce
                while ((voce = ar.nextEntry) != null) {
                    if (voce.name.startsWith('data.tar')) {
                        corpo = voce.name.endsWith('.xz') ? new XZCompressorInputStream(ar).bytes : ar.bytes
                        break
                    }
                }
            }
            if (corpo == null) throw new GradleException("${deb.name}: data.tar non trovato.")

            // I .so sono spesso collegamenti: si tiene tutto e si scioglie dopo.
            def contenuti = [:]
            def collegamenti = [:]
            new TarArchiveInputStream(new ByteArrayInputStream(corpo)).withCloseable { tar ->
                def voce
                while ((voce = tar.nextEntry) != null) {
                    def percorso = voce.name
                    /*
                     * ⛔ Solo `bin/` e `lib/`, e non è pignoleria.
                     *
                     * Misurato: dentro `android-tools` ci sono TRE voci che si
                     * chiamano `adb` — il programma da 2.864.304 byte in `bin/`,
                     * e due file di completamento della shell da 13.786 e 202
                     * byte sotto `share/`. Indicizzando per solo nome vinceva
                     * l'ultima, e nell'APK sarebbe finito un file di 202 byte
                     * al posto di adb. Il controllo dell'impronta l'ha visto —
                     * ed è esattamente il caso per cui esiste.
                     */
                    if (!percorso.contains('/bin/') && !percorso.contains('/lib/')) continue
                    def base = percorso.tokenize('/').last()
                    /*
                     * ⛔ `voce.isFile()` e non `voce.file`.
                     *
                     * Misurato il 2026-08-08: Groovy, per `voce.file`, preferisce
                     * `getFile()` — che su una voce LETTA da un archivio vale
                     * sempre `null`. Nessuna voce finiva nella mappa, e l'errore
                     * che ne usciva («'libprotobuf.so' non trovato dentro il
                     * pacchetto») accusava il pacchetto invece di questa riga.
                     */
                    if (voce.isSymbolicLink() || voce.isLink()) {
                        collegamenti[base] = voce.linkName.tokenize('/').last()
                    } else if (voce.isFile()) {
                        contenuti[base] = tar.bytes
                    }
                }
            }

            voluti.each { vero, apk ->
                def nome = vero
                def giri = 0
                while (contenuti[nome] == null && collegamenti[nome] != null && giri++ < 8) {
                    nome = collegamenti[nome]
                }
                def dati = contenuti[nome]
                if (dati == null) throw new GradleException("${deb.name}: '${vero}' non trovato dentro il pacchetto.")

                def atteso = attesi[apk][1]
                def trovata = improntaDi(dati)
                if (trovata != atteso) {
                    throw new GradleException(
                            "IMPRONTA DIVERSA per ${apk} (da ${deb.name}).\n  atteso  ${atteso}\n  trovato ${trovata}")
                }
                new File(fuori, apk).bytes = dati
                scritti << apk
            }
        }

        if (scritti != attesi.keySet()) {
            throw new GradleException("Mancano dal ponte: ${attesi.keySet() - scritti}")
        }
        logger.lifecycle("ponte adb: ${scritti.size()} binari verificati contro PROVENIENZA.md")
    }
}

// ⛔ PRIMA della compilazione, sempre. Un ponte a metà non è un ponte, e un APK
// senza questi file si installa benissimo e poi non sa accoppiarsi.
/**
 * ⭐⭐ I MODELLI DELLA PAROLA DI ATTIVAZIONE — scaricati e verificati, non commessi.
 *
 * Stessa disciplina del ponte `adb`, e per la stessa ragione: la verifica delle
 * impronte smette di essere un rito fatto una volta e diventa parte di OGNI
 * compilazione. La scheda leggibile e' `src/main/jniLibs/PROVENIENZA-PAROLA.md`,
 * e li' c'e' anche la MISURA che ha mandato via sherpa-onnx.
 *
 * ⛔ Una destinazione sola. Prima erano tre perche' sherpa portava una libreria
 * nativa, dei pesi e delle fonti Kotlin da compilare con noi; adesso il runtime
 * arriva da Maven e restano solo pesi letti a runtime.
 *
 * ⛔ Si verifica ANCHE il numero di byte, non solo l'impronta. Non aggiunge
 * sicurezza — l'impronta basta — ma quando qualcosa non torna dice subito se hai
 * scaricato un file diverso o una pagina di errore travestita da file.
 */
tasks.register('preparaOrecchioParola') {
    description = 'Scarica e verifica i modelli della parola di attivazione dichiarati in PROVENIENZA-PAROLA.md'
    def scheda = file('src/main/jniLibs/PROVENIENZA-PAROLA.md')
    def fuori = file("${buildDir}/parola/assets/parola")
    // La cache sta FUORI da build/: un `clean` non deve costare un altro
    // scaricamento di tre megabyte e mezzo.
    def cache = new File(gradle.gradleUserHomeDir, 'talos-orecchio-parola')

    inputs.file scheda
    outputs.dir fuori

    doLast {
        if (!scheda.exists()) {
            throw new GradleException(
                    "Manca ${scheda}: senza la scheda di provenienza la parola di attivazione non si costruisce.")
        }
        def testo = scheda.getText('UTF-8')

        def attesi = [:]      // nome nell'APK -> [byte, impronta]
        def rinominati = [:]  // nome nell'APK -> nome nel rilascio
        def inCasa = [:]      // nome nell'APK -> [percorso nel repo, byte, impronta]
        def base = null
        testo.eachLine { riga ->
            def r = riga.trim()
            def b = (r =~ /^Base: `(\S+)`$/)
            if (b.matches()) { base = b[0][1]; return }
            def f = (r =~ /^\|\s*`(parola\/[^`]+)`\s*\|\s*(\d+)\s*\|\s*`([0-9a-f]{64})`\s*\|$/)
            if (f.matches()) { attesi[f[0][1]] = [f[0][2].toLong(), f[0][3]]; return }
            /*
             * ⛔⛔ I FILE NATI IN CASA — quattro colonne, e non si scaricano.
             *
             * `talos.onnx` l'abbiamo addestrato noi: non esiste nessun URL da
             * cui prenderlo, e la regola «niente binari nella repo» qui non si
             * puo' applicare — il binario È la funzione, e senza di lui l'APK
             * non ha la parola di attivazione.
             *
             * ⇒ Cambia DA DOVE arriva, non SE si verifica: peso e impronta si
             * controllano identici agli altri. Se qualcuno tocca il file senza
             * aggiornare la scheda, la build si ferma esattamente come per un
             * file pubblicato che cambia sotto i piedi.
             */
            def c = (r =~ /^\|\s*`(parola\/[^`]+)`\s*\|\s*`([^`]+)`\s*\|\s*(\d+)\s*\|\s*`([0-9a-f]{64})`\s*\|$/)
            if (c.matches()) { inCasa[c[0][1]] = [c[0][2], c[0][3].toLong(), c[0][4]]; return }
            def n = (r =~ /^\|\s*`(parola\/[^`]+)`\s*\|\s*`([^`]+)`\s*\|$/)
            if (n.matches()) { rinominati[n[0][1]] = n[0][2] }
        }
        if (attesi.isEmpty() || base == null) {
            throw new GradleException(
                    "PROVENIENZA-PAROLA.md non ha prodotto le righe attese (file=${attesi.size()}, base=${base}). " +
                            "La tabella e' cambiata e questo compito non la riconosce piu'. Non e' una scheda vuota.")
        }

        cache.mkdirs()
        fuori.mkdirs()

        attesi.each { apk, dati ->
            def peso = dati[0]
            def impronta = dati[1]
            def nomeVero = rinominati.getOrDefault(apk, apk).tokenize('/').last()
            def giu = new File(cache, nomeVero)

            if (!giu.exists() || improntaDi(giu.bytes) != impronta) {
                logger.lifecycle("parola: scarico ${nomeVero}")
                giu.withOutputStream { uscita -> new URL(base + nomeVero).withInputStream { uscita << it } }
            }
            if (giu.length() != peso) {
                def trovato = giu.length()
                giu.delete()
                throw new GradleException(
                        "PESO DIVERSO per ${nomeVero}.\n  atteso  ${peso} byte\n  trovato ${trovato} byte\n" +
                                "Quasi sempre vuol dire che al posto del file e' arrivata una pagina di errore.")
            }
            def vera = improntaDi(giu.bytes)
            if (vera != impronta) {
                giu.delete()
                throw new GradleException(
                        "IMPRONTA DIVERSA per ${nomeVero}.\n  atteso  ${impronta}\n  trovato ${vera}\n" +
                                "Il file pubblicato non e' piu' quello dichiarato in PROVENIENZA-PAROLA.md. " +
                                "NON si aggiorna il numero senza sapere perche' e' cambiato.")
            }

            def destinazione = new File(fuori.parentFile, apk)
            destinazione.parentFile.mkdirs()
            destinazione.bytes = giu.bytes
        }

        /*
         * ⛔ I NOSTRI: stessa verifica, altra provenienza.
         *
         * Non c'e' niente da scaricare — il file e' nel repo perche' l'abbiamo
         * addestrato noi — ma peso e impronta si controllano lo stesso. Un
         * modello sostituito di nascosto ferma la build come uno pubblicato che
         * cambia sotto i piedi.
         */
        inCasa.each { apk, dati ->
            def sorgente = file(dati[0])
            def peso = dati[1]
            def impronta = dati[2]
            if (!sorgente.exists()) {
                throw new GradleException(
                        "MANCA ${dati[0]}, dichiarato in PROVENIENZA-PAROLA.md come modello nostro. " +
                                "Senza, l'APK non ha la parola di attivazione: non e' un file opzionale.")
            }
            if (sorgente.length() != peso) {
                throw new GradleException(
                        "PESO DIVERSO per ${dati[0]}.\n  atteso  ${peso} byte\n  trovato ${sorgente.length()} byte\n" +
                                "Il modello e' stato sostituito senza aggiornare la scheda.")
            }
            def vera = improntaDi(sorgente.bytes)
            if (vera != impronta) {
                throw new GradleException(
                        "IMPRONTA DIVERSA per ${dati[0]}.\n  atteso  ${impronta}\n  trovato ${vera}\n" +
                                "NON si aggiorna il numero senza sapere quale addestramento ha prodotto questo file.")
            }
            def destinazione = new File(fuori.parentFile, apk)
            destinazione.parentFile.mkdirs()
            destinazione.bytes = sorgente.bytes
        }
        logger.lifecycle("parola: ${attesi.size()} scaricati + ${inCasa.size()} nostri, verificati contro PROVENIENZA-PAROLA.md")
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'preparaPonteAdb', 'preparaOrecchioParola' }
