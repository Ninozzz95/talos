name: An idea
description: Something TALOS should be able to do, or do better
labels: [idea]
body:
  - type: textarea
    id: cosa
    attributes:
      label: What you would like to be able to say to TALOS
      description: The sentence you would actually use, not the feature name.
      placeholder: '"remind me to call the plumber when I get home"'
    validations:
      required: true

  - type: textarea
    id: perche
    attributes:
      label: What you do today instead
      description: |
        This matters more than it looks: it tells us whether the missing thing is
        the capability or the way to ask for it.
    validations:
      required: true

  - type: dropdown
    id: dove
    attributes:
      label: Where would you use it?
      options:
        - In the assistant bar, hands busy
        - In the chat, sitting down
        - Both
