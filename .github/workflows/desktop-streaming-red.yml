name: desktop-streaming-red

on:
  pull_request:
    branches: [main]
    paths:
      - 'harness-ui/**'
      - 'context-engine/**'
      - '.github/workflows/desktop-streaming-red.yml'

permissions:
  contents: read

jobs:
  streaming-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: harness-ui/package-lock.json

      # Il banco avvia server.mjs davvero: node-pty deve quindi avere il suo modulo nativo.
      - name: dipendenze server
        run: npm ci
        working-directory: harness-ui

      - name: dipendenze frontend
        run: npm ci
        working-directory: harness-ui/frontend

      - name: dipendenze context engine
        run: npm ci
        working-directory: context-engine

      - name: browser
        run: npx playwright install --with-deps chromium
        working-directory: harness-ui/frontend

      - name: test RED streaming Desktop
        run: >-
          npx playwright test
          -c playwright.componenti.config.mjs
          nessun-errore-a-runtime.spec.mjs
          --grep 'STREAMING-LIVE-SMOOTH-02|RELEASE-018-PROMPT-ENHANCE'
          --project desktop-1280x800
          --reporter=line
        working-directory: harness-ui/frontend

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-streaming-red-resti
          path: harness-ui/frontend/test-results/
          retention-days: 7
