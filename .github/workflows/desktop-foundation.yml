name: desktop-foundation
on:
  pull_request:
    branches: [main]
    paths: ['harness-ui/frontend/**', '.github/workflows/desktop-foundation.yml']
permissions:
  contents: read
concurrency:
  group: desktop-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    if: github.repository == 'Ninozzz95/talos' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/desktop-ledger-v1'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - name: Install locked dependencies, without transforming source
        run: |
          New-Item -ItemType Directory -Force evidence/foundation | Out-Null
          foreach ($dir in @('harness-ui','harness-ui/frontend','harness-ui/desktop','context-engine')) {
            npm ci --prefix $dir --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "Dependencies failed: $dir" }
          }
          node harness-ui/frontend/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed.' }
      - name: Typecheck is separate from the build
        run: |
          npm --prefix harness-ui/frontend run typecheck 2>&1 | Tee-Object evidence/foundation/typecheck.log
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed.' }
      - name: Build and deliver this checkout's actual frontend
        run: |
          npm --prefix harness-ui/frontend run build 2>&1 | Tee-Object evidence/foundation/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          Copy-Item harness-ui/frontend/dist/* harness-ui/public/ -Recurse -Force
          if ((Get-FileHash harness-ui/frontend/dist/app.js).Hash -cne (Get-FileHash harness-ui/public/app.js).Hash) { throw 'Stale delivered assets.' }
      - name: Complete frontend unit and contract suite, with dist present
        run: |
          npm --prefix harness-ui/frontend run test:unit 2>&1 | Tee-Object evidence/foundation/unit.log
          if ($LASTEXITCODE -ne 0) { throw 'Unit/contract suite failed.' }
      - name: Existing real Electron shell and terminal suite
        run: |
          npm --prefix harness-ui/desktop run test:puri 2>&1 | Tee-Object evidence/foundation/desktop-pure.log
          if ($LASTEXITCODE -ne 0) { throw 'Desktop pure tests failed.' }
          npm --prefix harness-ui/desktop run test:guscio 2>&1 | Tee-Object evidence/foundation/electron.log
          if ($LASTEXITCODE -ne 0) { throw 'Electron integration failed.' }
      - name: Observe the integrated real app without API stubs
        env:
          TALOS_CAPTURE_COMMIT: ${{ github.event.pull_request.head.sha }}
          TALOS_CAPTURE_OUTPUT: ${{ github.workspace }}/evidence/foundation/runtime
        run: |
          node harness-ui/frontend/scripts/ledger-capture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Real application observation failed.' }
          $r = Get-Content evidence/foundation/runtime/baseline.json -Raw | ConvertFrom-Json
          if (-not $r.completed -or $r.errors.Count -ne 0) { throw 'Runtime errors or incomplete observation.' }
          $observed = @($r.surfaces | Where-Object { $_.status -eq 'OBSERVED' })
          if ($observed.Count -lt 20) { throw 'Insufficient real surfaces observed.' }
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ledger-foundation-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
