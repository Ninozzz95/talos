name: phase3a-batch

on:
  push:
    branches:
      - feat/phase3a-batch-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: harness-ui/package-lock.json
      - name: dipendenze backend
        run: npm ci --prefix harness-ui --no-audit --no-fund
      - name: contratto batch Fase 3A
        run: node --test harness-ui/tests/http-routes-batch-phase3.test.mjs
