name: evolution-extension-prototype
on:
  pull_request:
    paths:
      - 'harness-ui/native/evolution-prototype/**'
      - 'harness-ui/src/evolution-dev/**'
      - 'harness-ui/src/evolution-dev-adapter.mjs'
      - 'harness-ui/tests/evolution-dev-adapter.test.mjs'
      - 'harness-ui/scripts/evolution-dev.mjs'
      - '.github/workflows/evolution-extension-prototype.yml'
permissions:
  contents: read
jobs:
  windows-contained-component:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: harness-ui/native/evolution-prototype
        shell: pwsh
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: provision pinned compiler and dependency inventory
        run: |
          New-Item -ItemType Directory -Path evidence | Out-Null
          rustup toolchain install 1.90.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Compiler provisioning failed' }
          rustc -Vv | Tee-Object evidence/rustc.txt
          if (-not (Test-Path Cargo.lock)) { throw 'Reviewed lockfile missing; resolution is not allowed in verification' }
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Dependency provisioning failed' }
          git diff --exit-code -- Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Provisioning changed the reviewed dependency inventory' }
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          $inputs = @(Get-ChildItem src,contracts,fixtures,tests -File -Recurse)
          $inputs += @(Get-Item Cargo.toml,Cargo.lock,rust-toolchain.toml,build.rs)
          $inputs += @(Get-ChildItem ../../src/evolution-dev -File)
          $inputs += @(Get-Item ../../src/evolution-dev-adapter.mjs,../../tests/evolution-dev-adapter.test.mjs,../../scripts/evolution-dev.mjs)
          $manifest = [ordered]@{
            schema = 'talos.extension-prototype.inputs.v1'
            checkout = (& git rev-parse HEAD)
            head = $env:PR_HEAD_SHA
            os = [Environment]::OSVersion.VersionString
            processArchitecture = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            osArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            launcherElevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
            productReady = $false
            sources = @($inputs | Sort-Object FullName | ForEach-Object {
              @{ path = [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName); sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            })
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 evidence/sources.json
      - name: unit tests and real contained worker
        run: |
          cargo test --frozen -- --test-threads=1 2>&1 | Tee-Object evidence/tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo build --bins --frozen 2>&1 | Tee-Object evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          & ./target/debug/talos-supervisor-prototype.exe --self-test | Tee-Object evidence/invocation.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Contained invocation failed' }
          Get-FileHash target/debug/talos-extension-worker.exe -Algorithm SHA256 | Format-List | Out-File evidence/worker-hash.txt
          git rev-parse HEAD | Out-File evidence/checkout.txt
          git diff --exit-code -- Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Verification changed the reviewed lockfile' }
      - name: explicit lifecycle fault injection (not part of default binaries)
        run: |
          cargo test --frozen --features fault-injection --test lifecycle -- --test-threads=1 --nocapture 2>&1 | Tee-Object evidence/lifecycle.log
          if ($LASTEXITCODE -ne 0) { throw 'Lifecycle fault injection failed' }
          git diff --exit-code -- Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Fault verification changed reviewed dependencies' }
      - name: opt-in Node development adapter and actual native bridge
        run: |
          node --test ../../tests/evolution-dev-adapter.test.mjs 2>&1 | Tee-Object evidence/dev-adapter-unit.log
          if ($LASTEXITCODE -ne 0) { throw 'Node development adapter tests failed' }
          cargo test --frozen --features dev-adapter --target-dir target/dev-adapter --lib -- --test-threads=1 2>&1 | Tee-Object evidence/dev-bridge-rust.log
          if ($LASTEXITCODE -ne 0) { throw 'Native development bridge unit tests failed' }
          cargo build --frozen --features dev-adapter --target-dir target/dev-adapter --bins 2>&1 | Tee-Object evidence/dev-bridge-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Development bridge build failed' }
          node --test --test-concurrency=1 tests/dev-adapter.integration.mjs 2>&1 | Tee-Object evidence/dev-adapter-integration.log
          if ($LASTEXITCODE -ne 0) { throw 'Real Node/native adapter integration failed' }
          git diff --exit-code -- Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Development build changed reviewed lockfile' }
      - name: retain failure logs and exact dependency inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extension-prototype-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            harness-ui/native/evolution-prototype/evidence/
            harness-ui/native/evolution-prototype/Cargo.lock
          if-no-files-found: error
          retention-days: 14
