name: sidebar-bootstrap

# Temporary, PR-scoped transport for the desktop verification workspace.
# No secrets, repository credentials, releases or writes are included.
on:
  pull_request:
    paths:
      - '.github/workflows/sidebar-bootstrap.yml'

permissions:
  contents: read

jobs:
  workspace:
    if: github.event.pull_request.number == 32 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install locked desktop dependencies
        run: |
          npm ci --prefix harness-ui
          npm ci --prefix harness-ui/frontend
          npm ci --prefix context-engine
      - name: Package tracked sources and test dependencies without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sidebar-workspace/repo" "$RUNNER_TEMP/sidebar-workspace/tools"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/sidebar-workspace/repo"
          for dir in harness-ui harness-ui/frontend context-engine; do
            cp -a "$dir/node_modules" "$RUNNER_TEMP/sidebar-workspace/repo/$dir/node_modules"
          done
          cp "$(command -v node)" "$RUNNER_TEMP/sidebar-workspace/tools/node"
          git rev-parse HEAD > "$RUNNER_TEMP/sidebar-workspace/source-commit.txt"
          node --version > "$RUNNER_TEMP/sidebar-workspace/node-version.txt"
          tar -czf "$RUNNER_TEMP/sidebar-workspace.tar.gz" -C "$RUNNER_TEMP/sidebar-workspace" .
          sha256sum "$RUNNER_TEMP/sidebar-workspace.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sidebar-workspace
          path: ${{ runner.temp }}/sidebar-workspace.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
