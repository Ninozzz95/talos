# Temporary, PR29-only publication bridge for a locally tested, hash-locked patch.
# Removed after publication; never targets main and never merges a PR.
name: local-kernel-publish-once
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/local-kernel-publication/**'
      - '.github/workflows/local-kernel-publish-once.yml'
permissions:
  contents: read
jobs:
  publish-verified-patch:
    if: github.event.pull_request.number == 29 && github.event.pull_request.head.repo.full_name == 'Ninozzz95/talos' && github.event.pull_request.head.ref == 'feat/desktop-local-kernel-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Verify base, patch, allowed paths and exact source bytes
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path('.github/local-kernel-publication')
          manifest=json.loads((root/'manifest.json').read_text())
          subprocess.run(['git','merge-base','--is-ancestor',manifest['base'],'HEAD'],check=True)
          sources=manifest['sources']
          assert len(sources)==13 and all(p.startswith('harness-ui/') and '..' not in pathlib.PurePosixPath(p).parts for p in sources)
          def digest(p):
              f=pathlib.Path(p)
              assert not f.is_symlink()
              return hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else None
          if all(digest(p)==v['after'] for p,v in sources.items()):
              with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('applied=false\n')
              raise SystemExit(0)
          assert all(digest(p)==v['before'] for p,v in sources.items()), 'preimage mismatch'
          parts=[(root/f'part{i}.txt').read_text().strip() for i in range(1,5)]
          # Repair the two base64 characters lost in connector transcription;
          # decoded patch and every resulting source still require exact hashes.
          assert parts[0].count('Rp9WuKeZqO')==1
          parts[0]=parts[0].replace('Rp9WuKeZqO','Rp9WuKeVeZqO')
          patch=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()==manifest['patchSha256']
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'local-kernel-verified.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          staged=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert staged==set(sources), 'unexpected changed paths'
          assert all(digest(p)==v['after'] for p,v in sources.items()), 'postimage mismatch'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('applied=true\n')
          PY
      - name: Install unchanged locked dependencies
        if: steps.patch.outputs.applied == 'true'
        run: npm ci --prefix harness-ui && npm ci --prefix context-engine
      - name: Verify new and existing kernel contract tests before publishing
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test harness-ui/tests/local-kernel-*.test.mjs harness-ui/tests/local-engine-source-baseline.test.mjs harness-ui/tests/local-runtime-llama-server.test.mjs | tee "$RUNNER_TEMP/local-kernel-new.tap"
          node --test harness-ui/tests/session-registry.test.mjs harness-ui/tests/agent-service.test.mjs harness-ui/tests/model-destination.test.mjs harness-ui/tests/runtime-owner-adapter-fallback.test.mjs harness-ui/tests/kernel-loop-locale-e-stop.test.mjs | tee "$RUNNER_TEMP/local-kernel-existing.tap"
      - name: Commit only the verified patch to the exact feature branch
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(desktop): route opt-in local sessions through the shared agent kernel' -m 'Verified against the locally tested patch SHA256 73dba26f95c08ded970df8c2017bca4beef72d1605f2019615dbd1b26c1571c6. Native tool completion barrier, exact process binding, permission-safe continuation, deterministic loopback integration tests and fixture benchmark. Default off; no real inference speedup claimed.'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push https://github.com/Ninozzz95/talos.git HEAD:refs/heads/feat/desktop-local-kernel-pipeline
      - name: Retain TAP evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-kernel-publication-tests
          path: ${{ runner.temp }}/local-kernel-*.tap
          retention-days: 7
          if-no-files-found: warn
