name: desktop-prompt-enhance

on:
  push:
    branches:
      - fix/desktop-prompt-enhance
    paths:
      - 'harness-ui/**'
      - 'context-engine/**'
      - '.github/workflows/desktop-prompt-enhance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'harness-ui/**'
      - 'context-engine/**'
      - '.github/workflows/desktop-prompt-enhance.yml'

permissions:
  contents: write

jobs:
  prompt-enhance-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            harness-ui/package-lock.json
            context-engine/package-lock.json

      - name: dipendenze server
        run: npm ci
        working-directory: harness-ui

      - name: dipendenze context engine
        run: npm ci
        working-directory: context-engine

      - name: applica patch Prompt Enhance verificata
        if: github.event_name == 'push'
        run: node scripts/apply-prompt-enhance-provider-fix.mjs
        working-directory: harness-ui

      - name: regressione Prompt Enhance Desktop
        run: node --test tests/http-routes-migliora-prompt-provider.test.mjs tests/http-routes-migliora-prompt.test.mjs
        working-directory: harness-ui

      - name: committa patch solo dopo GREEN
        if: github.event_name == 'push' && success()
        shell: bash
        run: |
          if git diff --quiet -- harness-ui/src/http-app.mjs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add harness-ui/src/http-app.mjs
          git commit -m 'fix(desktop): use session provider for prompt enhancer'
          git push origin HEAD:fix/desktop-prompt-enhance
