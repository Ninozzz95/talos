name: desktop-ledger-command-entry
on:
  push:
    branches: ['refactor/desktop-ledger-2026-09-17']
    paths: ['.github/workflows/desktop-ledger-command-entry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'Ninozzz95/talos' && github.ref == 'refs/heads/refactor/desktop-ledger-2026-09-17'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.patch.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - id: patch
        name: Apply fixed-path pre/post-verified microcopy and packaged-navigation changes
        env:
          REVIEWED_PATCH: 
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { readFile, lstat } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { dirname } from 'node:path';
          const hash = b => createHash('sha256').update(b).digest('hex');
          const bytes = brotliDecompressSync(Buffer.from(process.env.REVIEWED_PATCH, 'base64'), { maxOutputLength: 256 * 1024 });
          if (hash(bytes) !== '4658f67e3fa4baddf879c4285a05112eb5d4ee0948b93b0d799b18fd3c51da29') throw Error('Reviewed patch checksum mismatch.');
          const data = JSON.parse(bytes);
          const paths = new Set(['harness-ui/frontend/src/features/navigation/command-palette.ts', 'harness-ui/frontend/src/i18n/workspace-en.js', 'harness-ui/frontend/src/features/navigation/workspace-chrome.ts', 'harness-ui/frontend/tests/qualification/workspace-real.mjs', 'harness-ui/desktop/scripts/ledger-preview-smoke.mjs']);
          if (data.schema !== 'talos.reviewed-patch.v1' || data.scope !== 'NAV-02-polish' || data.files.length !== paths.size) throw Error('Unexpected patch scope.');
          for (const f of data.files) {
            if (!paths.delete(f.path)) throw Error('Unreviewed or duplicate path.');
            for (let p = f.path; p !== '.'; p = dirname(p)) if ((await lstat(p)).isSymbolicLink()) throw Error('Symlink in reviewed path.');
            if (hash(await readFile(f.path)) !== f.before) throw Error('Source moved; refusing overwrite: ' + f.path);
          }
          if (execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' }).trim()) throw Error('Dirty source checkout.');
          execFileSync('git', ['apply', '--check', '--whitespace=error', '-'], { input: data.patch });
          execFileSync('git', ['apply', '--whitespace=error', '-'], { input: data.patch });
          for (const f of data.files) if (hash(await readFile(f.path)) !== f.after) throw Error('Incorrect patch result.');
          console.log('Five reviewed source files applied with exact pre/post hashes.');
          JS
          git diff --check
          git add -- harness-ui/frontend harness-ui/desktop/scripts/ledger-preview-smoke.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(desktop): finish bilingual command chrome and qualify actual packaged navigation'
          git push origin HEAD:refs/heads/refactor/desktop-ledger-2026-09-17
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  qualify:
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-ledger-preview.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
