# I cancelli, su ogni proposta di modifica.
#
# ⛔⛔ QUI GIRA ANCHE ANDROID, e prima non era così.
#
# Questo commento diceva: «la build Android non serve — il difetto che
# troverebbe (un errore Kotlin) lo trova comunque chi la propone, perché senza
# build non ha potuto provarla su un telefono».
#
# Il ragionamento reggeva finché il difetto immaginato era un errore Kotlin. Il
# 2026-08-18 ne è stato trovato un altro, e verificato nel codice: un
# use-after-free nel ponte JNI, fra `chatPrompt()` e `nativeGenerate()`.
#
# ⇒ QUELLO non lo trova chi prova l'app sul telefono: non si manifesta quasi
# mai, e quando si manifesta è un crash senza stack leggibile. Un cancello non
# può dichiarare pronta una release su codice che non ha mai compilato.
#
# ⛔⛔ QUESTO FILE VIVE IN DUE REPOSITORY CON DUE DISPOSIZIONI DIVERSE.
#
# Nello sviluppo l'app sta in `mobile/`. Nel repo pubblicato **quella cartella È
# la radice**, e `mobile/` non esiste. Un percorso scritto a mano è quindi
# giusto in uno e falso nell'altro, e lo sbaglia in silenzio.
#
# MISURATO il 2026-08-16: la prima corsa sul repo pubblico è morta in **16
# secondi** su `cache-dependency-path: mobile/package-lock.json` — «Some
# specified paths were not resolved» — pubblicando un badge rosso su un progetto
# sano. Sedici secondi sono troppo pochi per essere i test: quando un cancello
# muore così in fretta, non ha bocciato niente, non è nemmeno partito.
#
# ⇒ Perciò qui non si dichiara dove sta l'app: **si chiede al checkout**. È la
# stessa regola del telefono — si interroga la macchina, non una tabella scritta
# a mano che invecchia e mente.
name: gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      # ⛔ @v7 e non @v4: le versioni v4 dichiarano `using: node20`, e dal
      # 2025-09-19 GitHub le fa girare forzatamente su Node 24 stampando un
      # avviso a ogni corsa. Un avviso che compare sempre smette di essere
      # letto, e quando ne arriva uno che conta nessuno lo vede.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Una domanda sola, e tutti i passi dopo ne dipendono. Se un giorno la
      # disposizione cambia ancora, cambia qui e basta.
      #
      # ⛔ E fallisce SUBITO se non trova il lockfile da nessuna delle due
      # parti: senza, `npm ci` morirebbe più tardi con un errore che parla
      # d'altro, e si andrebbe a cercare il guasto nel posto sbagliato.
      - id: dove
        name: dove sta l'app
        run: |
          if [ -f mobile/package.json ]; then dir=mobile; else dir=.; fi
          if [ ! -f "$dir/package-lock.json" ]; then
            echo "::error::nessun package-lock.json né alla radice né in mobile/ — la disposizione del repo non è una delle due previste"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "l'app sta in: $dir"

      # ⛔ La versione NON è una scelta: `package.json` dichiara
      # `node >=24.18.0 <25` e `npm >=11.16.0 <12`. Fino al 2026-08-16 qui
      # c'era scritto 20, che porta npm 10 — un cancello che gira su un runtime
      # che il progetto non supporta non sta provando la stessa cosa che gira
      # sul computer di chi scrive.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: ${{ steps.dove.outputs.dir }}/package-lock.json

      # ⛔ `ci` e non `install`: rispetta il lockfile alla lettera. Un `install`
      # può risolvere una versione diversa da quella provata, e il primo posto
      # in cui te ne accorgi è un test che fallisce per ragioni che non c'entrano.
      - run: npm ci
        working-directory: ${{ steps.dove.outputs.dir }}

      # ⛔ Il lanciatore tiene le sue dipendenze native ISOLATE, di proposito:
      # `node-pty` non deve mai finire nel package.json di mobile. Ma allora
      # vanno installate a parte — e finché nessuno lo diceva, chi clonava la
      # repo trovava 40 test rossi al primo colpo.
      - name: dipendenze del lanciatore
        run: npm ci
        working-directory: ${{ steps.dove.outputs.dir }}/tools/git-bash-launcher

      - name: typecheck
        run: npm run typecheck
        working-directory: ${{ steps.dove.outputs.dir }}

      - name: test
        run: npx vitest run
        working-directory: ${{ steps.dove.outputs.dir }}

      # ⛔ Il tetto del grafo d'avvio: l'app deve aprirsi in fretta, e questo
      # gate è l'unico posto in cui una regressione di peso si vede prima che
      # qualcuno la senta sul telefono.
      - name: build
        run: npm run build
        working-directory: ${{ steps.dove.outputs.dir }}

      - name: grafo d'avvio
        run: node scripts/verify-initial-chunk.mjs
        working-directory: ${{ steps.dove.outputs.dir }}

  # ⛔⛔⛔ ANDROID E IL C++ ENTRANO NEI CANCELLI, e la ragione è un difetto vero.
  #
  # Questo file diceva: «qui NON gira la build Android — il difetto che troverebbe
  # (un errore Kotlin) lo trova comunque chi la propone, perché senza build non ha
  # potuto provarla su un telefono».
  #
  # Il ragionamento reggeva finché il difetto immaginato era un errore Kotlin. Il
  # 2026-08-18 una revisione esterna ne ha trovato un altro, e verificato nel
  # codice: `chatPrompt()` arrivava a `common_sampler_free()` da un thread mentre
  # `nativeGenerate()` dereferenziava lo stesso puntatore da un altro. Un
  # use-after-free nel ponte JNI.
  #
  # ⇒ Quel difetto non lo trova chi propone provando l'app sul telefono: non si
  # manifesta quasi mai, e quando si manifesta è un crash senza stack leggibile.
  # È attraversato un CI che non tocca quello strato — e un cancello non può
  # dichiarare che una release sia pronta su codice che non ha mai compilato.
  #
  # ⛔ Il lavoro è SEPARATO da quello web apposta. Un rosso deve dire QUALE
  # strato: «i gate sono rossi» manda a leggere un log di dodici minuti.
  android:
    runs-on: ubuntu-latest
    steps:
      # ⛔ `submodules: recursive` — senza, `third_party/llama.cpp` arriva come
      # cartella vuota e il build nativo muore parlando d'altro.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      # La stessa domanda del lavoro web: nel repo pubblicato `mobile/` non
      # esiste, è la radice. Si chiede al checkout, non si scrive a mano.
      - id: dove
        name: dove sta l'app
        run: |
          if [ -f mobile/package.json ]; then dir=mobile; else dir=.; fi
          if [ ! -f "$dir/package-lock.json" ]; then
            echo "::error::package-lock.json non trovato né in mobile/ né nella radice"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.dove.outputs.dir }}/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # ⛔ MISURATO il 2026-08-16 sul manifesto di `ubuntu-latest`: ha 27.3, 28.2
      # e 29.0 — la nostra NON c'è. Il pin in `app/build.gradle` non si tocca per
      # far contento un runner: «il motore locale è compilato da questo NDK, e una
      # versione diversa è un compilatore diverso».
      - name: l'NDK che il motore locale pretende
        run: |
          set -euo pipefail
          atteso=$(grep -oE 'ndkVersion = "[^"]+"' \
            "${{ steps.dove.outputs.dir }}/android/app/build.gradle" | cut -d'"' -f2)
          echo "il build pretende NDK $atteso"
          if [ -d "$ANDROID_HOME/ndk/$atteso" ]; then
            echo "gia' presente"
          else
            gestore=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
            if [ -z "$gestore" ]; then
              echo "::error::sdkmanager non trovato sotto $ANDROID_HOME/cmdline-tools"
              exit 1
            fi
            yes | "$gestore" --licenses > /dev/null 2>&1 || true
            "$gestore" "ndk;$atteso"
          fi
          test -d "$ANDROID_HOME/ndk/$atteso" \
            || { echo "::error::NDK $atteso non installabile su questo runner"; exit 1; }

      - run: npm ci
        working-directory: ${{ steps.dove.outputs.dir }}

      # ⛔ Il web serve anche qui: `cap sync` copia `dist/` dentro gli asset
      # dell'app, e senza quella cartella il build Android muore su un file
      # mancante invece che su un errore vero.
      - name: build web
        run: npm run build
        working-directory: ${{ steps.dove.outputs.dir }}

      - name: sync android
        run: npx cap sync android
        working-directory: ${{ steps.dove.outputs.dir }}

      # ⭐ Qui dentro c'è `externalNativeBuild`: è il passo che compila il ponte
      # JNI e llama.cpp. È lo strato dove viveva il P0, ed è la ragione per cui
      # questo lavoro esiste.
      - name: compila tutto, C++ compreso
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: ${{ steps.dove.outputs.dir }}/android

      - name: i test Java
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: ${{ steps.dove.outputs.dir }}/android

      # ⛔ `lint` e non `lintDebug --continue`: un rilievo di Lint su una app che
      # tocca permessi, filesystem cifrato e ponte nativo non è una nota di stile.
      - name: lint android
        run: ./gradlew :app:lintDebug --no-daemon
        working-directory: ${{ steps.dove.outputs.dir }}/android

  # ⛔⛔⛔ E I TEST NEL BROWSER, che non giravano mai.
  #
  # Il 2026-08-18 la suite e2e era ROTTA — tutti e cinquantadue — e nessuno lo
  # sapeva: `[aria-label="Open menu"]` esisteva nel DOM ma restava dietro la
  # schermata di scelta lingua, che è un componente a caricamento pigro e
  # compariva a volte prima e a volte dopo il click.
  #
  # ⇒ Un test che non gira non è un test: è un file. E il motivo per cui il
  # difetto è potuto restare lì per settimane è ESATTAMENTE l'assenza di questo
  # lavoro.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: dove
        name: dove sta l'app
        run: |
          if [ -f mobile/package.json ]; then dir=mobile; else dir=.; fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.dove.outputs.dir }}/package-lock.json

      - run: npm ci
        working-directory: ${{ steps.dove.outputs.dir }}

      # ⛔ Solo il browser che serve. Scaricarli tutti e tre costa minuti per
      # coprire piattaforme su cui questa app non gira.
      - name: il browser
        run: npx playwright install --with-deps chromium
        working-directory: ${{ steps.dove.outputs.dir }}

      - name: build web
        run: npm run build
        working-directory: ${{ steps.dove.outputs.dir }}

      - name: e2e
        run: npx playwright test --reporter=line
        working-directory: ${{ steps.dove.outputs.dir }}

      # ⛔ I resti servono a capire un rosso: senza, un fallimento in CI è una
      # riga di testo e un'ora persa a riprodurlo in locale.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-resti
          path: ${{ steps.dove.outputs.dir }}/test-results/
          retention-days: 7
