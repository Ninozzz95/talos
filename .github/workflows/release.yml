# La release: un APK firmato, con la prova di dove è nato.
#
# Si accende su un tag `v*`. Non su ogni push: una release è un atto, e gli atti
# si chiedono esplicitamente.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# ## ⛔ Cosa serve PRIMA, e non lo può fare un workflow
#
# La **keystore**. La genera l'owner, si perde una volta sola, e senza quella
# chiave nessun aggiornamento futuro può installarsi sopra: l'unica via sarebbe
# disinstallare, cioè cancellare a una persona le sue chat e la sua libreria.
#
# Va nei GitHub Secrets del repository, mai nel repo:
#
#     TALOS_KEYSTORE_BASE64   la keystore, in base64
#     TALOS_KEYSTORE_PASSWORD la password del contenitore
#     TALOS_KEY_ALIAS         il nome della chiave dentro
#     TALOS_KEY_PASSWORD      la password della chiave
#
# ⛔ Se mancano, il workflow **si ferma subito e lo dice**. Non produce un APK
# non firmato: un artefatto non firmato dentro una release ha l'aria di essere
# installabile, e non lo è — o peggio, lo è una volta sola e poi blocca ogni
# aggiornamento.
name: release

on:
  push:
    # ⛔⛔ 07/9 — DUE PRODOTTI, DUE PREFISSI. Prima c'era solo `v*`, che è il tag del MOBILE: un tag
    # per il desktop avrebbe svegliato il job dell'APK, che avrebbe provato a firmare un artefatto
    # che quel tag non descrive. I due prefissi si dichiarano qui e ogni job guarda il proprio.
    tags: ['v*', 'desktop-v*']

# ⛔ `attestations: write` è ciò che permette la firma di provenienza; `contents:
# write` serve a creare la release. Nient'altro: un token che può più di quanto
# serve è un token che un giorno farà più di quanto doveva.
permissions:
  contents: write
  id-token: write
  attestations: write
  # ⛔ `artifact-metadata` e' un ambito NUOVO, generalmente disponibile dal
  # 13 gennaio 2026, e `actions/attest` lo richiede. Verificato che sia una
  # chiave valida PRIMA di scriverla: un permesso non riconosciuto non fa
  # fallire un passo, rende invalido l'INTERO workflow — non parte niente, e
  # l'errore parla di sintassi, non di permessi.
  artifact-metadata: write

jobs:
  apk:
    # ⛔ solo i tag del mobile: `desktop-v0.1.0` non è una release Android.
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      # ⛔ `submodules: recursive` — senza, `third_party/llama.cpp` arriva come
      # cartella VUOTA e il build nativo muore in configurazione CMake. Il
      # motore locale non e' dentro questo repository: e' un puntatore a un
      # commit di ggml-org/llama.cpp, e un checkout non lo porta se non glielo
      # chiedi.
      #
      # MISURATO il 2026-08-16: la seconda corsa di release e' morta cosi', al
      # passo 16 su 19. `gates` non l'aveva mai scoperto perche' non compila il
      # nativo — un cancello che non esegue una cosa non la sta provando.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      # ⛔ Il primo passo è il controllo che evita l'artefatto inutile. Se la
      # chiave non c'è, meglio saperlo in dieci secondi che dopo otto minuti di
      # build — e con un messaggio che dice COSA manca, non «signing failed».
      - name: la chiave c'è?
        env:
          KEYSTORE: ${{ secrets.TALOS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::manca il secret TALOS_KEYSTORE_BASE64. Senza keystore non si pubblica: un APK non firmato sembra installabile e blocca ogni aggiornamento futuro."
            exit 1
          fi
          echo "keystore presente"

      # La versione viene dal tag e da nient'altro: `v0.1.0` -> `0.1.0`.
      # Il `versionCode` è il numero della corsa, che cresce in modo monotono
      # per costruzione — è l'unica proprietà che Android chiede davvero.
      - id: versione
        name: la versione la decide il tag
        run: |
          nome="${GITHUB_REF_NAME#v}"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "codice=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "release $nome (versionCode ${GITHUB_RUN_NUMBER})"

      - id: dove
        name: dove sta l'app
        run: |
          if [ -f mobile/package.json ]; then dir=mobile; else dir=.; fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # ⛔⛔ IL CANCELLO SUL CHANGELOG — regola dell'owner, 2026-08-16.
      #
      #   «ad ogni release mi raccomando non creare del testo statico, o meglio
      #    assieme al testo statico metti anche il changelog breve delle fix e
      #    delle implementazioni nuove, regola da ora in poi»
      #
      # La v0.1.0 e' uscita con SOLE istruzioni: come si installa, come si
      # verifica l'impronta, su quali due dispositivi. Tutto vero, tutto
      # IDENTICO a ogni release futura, e non diceva a nessuno cosa fosse
      # cambiato. L'unico riferimento al contenuto era il «Full Changelog»
      # automatico, che manda a una lista di commit grezzi: e' il materiale da
      # cui si scrive un changelog, non un changelog.
      #
      # ⛔ Il cancello sta QUI e non in una lista di cose da ricordare, perche'
      # una regola che vive in una testa salta al primo turno lungo — stessa
      # ragione del cancello sugli screenshot.
      #
      # ⛔⛔ E sta in TESTA, non accanto alla pubblicazione. Nella prima
      # stesura l'avevo messo dopo il build: sarebbe fallito dopo ~12 minuti di
      # NDK, gradle e firma, cioe' col tag gia' speso. Un cancello che costa
      # dodici minuti per dire «manca una sezione» non e' un cancello, e' una
      # punizione. Qui costa 2 secondi, e il tag si cancella e si rifa'.
      - id: changelog
        name: il changelog di questa versione, o non si parte nemmeno
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md non esiste: questa release non potrebbe dire cosa e' cambiato"
            exit 1
          fi
          # La sezione va da `## <tag>` fino al `## ` successivo.
          sezione=$(awk -v cercata="## ${GITHUB_REF_NAME}" '
            $0 == cercata { dentro = 1; next }
            dentro && /^## / { exit }
            dentro { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$sezione" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md non ha una sezione '## ${GITHUB_REF_NAME}'. Scrivila prima di taggare: cosa e' nuovo, cosa e' stato corretto."
            exit 1
          fi
          {
            echo "testo<<FINE_DEL_CHANGELOG"
            printf '%s\n' "$sezione"
            echo "FINE_DEL_CHANGELOG"
          } >> "$GITHUB_OUTPUT"
          echo "changelog di ${GITHUB_REF_NAME}: $(printf '%s' "$sezione" | wc -l) righe"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: ${{ steps.dove.outputs.dir }}/package-lock.json

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # ⛔⛔ L'NDK ESATTO, INSTALLATO A MANO — e non è pedanteria.
      #
      # `app/build.gradle` fissa `ndkVersion = "27.0.12077973"` e dice perché:
      # «il motore locale è compilato da questo NDK e una versione diversa è un
      # compilatore diverso». Quel pin non si tocca per far contento un runner.
      #
      # MISURATO il 2026-08-16 leggendo il manifesto dell'immagine
      # `ubuntu-latest`: ha 27.3.13750724, 28.2.13676358 e 29.0.14206865. La
      # nostra NON c'è. ⇒ Senza questo passo il primo tag sarebbe morto dentro
      # il build nativo, lasciando un tag pubblicato e nessuna release — e un
      # tag, con le release immutabili accese, non si sposta.
      #
      # ⭐ Trovato PRIMA di taggare, guardando cosa ha davvero il runner invece
      # di dare per scontato che «l'Android SDK c'è».
      - name: l'NDK che il motore locale pretende
        run: |
          set -euo pipefail
          atteso=$(grep -oE 'ndkVersion = "[^"]+"' \
            "${{ steps.dove.outputs.dir }}/android/app/build.gradle" | cut -d'"' -f2)
          echo "il build pretende NDK $atteso"
          if [ -d "$ANDROID_HOME/ndk/$atteso" ]; then
            echo "gia' presente"
          else
            # ⛔ `sdkmanager` NON si assume in `cmdline-tools/latest/`: il
            # manifesto dell'immagine dichiara la VERSIONE dei command line
            # tools, non la disposizione delle cartelle. Si cerca — e' la
            # stessa regola per cui il cancello chiede al checkout dove sta
            # l'app invece di scriverlo.
            gestore=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
            if [ -z "$gestore" ]; then
              echo "::error::sdkmanager non trovato sotto $ANDROID_HOME/cmdline-tools"
              exit 1
            fi
            echo "sdkmanager: $gestore"
            yes | "$gestore" --licenses > /dev/null 2>&1 || true
            "$gestore" "ndk;$atteso"
          fi
          test -d "$ANDROID_HOME/ndk/$atteso" \
            || { echo "::error::NDK $atteso non installabile su questo runner"; exit 1; }
          echo "NDK $atteso pronto"

      - run: npm ci
        working-directory: ${{ steps.dove.outputs.dir }}

      # ⛔ I cancelli girano ANCHE qui, e non è una ripetizione della CI: la CI
      # prova il ramo, questo prova il commit che diventa un artefatto firmato
      # e immutabile. Ciò che esce da qui non si corregge — si pubblica una
      # versione nuova.
      - name: typecheck
        run: npm run typecheck
        working-directory: ${{ steps.dove.outputs.dir }}

      - name: test
        run: npx vitest run
        working-directory: ${{ steps.dove.outputs.dir }}

      - name: build web
        run: npm run build
        working-directory: ${{ steps.dove.outputs.dir }}

      - name: sync android
        run: npx cap sync android
        working-directory: ${{ steps.dove.outputs.dir }}

      # La chiave esiste solo dentro il runner, e solo per il tempo del build.
      # `keystore.properties` è già ciò che il build.gradle si aspetta.
      - name: monta la chiave
        working-directory: ${{ steps.dove.outputs.dir }}/android
        env:
          KEYSTORE: ${{ secrets.TALOS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TALOS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TALOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TALOS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 -d > talos-release.jks
          # ⛔⛔ IL PERCORSO DEVE ESSERE ASSOLUTO, e l'ho misurato.
          #
          # `app/build.gradle` fa `file(proprietaFirma['storeFile'])`, e dentro
          # quel file `file()` risolve rispetto al MODULO `app/`, non alla
          # cartella `android/` dove scriviamo la chiave. Con
          # `storeFile=talos-release.jks` Gradle cerca in
          # `android/app/talos-release.jks`, non lo trova, e `firmaDisponibile`
          # resta FALSO.
          #
          # ⇒ Il build riesce lo stesso — «BUILD SUCCESSFUL» — e produce
          # `app-release-UNSIGNED.apk`. Riprodotto in locale il 2026-08-16
          # copiando esattamente questo layout: 48 secondi di build, esito
          # verde, e nessun APK firmato.
          #
          # ⛔ E la lezione sta in come l'ho quasi mancato: la mia prova locale
          # usava un percorso ASSOLUTO, quindi passava. Provare una cosa in una
          # forma diversa da quella che andra' in produzione non la prova —
          # dice solo che esiste una forma che funziona.
          {
            echo "storeFile=$PWD/talos-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: costruisci l'APK firmato
        working-directory: ${{ steps.dove.outputs.dir }}/android
        run: |
          ./gradlew assembleRelease --console=plain \
            -PtalosVersionName=${{ steps.versione.outputs.nome }} \
            -PtalosVersionCode=${{ steps.versione.outputs.codice }}

      # ⛔ «Success» non basta: si guarda DENTRO l'APK. Un build che riesce con
      # la firma disattivata produce un artefatto che sembra buono e non lo è —
      # e lo si scopre sul telefono di qualcun altro.
      - id: apk
        name: ⛔ è davvero firmato, e con la versione giusta?
        working-directory: ${{ steps.dove.outputs.dir }}/android
        run: |
          set -euo pipefail
          # ⛔ `$GITHUB_WORKSPACE`, NON `../..`.
          #
          # Questo passo gira in `<dir>/android`. Con l'app in `mobile/` quel
          # `../..` arrivava alla radice del checkout; con l'app ALLA RADICE —
          # cioe' nel repository pubblicato, cioe' proprio dove la release si fa
          # — `./android/../..` finisce FUORI dal workspace. L'APK sarebbe
          # atterrato in un posto che l'attestazione e la pubblicazione non
          # guardano nemmeno.
          #
          # ⇒ Lo stesso difetto del `cd` prima di `git push`: un percorso
          # relativo che dipende da dove sei e' un percorso che un giorno
          # cambia sotto i piedi. Si nomina la destinazione.
          origine=app/build/outputs/apk/release/app-release.apk
          nome="TALOS-${{ steps.versione.outputs.nome }}.apk"
          cp "$origine" "$GITHUB_WORKSPACE/$nome"
          cd "$GITHUB_WORKSPACE"

          strumenti=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$strumenti/apksigner" verify --print-certs "$nome"

          impronta=$(sha256sum "$nome" | cut -d' ' -f1)
          echo "sha256=$impronta" >> "$GITHUB_OUTPUT"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "peso=$(du -m "$nome" | cut -f1) MB" >> "$GITHUB_OUTPUT"
          echo "sha256: $impronta"

      # Motore locale MAX PERFORMANCE, Fase 0 — «backend dichiarato ==
      # backend spedito» smette di essere una prova fatta a mano una volta
      # (Fase 7(a), 2026-08-21: `aapt list` + `llvm-readobj` sul Pad) e
      # diventa un cancello permanente. Il rilascio, senza
      # `-PtalosResearchBackend`, spedisce CPU+OpenCL per costruzione
      # (`app/build.gradle`, Fase 7(a)) — se un giorno smettesse di farlo,
      # o spedisse un acceleratore che nessuno ha dichiarato, questo passo
      # lo blocca prima della firma di provenienza, non dopo che qualcuno
      # lo scopre sul telefono.
      - name: ⛔ il backend nell'APK è quello che ci si aspetta
        working-directory: ${{ steps.dove.outputs.dir }}
        run: |
          node scripts/verify-local-backend-artifact.mjs \
            "$GITHUB_WORKSPACE/${{ steps.apk.outputs.nome }}" \
            cpu,opencl

      # ⛔⛔⛔ CODICE (harness UI + terminale) NON SPARISCE DI NUOVO — 3/9,
      # dopo la v0.1.24: quelle due classi vivono in `main/` da oggi, ma
      # sono cercate via Class.forName (stringa, non X.class) — R8 può
      # rinominarle a runtime senza fallire in compilazione se la regola
      # -keep in proguard-rules.pro si rompe. `npm run build` (sopra)
      # verifica solo che i FILE vivano nel posto giusto, prima che Gradle
      # e R8 tocchino niente — questo verifica l'APK VERO, firmato, dopo
      # che R8 ha già fatto il suo lavoro: la metà che nessun checkout
      # web può provare da solo. Vedi il commento di classe di
      # TalosHarnessUiPlugin.kt per la storia intera.
      # (13/09, R-05b: passo ripreso dal release.yml della lane mobile, che il
      # ramo desktop aveva perso; vale anche con la mobile in `mobile/`.)
      - name: ⛔ Codice non e' sparito di nuovo dalla release
        working-directory: ${{ steps.dove.outputs.dir }}
        run: |
          node scripts/verify-release-plugin-classes.mjs \
            "$GITHUB_WORKSPACE/${{ steps.apk.outputs.nome }}"

      # La provenienza SLSA: lega l'artefatto al workflow, al commit e al
      # repository, con un certificato effimero su un registro di trasparenza.
      # La provenienza SLSA: lega l'artefatto al workflow, al commit e al
      # repository, con un certificato effimero su un registro di trasparenza.
      #
      # ⛔ `actions/attest` e NON `attest-build-provenance`: quest'ultimo, dal
      # v4, e' «simply a wrapper on top of actions/attest», e la sua stessa
      # documentazione dice che «new implementations should use actions/attest
      # instead». La nostra e' nuova.
      #
      # ⛔ E si e' scoperto solo CERCANDO. Il workflow di questa release e'
      # stato scritto a memoria, ed e' costato cinque corse fallite su difetti
      # che stavano tutti nel primo risultato di una query sola. Questa riga e'
      # l'unica scritta dopo aver letto — e infatti ha portato con se' un
      # permesso in piu' che nessuno avrebbe indovinato.
      #
      # Senza `predicate-type` genera provenienza SLSA, che e' cio' che serve.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.apk.outputs.nome }}

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: ${{ steps.apk.outputs.nome }}
          generate_release_notes: true
          # ⛔ La riga che fa la differenza fra una firma e un ornamento: il
          # comando per verificarla sta NELLA release, non in una pagina di
          # documentazione che nessuno apre.
          # ⛔ Il testo delle note è in INGLESE, come tutto ciò che si pubblica.
          # La v0.1.0 era uscita in italiano: l'ho corretta a mano, ma la
          # SORGENTE era rimasta italiana, quindi la release dopo sarebbe
          # tornata italiana da sola. Correggere il sintomo e lasciare la causa
          # è come non aver corretto niente.
          body: |
            ## What changed

            ${{ steps.changelog.outputs.testo }}

            ## Install

            This APK does not come from the Play Store, so Android treats it as
            an app from an unknown source and will ask you to confirm. That is
            expected.

            **arm64-v8a only, Android 8.0 or later.**

            ## Check you got the right file

            ```bash
            sha256sum ${{ steps.apk.outputs.nome }}
            # ${{ steps.apk.outputs.sha256 }}
            ```

            And that it really came from this source, built here:

            ```bash
            gh attestation verify ${{ steps.apk.outputs.nome }} --repo ${{ github.repository }}
            ```

            ## What it was tested on

            Two devices: a OnePlus 13 and a OnePlus Pad 3. Two devices are a
            small sample, and Android ROMs diverge a good deal on
            accessibility, background execution and lock screen behaviour.

  # R-04: installer Windows completo. Lo staging R-02 usa una lista di inclusioni;
  # cancelli e prova dell'installato precedono attestazione e pubblicazione.
  desktop:
    if: startsWith(github.ref_name, 'desktop-v')
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TALOS_R02_BUILDER_NETWORK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: commit_tag
        name: stesso commit del tag, ramo locale per i cancelli esistenti
        run: |
          $prima = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'HEAD non leggibile.' }
          $tag = git rev-parse "$env:GITHUB_REF_NAME^{commit}"
          if ($LASTEXITCODE -ne 0 -or $prima -cne $tag) { throw 'La checkout non corrisponde al commit del tag.' }
          # Alcuni test server richiedono un ramo reale; nessun nuovo commit.
          git switch --create ci-desktop-release HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Creazione del ramo locale CI fallita.' }
          $dopo = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $dopo -cne $prima) { throw 'Il commit da rilasciare è cambiato.' }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            harness-ui/package-lock.json
            harness-ui/frontend/package-lock.json
            harness-ui/desktop/package-lock.json
            context-engine/package-lock.json

      - id: ambiente
        name: versione, immagine e percorsi delle cache
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content harness-ui/desktop/package.json -Raw | ConvertFrom-Json
          $lock = Get-Content harness-ui/desktop/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          if ($env:GITHUB_REF_NAME -cne "desktop-v$($pkg.version)" -or $lock.version -cne $pkg.version -or $lock.packages[''].version -cne $pkg.version) {
            throw 'Tag e versioni package/lock desktop devono coincidere.'
          }
          "exe=harness-ui/desktop/dist/TALOS-Setup-$($pkg.version).exe" >> $env:GITHUB_OUTPUT
          "electron_config_cache=$env:LOCALAPPDATA/electron/Cache" >> $env:GITHUB_ENV
          "ELECTRON_BUILDER_CACHE=$env:LOCALAPPDATA/electron-builder/Cache" >> $env:GITHUB_ENV
          "inizio=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT
          $node = node --version
          $npm = npm --version
          "### Ambiente desktop" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Windows: $([Environment]::OSVersion.VersionString); immagine: $env:ImageOS / $env:ImageVersion; PowerShell: $($PSVersionTable.PSVersion); Node: $node; npm: $npm." >> $env:GITHUB_STEP_SUMMARY

      - name: cache Electron, builder e staging
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.electron_config_cache }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            harness-ui/desktop/.cache-r02/npm
            harness-ui/desktop/.cache-r02/llama-b10517-bin-win-cpu-x64.zip
            harness-ui/desktop/.cache-r02/llama-b10517-bin-win-vulkan-x64.zip
          key: desktop-r04-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('harness-ui/package-lock.json', 'harness-ui/desktop/package-lock.json', 'context-engine/package-lock.json', 'harness-ui/desktop/scripts/prepara-pacchetto.mjs') }}

      - name: dipendenze dai lock con addon nativi
        timeout-minutes: 10
        run: |
          npm ci --prefix harness-ui --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci backend fallito.' }
          npm ci --prefix harness-ui/frontend --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci frontend fallito.' }
          npm ci --prefix harness-ui/desktop --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci desktop fallito.' }
          npm ci --prefix context-engine --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci context-engine fallito.' }
          # test:unit include anche un test DOM che richiede Chromium Playwright.
          node harness-ui/frontend/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Installazione Chromium per i test frontend fallita.' }
          # node-pty 1.1.0 include win32-x64; npm conserva il fallback node-gyp.
          # Server 2025 offre Python, Visual Studio C++, SDK e librerie Spectre.
          # Il cancello test:guscio prova anche la PTY reale dentro Electron.

      - name: costruisci il frontend e consegnalo
        run: |
          npm --prefix harness-ui/frontend run build
          if ($LASTEXITCODE -ne 0) { throw 'Build frontend fallita.' }
          Copy-Item -Path harness-ui/frontend/dist/* -Destination harness-ui/public/ -Recurse -Force

      - id: cancelli
        name: server, kernel, frontend e guscio Electron reale
        timeout-minutes: 15
        run: |
          node --test harness-ui/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Test server falliti.' }
          npm --prefix harness-ui run test:kernel
          if ($LASTEXITCODE -ne 0) { throw 'Test kernel falliti.' }
          npm --prefix harness-ui run kernel:controlla
          if ($LASTEXITCODE -ne 0) { throw 'Controllo kernel fallito.' }
          npm --prefix harness-ui/frontend run test:unit
          if ($LASTEXITCODE -ne 0) { throw 'Test frontend falliti.' }
          npm --prefix harness-ui/desktop run test:puri
          if ($LASTEXITCODE -ne 0) { throw 'Test puri desktop falliti.' }
          # _electron usa Electron incluso; nessun browser Playwright da scaricare.
          npm --prefix harness-ui/desktop run test:guscio
          if ($LASTEXITCODE -ne 0) { throw 'Test Electron reali falliti.' }

      - id: dist
        name: installer NSIS e ZIP completo R-02
        timeout-minutes: 15
        run: |
          $tempo = [Diagnostics.Stopwatch]::StartNew()
          npm --prefix harness-ui/desktop run dist
          if ($LASTEXITCODE -ne 0) { throw 'Build installer/ZIP fallita.' }
          "Build installer e ZIP: $($tempo.ElapsedMilliseconds) ms." >> $env:GITHUB_STEP_SUMMARY

      - id: smoke
        name: installa, avvia, health con cookie, chiudi e disinstalla
        timeout-minutes: 8
        env:
          INSTALLER: ${{ steps.ambiente.outputs.exe }}
        run: ./harness-ui/desktop/scripts/ci-smoke.ps1 -Installer $env:INSTALLER

      - id: asset
        name: SHA256, note di release e pesi
        run: |
          node harness-ui/desktop/scripts/release-assets.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Preparazione note e SHA256 fallita.' }

      # Come apk: actions/attest v4, non il wrapper attest-build-provenance.
      # I tre permessi OIDC/attestazioni/metadati sono quelli globali già presenti.
      - name: provenienza GitHub di EXE e ZIP
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ steps.asset.outputs.exe }}
            ${{ steps.asset.outputs.zip }}

      - id: upload
        name: conserva gli artefatti della release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talos-desktop-${{ github.ref_name }}-windows-x64
          path: |
            ${{ steps.asset.outputs.exe }}
            ${{ steps.asset.outputs.zip }}
            ${{ steps.asset.outputs.sha }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - id: release
        name: pubblica la release con tre asset e note scritte
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXE: ${{ steps.asset.outputs.exe }}
          ZIP: ${{ steps.asset.outputs.zip }}
          SHA: ${{ steps.asset.outputs.sha }}
          NOTE: ${{ steps.asset.outputs.note }}
        run: |
          gh release create $env:GITHUB_REF_NAME $env:EXE $env:ZIP $env:SHA --verify-tag --repo $env:GH_REPO --title "TALOS Desktop $env:GITHUB_REF_NAME" --notes-file $env:NOTE
          if ($LASTEXITCODE -ne 0) { throw 'Creazione release fallita; verificare se il tag ha già una release.' }

      - name: conserva la prova dello smoke anche in caso di errore
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talos-desktop-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: harness-ui/desktop/.prove/R04-ci-smoke.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: tempo totale osservato
        if: always()
        env:
          INIZIO: ${{ steps.ambiente.outputs.inizio }}
        run: |
          if ($env:INIZIO) {
            $secondi = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:INIZIO
            "Tempo fino al riepilogo (esclusi checkout/setup-node e post action): $secondi s. Limite job: 45 minuti." >> $env:GITHUB_STEP_SUMMARY
          }
