name: TALOS CLI transcript virtualization final GREEN validation

on:
  push:
    branches:
      - owner-inspection/cli-transcript-virtualization-green-38b870b9

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout inspection snapshot
        uses: actions/checkout@v4

      - name: Prove inspection package cannot be selected as project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Bootstrap = Join-Path $PWD.Path 'bootstrap.ps1'
          $Psi = New-Object System.Diagnostics.ProcessStartInfo
          $Psi.FileName = 'powershell.exe'
          $Psi.Arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + $Bootstrap + '" -Project "' + $PWD.Path + '" -PrepareOnly'
          $Psi.WorkingDirectory = $PWD.Path
          $Psi.UseShellExecute = $false
          $Psi.RedirectStandardOutput = $true
          $Psi.RedirectStandardError = $true
          $Psi.CreateNoWindow = $true
          $Process = New-Object System.Diagnostics.Process
          $Process.StartInfo = $Psi
          if (-not $Process.Start()) { throw 'Failed to start overlap-rejection child process.' }
          $Stdout = $Process.StandardOutput.ReadToEnd()
          $Stderr = $Process.StandardError.ReadToEnd()
          $Process.WaitForExit()
          $Code = $Process.ExitCode
          if ($Stdout) { Write-Host $Stdout }
          if ($Stderr) { Write-Host $Stderr }
          $Text = $Stdout + [Environment]::NewLine + $Stderr
          if ($Code -eq 0) { throw 'Package-root project selection unexpectedly succeeded.' }
          if ($Text -notmatch 'INSPECTION_PROJECT_OVERLAP') { throw "Expected INSPECTION_PROJECT_OVERLAP, got exit $Code.`n$Text" }
          $Transcript = Get-ChildItem -LiteralPath .\DEVELOPMENT-LOGS -Filter 'bootstrap-*.log' | Sort-Object LastWriteTimeUtc | Select-Object -Last 1
          if (-not $Transcript) { throw 'Overlap rejection did not leave a bootstrap transcript.' }

      - name: Exercise exact one-click preparation in a separate project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Project = Join-Path $env:RUNNER_TEMP 'talos-owner-inspection-project'
          New-Item -ItemType Directory -Force -Path $Project | Out-Null
          Set-Content -LiteralPath (Join-Path $Project 'README.txt') -Value 'owner inspection disposable project' -Encoding UTF8
          $Before = @(Get-ChildItem -LiteralPath .\DEVELOPMENT-LOGS -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          $Bootstrap = Join-Path $PWD.Path 'bootstrap.ps1'
          $Psi = New-Object System.Diagnostics.ProcessStartInfo
          $Psi.FileName = 'powershell.exe'
          $Psi.Arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + $Bootstrap + '" -Project "' + $Project + '" -PrepareOnly'
          $Psi.WorkingDirectory = $PWD.Path
          $Psi.UseShellExecute = $false
          $Psi.RedirectStandardOutput = $true
          $Psi.RedirectStandardError = $true
          $Psi.CreateNoWindow = $true
          $Process = New-Object System.Diagnostics.Process
          $Process.StartInfo = $Psi
          if (-not $Process.Start()) { throw 'Failed to start separate-project bootstrap child process.' }
          $StdoutTask = $Process.StandardOutput.ReadToEndAsync()
          $StderrTask = $Process.StandardError.ReadToEndAsync()
          $Process.WaitForExit()
          $Stdout = $StdoutTask.GetAwaiter().GetResult()
          $Stderr = $StderrTask.GetAwaiter().GetResult()
          $Code = $Process.ExitCode
          if ($Stdout) { Write-Host $Stdout }
          if ($Stderr) { Write-Host $Stderr }
          if ($Code -ne 0) { throw "Separate-project preparation failed with exit $Code.`nSTDOUT:`n$Stdout`nSTDERR:`n$Stderr" }

          $Logs = Get-ChildItem -LiteralPath .\DEVELOPMENT-LOGS -File | Where-Object { $Before -notcontains $_.FullName }
          $Transcript = $Logs | Where-Object Name -Like 'bootstrap-*.log' | Sort-Object LastWriteTimeUtc | Select-Object -Last 1
          $Jsonl = $Logs | Where-Object Name -Like 'talos-dev-*.jsonl' | Sort-Object LastWriteTimeUtc | Select-Object -Last 1
          if (-not $Transcript) { throw 'Successful preparation did not create a bootstrap transcript.' }
          if (-not $Jsonl) { throw 'Successful preparation did not create a structured TALOS development log.' }

          $TranscriptText = Get-Content -LiteralPath $Transcript.FullName -Raw
          foreach ($Required in @('TALOS CLI typecheck','TALOS CLI build','exit=0','Prepare-only validation completed successfully.')) {
            if ($TranscriptText -notmatch [regex]::Escape($Required)) { throw "Bootstrap transcript missing: $Required" }
          }

          $Start = Get-Content -LiteralPath $Jsonl.FullName | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object event -EQ 'process.start' | Select-Object -First 1
          if (-not $Start) { throw 'Structured development log has no process.start record.' }
          $Expected = [System.IO.Path]::GetFullPath($Project).TrimEnd('\')
          $Observed = [System.IO.Path]::GetFullPath([string]$Start.data.cwd).TrimEnd('\')
          if (-not [string]::Equals($Expected,$Observed,[System.StringComparison]::OrdinalIgnoreCase)) {
            throw "CLI cwd mismatch. Expected $Expected, observed $Observed"
          }
      - name: Verify exact private-source blobs staged for transcript final GREEN
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Expected = @{
            'app/src/tui/app.ts' = '2e4dc9acc454cee02987c5a8e8f1c431dad5bcb8'
            'app/src/tui/components/transcript-virtualizer.ts' = '467508d0314f4357f7cd2f2a2d97f285a82c1eff'
            'app/src/tui/components/transcript.ts' = '5109d0c45a83c8ea3ca6d9c4e84ea3c719b83c09'
            'app/src/tui/transcript-model.ts' = 'f81a6a6ef6be4ff1dccd397be2753b4d6c806801'
            'app/src/tui/components/markdown.ts' = '7861253aa15913654b305180543018e085582615'
            'app/src/tui/components/tool-row.ts' = 'e753a1427355e7e51fd75c2d4e57cc1bb9af710b'
            'app/test/tui/transcript-virtualizer.test.ts' = 'b46500755adddb57cf94e1ee68b3e549f5c6b76d'
            'app/test/tui/app-routing.test.ts' = '36c374e1ae553860fec63281c80b0b9c21c4c6fa'
            'app/test/tui/transcript.test.ts' = '58c5b2d8e6a2f561e31617dcdfaf4eb8846f0750'
            'app/test/tui/transcript-model.test.ts' = '31dfd68553feb56796d9e99b5a14c5dfe2adabcb'
            'app/test/tui/transcript-search.test.ts' = '2b4a9420738901e4e972e964c1ff4acf3337f320'
            'app/test/tui/command-menu.test.ts' = 'e186db2d830b2c198144f17419f5840c1912b1fd'
            'app/test/tui/composer.test.ts' = 'e612c0d2839fd076125281898fcedc8b009577a1'
            'app/test/tui/editor.test.ts' = 'ce00d9438ef285bb89186b79ee09bd19b155f2ec'
            'app/test/tui/editor-history.test.ts' = 'e5d0123b0ed2b276742b543dae9270e1ccfe6e1f'
            'app/test/tui/input-router.test.ts' = '536a1ce4e0f7abaf505c314bf6ddd4c58b79ebd5'
          }
          foreach ($Path in $Expected.Keys) {
            $Observed = (git hash-object -- $Path).Trim()
            if ($Observed -ne $Expected[$Path]) { throw "TRANSCRIPT_FINAL_GREEN_BLOB_MISMATCH $Path expected=$($Expected[$Path]) observed=$Observed" }
          }
          $Snapshot = Get-Content -LiteralPath .\INSPECTION-SNAPSHOT.json -Raw | ConvertFrom-Json
          if ($Snapshot.sourceHead -ne '38b870b95c3e050ca45705839bed067d96b04cc1') { throw "TRANSCRIPT_FINAL_GREEN_SOURCE_HEAD_MISMATCH: $($Snapshot.sourceHead)" }

      - name: Execute transcript virtualization final GREEN gates on Node 24.18.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $NodeExe = Join-Path $env:LOCALAPPDATA 'TALOS-CLI\inspection-bootstrap\node-24.18.0\node-v24.18.0-win-x64\node.exe'
          if (-not (Test-Path -LiteralPath $NodeExe)) { throw "TRANSCRIPT_FINAL_GREEN_NODE_RUNTIME_MISSING: $NodeExe" }
          $Version = & $NodeExe --version
          if ($Version -ne 'v24.18.0') { throw "TRANSCRIPT_FINAL_GREEN_NODE_VERSION_MISMATCH: $Version" }

          function Assert-Green([string]$Pattern,[string]$File,[string]$Sentinel) {
            Push-Location (Join-Path $PWD.Path 'app')
            try {
              & $NodeExe --experimental-strip-types --test --test-name-pattern "$Pattern" "$File"
              if ($LASTEXITCODE -ne 0) { throw "TRANSCRIPT_FINAL_GREEN_TARGET_FAILED pattern=$Pattern exit=$LASTEXITCODE" }
              Write-Host $Sentinel
            }
            finally { Pop-Location }
          }

          function Assert-Suite([string]$File,[string]$Sentinel) {
            Push-Location (Join-Path $PWD.Path 'app')
            try {
              & $NodeExe --experimental-strip-types --test "$File"
              if ($LASTEXITCODE -ne 0) { throw "TRANSCRIPT_FINAL_GREEN_SUITE_FAILED file=$File exit=$LASTEXITCODE" }
              Write-Host $Sentinel
            }
            finally { Pop-Location }
          }

          Assert-Green 'transcript-virtualization RED-TV1' '.\test\tui\transcript-virtualizer.test.ts' 'TRANSCRIPT_GREEN_TV1_CONFIRMED'
          Assert-Green 'transcript-virtualization RED-TV2' '.\test\tui\transcript-virtualizer.test.ts' 'TRANSCRIPT_GREEN_TV2_CONFIRMED'
          Assert-Green 'transcript-virtualization RED-TV3' '.\test\tui\transcript-virtualizer.test.ts' 'TRANSCRIPT_GREEN_TV3_CONFIRMED'
          Assert-Green 'transcript-virtualization RED-TV4' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_GREEN_TV4_CONFIRMED'
          Assert-Green 'transcript-virtualization RED-TV5' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_GREEN_TV5_CONFIRMED'
          Assert-Green 'transcript-virtualization RED-TV6 —' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_GREEN_TV6_CONFIRMED'
          Assert-Green 'transcript-virtualization RED-TV6A' '.\test\tui\transcript-virtualizer.test.ts' 'TRANSCRIPT_GREEN_TV6A_CONFIRMED'
          Assert-Green 'transcript-virtualization RED-TV6B' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_GREEN_TV6B_CONFIRMED'

          Assert-Green 'command-menu-fast-path RED-CM1' '.\test\tui\command-menu.test.ts' 'TRANSCRIPT_REGRESSION_CM1_GREEN'
          Assert-Green 'command-menu-fast-path RED-CM2' '.\test\tui\command-menu.test.ts' 'TRANSCRIPT_REGRESSION_CM2_GREEN'
          Assert-Green 'command-menu-fast-path RED-CM3' '.\test\tui\command-menu.test.ts' 'TRANSCRIPT_REGRESSION_CM3_GREEN'
          Assert-Green 'command-menu-fast-path RED-CM4' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_REGRESSION_CM4_GREEN'
          Assert-Green 'command-menu-fast-path RED-CM5' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_REGRESSION_CM5_GREEN'
          Assert-Green 'command-menu-fast-path RED-CM6' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_REGRESSION_CM6_GREEN'
          Assert-Green 'input-fast-path RED-I3' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_REGRESSION_I3_GREEN'
          Assert-Green 'local-editor-fast-path RED-L3' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_REGRESSION_L3_GREEN'
          Assert-Green 'history-fast-path RED-H4' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_REGRESSION_H4_GREEN'
          Assert-Green 'paste-ime-fast-path RED-Paste3' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_REGRESSION_PASTE3_GREEN'
          Assert-Green 'paste-ime-fast-path RED-Paste4' '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_REGRESSION_PASTE4_GREEN'

          Assert-Suite '.\test\tui\transcript-virtualizer.test.ts' 'TRANSCRIPT_VIRTUALIZER_SUITE_GREEN'
          Assert-Suite '.\test\tui\transcript.test.ts' 'TRANSCRIPT_SUITE_GREEN'
          Assert-Suite '.\test\tui\transcript-model.test.ts' 'TRANSCRIPT_MODEL_SUITE_GREEN'
          Assert-Suite '.\test\tui\transcript-search.test.ts' 'TRANSCRIPT_SEARCH_SUITE_GREEN'
          Assert-Suite '.\test\tui\app-routing.test.ts' 'TRANSCRIPT_APP_ROUTING_SUITE_GREEN'
          Assert-Suite '.\test\tui\command-menu.test.ts' 'TRANSCRIPT_COMMAND_MENU_SUITE_GREEN'
          Assert-Suite '.\test\tui\composer.test.ts' 'TRANSCRIPT_COMPOSER_SUITE_GREEN'
          Assert-Suite '.\test\tui\editor.test.ts' 'TRANSCRIPT_EDITOR_SUITE_GREEN'
          Assert-Suite '.\test\tui\editor-history.test.ts' 'TRANSCRIPT_EDITOR_HISTORY_SUITE_GREEN'
          Assert-Suite '.\test\tui\input-router.test.ts' 'TRANSCRIPT_INPUT_ROUTER_SUITE_GREEN'
