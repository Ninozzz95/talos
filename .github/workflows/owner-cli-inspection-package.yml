name: TALOS CLI productization GREEN validation

on:
  push:
    branches:
      - owner-inspection/disabled-productization-green-sync

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout inspection snapshot
        uses: actions/checkout@v4

      - name: Prove inspection package cannot be selected as project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Bootstrap = Join-Path $PWD.Path 'bootstrap.ps1'
          $Psi = New-Object System.Diagnostics.ProcessStartInfo
          $Psi.FileName = 'powershell.exe'
          $Psi.Arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + $Bootstrap + '" -Project "' + $PWD.Path + '" -PrepareOnly'
          $Psi.WorkingDirectory = $PWD.Path
          $Psi.UseShellExecute = $false
          $Psi.RedirectStandardOutput = $true
          $Psi.RedirectStandardError = $true
          $Psi.CreateNoWindow = $true
          $Process = New-Object System.Diagnostics.Process
          $Process.StartInfo = $Psi
          if (-not $Process.Start()) { throw 'Failed to start overlap-rejection child process.' }
          $Stdout = $Process.StandardOutput.ReadToEnd()
          $Stderr = $Process.StandardError.ReadToEnd()
          $Process.WaitForExit()
          $Code = $Process.ExitCode
          if ($Stdout) { Write-Host $Stdout }
          if ($Stderr) { Write-Host $Stderr }
          $Text = $Stdout + [Environment]::NewLine + $Stderr
          if ($Code -eq 0) { throw 'Package-root project selection unexpectedly succeeded.' }
          if ($Text -notmatch 'INSPECTION_PROJECT_OVERLAP') { throw "Expected INSPECTION_PROJECT_OVERLAP, got exit $Code.`n$Text" }
          $Transcript = Get-ChildItem -LiteralPath .\DEVELOPMENT-LOGS -Filter 'bootstrap-*.log' | Sort-Object LastWriteTimeUtc | Select-Object -Last 1
          if (-not $Transcript) { throw 'Overlap rejection did not leave a bootstrap transcript.' }

      - name: Exercise exact one-click preparation in a separate project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Project = Join-Path $env:RUNNER_TEMP 'talos-owner-inspection-project'
          New-Item -ItemType Directory -Force -Path $Project | Out-Null
          Set-Content -LiteralPath (Join-Path $Project 'README.txt') -Value 'owner inspection disposable project' -Encoding UTF8
          $Before = @(Get-ChildItem -LiteralPath .\DEVELOPMENT-LOGS -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
          $Bootstrap = Join-Path $PWD.Path 'bootstrap.ps1'
          $Psi = New-Object System.Diagnostics.ProcessStartInfo
          $Psi.FileName = 'powershell.exe'
          $Psi.Arguments = '-NoProfile -ExecutionPolicy Bypass -File "' + $Bootstrap + '" -Project "' + $Project + '" -PrepareOnly'
          $Psi.WorkingDirectory = $PWD.Path
          $Psi.UseShellExecute = $false
          $Psi.RedirectStandardOutput = $true
          $Psi.RedirectStandardError = $true
          $Psi.CreateNoWindow = $true
          $Process = New-Object System.Diagnostics.Process
          $Process.StartInfo = $Psi
          if (-not $Process.Start()) { throw 'Failed to start separate-project bootstrap child process.' }
          $StdoutTask = $Process.StandardOutput.ReadToEndAsync()
          $StderrTask = $Process.StandardError.ReadToEndAsync()
          $Process.WaitForExit()
          $Stdout = $StdoutTask.GetAwaiter().GetResult()
          $Stderr = $StderrTask.GetAwaiter().GetResult()
          $Code = $Process.ExitCode
          if ($Stdout) { Write-Host $Stdout }
          if ($Stderr) { Write-Host $Stderr }
          if ($Code -ne 0) { throw "Separate-project preparation failed with exit $Code.`nSTDOUT:`n$Stdout`nSTDERR:`n$Stderr" }

          $Logs = Get-ChildItem -LiteralPath .\DEVELOPMENT-LOGS -File | Where-Object { $Before -notcontains $_.FullName }
          $Transcript = $Logs | Where-Object Name -Like 'bootstrap-*.log' | Sort-Object LastWriteTimeUtc | Select-Object -Last 1
          $Jsonl = $Logs | Where-Object Name -Like 'talos-dev-*.jsonl' | Sort-Object LastWriteTimeUtc | Select-Object -Last 1
          if (-not $Transcript) { throw 'Successful preparation did not create a bootstrap transcript.' }
          if (-not $Jsonl) { throw 'Successful preparation did not create a structured TALOS development log.' }

          $TranscriptText = Get-Content -LiteralPath $Transcript.FullName -Raw
          foreach ($Required in @('TALOS CLI typecheck','TALOS CLI build','exit=0','Prepare-only validation completed successfully.')) {
            if ($TranscriptText -notmatch [regex]::Escape($Required)) { throw "Bootstrap transcript missing: $Required" }
          }

          $Start = Get-Content -LiteralPath $Jsonl.FullName | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object event -EQ 'process.start' | Select-Object -First 1
          if (-not $Start) { throw 'Structured development log has no process.start record.' }
          $Expected = [System.IO.Path]::GetFullPath($Project).TrimEnd('\')
          $Observed = [System.IO.Path]::GetFullPath([string]$Start.data.cwd).TrimEnd('\')
          if (-not [string]::Equals($Expected,$Observed,[System.StringComparison]::OrdinalIgnoreCase)) {
            throw "CLI cwd mismatch. Expected $Expected, observed $Observed"
          }
      - name: Verify exact private-source blobs staged for GREEN
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $Expected = @{
            'app/src/tui/components/markdown.ts' = '7861253aa15913654b305180543018e085582615'
            'app/src/tui/app.ts' = '51e7f048f3078a8f983ed0e576bf64737d0e0a2c'
            'app/test/tui/markdown-rich.test.ts' = 'a6c70995796ca0f5982a084f5fdcce1cddaf7184'
            'app/test/tui/app-routing.test.ts' = '530f14d27575128aeb58b2cf62309491e01c536e'
          }
          foreach ($Path in $Expected.Keys) {
            $Observed = (git hash-object -- $Path).Trim()
            if ($Observed -ne $Expected[$Path]) { throw "GREEN_BLOB_MISMATCH $Path expected=$($Expected[$Path]) observed=$Observed" }
          }
          $Snapshot = Get-Content -LiteralPath .\INSPECTION-SNAPSHOT.json -Raw | ConvertFrom-Json
          if ($Snapshot.sourceHead -ne '4172f72c9497df088eb6876023f49859a46d8eee') { throw "GREEN_SOURCE_HEAD_MISMATCH: $($Snapshot.sourceHead)" }

      - name: Execute focused productization GREEN tests on exact Node 24.18.0
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $NodeExe = Join-Path $env:LOCALAPPDATA 'TALOS-CLI\inspection-bootstrap\node-24.18.0\node-v24.18.0-win-x64\node.exe'
          if (-not (Test-Path -LiteralPath $NodeExe)) { throw "GREEN_NODE_RUNTIME_MISSING: $NodeExe" }
          $Version = & $NodeExe --version
          if ($Version -ne 'v24.18.0') { throw "GREEN_NODE_VERSION_MISMATCH: $Version" }
          Push-Location .\app
          try {
            & $NodeExe --experimental-strip-types --test .\test\tui\markdown-rich.test.ts
            if ($LASTEXITCODE -ne 0) { throw "GREEN_MARKDOWN_TESTS_FAILED: $LASTEXITCODE" }
            & $NodeExe --experimental-strip-types --test --test-name-pattern "productization RED-P6" .\test\tui\app-routing.test.ts
            if ($LASTEXITCODE -ne 0) { throw "GREEN_WIRING_TEST_FAILED: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

