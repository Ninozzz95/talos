name: TALOS CLI owner inspection package

on:
  push:
    branches:
      - owner-inspection/cli-33da96c7

permissions:
  contents: read

jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout inspection snapshot
        uses: actions/checkout@v4
      - name: Exercise exact one-click bootstrap
        shell: powershell
        run: |
          .\bootstrap.ps1 -Project $PWD.Path -PrepareOnly

  package:
    needs: validate-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inspection snapshot
        uses: actions/checkout@v4
      - name: Verify inspection identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .sourceHead INSPECTION-SNAPSHOT.json)" = "33da96c7e3a2a0aa90ca9ac884095c08b5cc52bb"
          test -f START-TALOS-CLI.cmd
          test -f bootstrap.ps1
          test -f OWNER-STEP-BY-STEP-CHECKLIST.txt
          test -f app/src/main.ts
          test -f app/vendor/harness-ui/src/kernel/talosHarness.mjs
          test -f app/vendor/context-engine/src/engine.mjs
      - name: Build ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/TALOS-CLI-owner-inspection-33da96c7
          rsync -a --exclude='.git' --exclude='.github' --exclude='out' ./ out/TALOS-CLI-owner-inspection-33da96c7/
          cd out
          zip -r -9 TALOS-CLI-owner-inspection-33da96c7.zip TALOS-CLI-owner-inspection-33da96c7
          sha256sum TALOS-CLI-owner-inspection-33da96c7.zip > TALOS-CLI-owner-inspection-33da96c7.zip.sha256
      - name: Upload inspection package
        uses: actions/upload-artifact@v4
        with:
          name: TALOS-CLI-owner-inspection-33da96c7
          path: |
            out/TALOS-CLI-owner-inspection-33da96c7.zip
            out/TALOS-CLI-owner-inspection-33da96c7.zip.sha256
          if-no-files-found: error
          retention-days: 7
