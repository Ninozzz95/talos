name: desktop-ledger-navigation
on:
  push:
    branches: ['refactor/desktop-ledger-2026-09-17']
    paths: ['docs/refactor/navigation-slice/**', '.github/workflows/desktop-ledger-navigation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ledger-navigation-transport-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'Ninozzz95/talos' && github.ref == 'refs/heads/refactor/desktop-ledger-2026-09-17'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - name: Apply only the exact source changes reviewed and tested in this session
        run: node docs/refactor/navigation-slice/apply.mjs
      - id: commit
        name: Persist normal source diff without overwriting concurrent commits
        run: |
          set -euo pipefail
          git add -- harness-ui/frontend
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(desktop): actual contextual command registry and bilingual workspace'
          git push origin HEAD:refs/heads/refactor/desktop-ledger-2026-09-17
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  qualify:
    needs: source
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-ledger-preview.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
