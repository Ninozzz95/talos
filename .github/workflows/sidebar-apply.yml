name: sidebar-candidate

# Temporary exact-candidate verification; removed before final review.
on:
  pull_request:
    paths: ['.github/workflows/sidebar-apply.yml']
permissions:
  contents: read
concurrency:
  group: sidebar-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.number == 32 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/desktop-left-sidebar-2026-09-17'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply hash-locked sidebar candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          patches = [
            (['87a10ba4bd21d2ee37d7cb2f1ae2be09d695f110','121186f412b15a59cb172affd40723ebff631841','3214269194074631c4f8993fcbce72ace8b8371d','063aaf8a94eb442d7c7c34eb093fb3e33b97f211'],164166,'67ec4240f80af7924c0f4d30b2be2798c802c1f89ed295d6e405aac3b916178d'),
            (['6ed97ca2224b7f4e7b0a1fe1ec2199e6c3404eee'],29604,'47e36543d2d4a16ca3f02dd4e9129f699b0c90e01ac55ffca9246b8b061e3aed'),
          ]
          expected = {
            'harness-ui/docs/sidebar-desktop-design.md':'06d8bc49419aeea8e65a2ff701fcd104e34a5775',
            'harness-ui/frontend/playwright.sidebar.config.mjs':'8541c408450ccaa64a52b7b58f2bd1175587d1e4',
            'harness-ui/frontend/src/components/sidebar-desktop.js':'83cc9653c6195c2cc36e9b4f614c484bdfe19056',
            'harness-ui/frontend/src/components/sidebar-state.js':'bcc44968cbb0aaab7b96f94d7f46b8ac511928d2',
            'harness-ui/frontend/src/components/sidebar-view.js':'a619b31c96693886c8371b81f72c0a85d11dfd1d',
            'harness-ui/frontend/src/legacy/app.js':'a751098fbd2ca8f61ece67834c9a8f8afcd4afae',
            'harness-ui/frontend/src/styles/main.css':'c00a40a3930a7a135182df74bc4bae0a664c0e3d',
            'harness-ui/frontend/src/styles/sidebar-desktop.css':'7eb1f6772b5c5429b0a0700eb200dc8b4a12d8a5',
            'harness-ui/frontend/tests/browser/elenco-dopo-lo-stop.spec.mjs':'60c414a227a10572e8105a2b24cd0dca73f66b3e',
            'harness-ui/frontend/tests/browser/sidebar-desktop.spec.mjs':'a01a34658244f17fd58d681b39ed5e97b9b7d22f',
            'harness-ui/frontend/tests/fixtures/sidebar-fixture.mjs':'8a1f82ac498531ee823f1d77246d8e3bcc984950',
            'harness-ui/frontend/tests/unit/sidebar-state.test.mjs':'534691a1eb697db9c6fb6ce0097f7a274097fb07',
            'harness-ui/src/http-app.mjs':'a5e97f9215962df53400d9835643e3ecc4bf6703',
            'harness-ui/src/session-registry.mjs':'b56f996509b411073eecfce5831b6f126d2a5aab',
            'harness-ui/src/sidebar-activity.mjs':'e86f6a75cb22a8767596a761f0b5fd83c25017f0',
            'harness-ui/src/sidebar-feed.mjs':'2405e89a1dcb8c1b3fd238ba5b5680a28f0e81b4',
            'harness-ui/tests/sidebar-feed.test.mjs':'d2722d3ee6937d17ec5bd55b0cafe8db339cf9bd',
            'harness-ui/frontend/scripts/benchmark-sidebar.mjs':'951d978427882b2d2c642a99135f2346a8c25ef9',
            'harness-ui/frontend/tests/parity/nessun-errore-a-runtime.spec.mjs':'d8f0915b17b718da8dddc7bfa57bb66187be291e',
            'harness-ui/tests/bc09-classificazione-rimozioni.test.mjs':'81af371d7edbf8e6cb9834ac4bf280db7c5abdea',
          }
          subprocess.run(['git','config','core.autocrlf','false'],check=True)
          subprocess.run(['git','reset','--hard','HEAD'],check=True)
          for index,(chunks,length,digest) in enumerate(patches):
            compressed=b''
            for sha in chunks:
              data=json.loads(subprocess.check_output(['gh','api',f'repos/Ninozzz95/talos/git/blobs/{sha}']))
              raw=base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              compressed+=raw
            patch=lzma.decompress(compressed,memlimit=128*1024*1024)
            assert len(patch)==length and hashlib.sha256(patch).hexdigest()==digest
            name=f'candidate-{index}.patch';pathlib.Path(name).write_bytes(patch)
            subprocess.run(['git','apply','--check','--index','--unidiff-zero',name],check=True)
            subprocess.run(['git','apply','--index','--unidiff-zero',name],check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(changed)==set(expected),changed
          for path,sha in expected.items():
            assert subprocess.check_output(['git','rev-parse',':'+path],text=True).strip()==sha,path
          pathlib.Path('evidence').mkdir(exist_ok=True)
          pathlib.Path('evidence/candidate-manifest.json').write_text(json.dumps(expected,indent=2))
          print('Exact corrected candidate verified: 20 sidebar-related files.')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            harness-ui/package-lock.json
            harness-ui/frontend/package-lock.json
            context-engine/package-lock.json
      - name: Locked dependencies
        run: |
          npm ci --prefix harness-ui
          npm ci --prefix harness-ui/frontend
          npm ci --prefix context-engine
          node --version | tee evidence/node-version.txt
      - name: Chromium
        if: runner.os == 'Linux'
        working-directory: harness-ui/frontend
        run: npx playwright install --with-deps chromium
      - name: Feed, controller and cleanup regressions
        id: focused
        continue-on-error: true
        run: |
          set -o pipefail
          node --test harness-ui/tests/sidebar-feed.test.mjs harness-ui/frontend/tests/unit/sidebar-state.test.mjs harness-ui/tests/bc09-classificazione-rimozioni.test.mjs 2>&1 | tee evidence/focused.log
      - name: Full frontend unit suite
        id: unit
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix harness-ui/frontend run test:unit 2>&1 | tee evidence/frontend-unit.log
      - name: Frontend build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix harness-ui/frontend run build 2>&1 | tee evidence/frontend-build.log
      - name: Sidebar browser and real two-window server
        id: browser
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: harness-ui/frontend
        run: |
          set -o pipefail
          npx playwright test --config=playwright.sidebar.config.mjs 2>&1 | tee ../../evidence/sidebar-browser.log
      - name: Baseline comparison and screenshots
        id: benchmark
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 13f65c15cdeaf8986b882993a0773cdeafb867d2
          mkdir -p "$RUNNER_TEMP/sidebar-baseline"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/sidebar-baseline"
          for dir in harness-ui harness-ui/frontend context-engine; do
            ln -s "$GITHUB_WORKSPACE/$dir/node_modules" "$RUNNER_TEMP/sidebar-baseline/$dir/node_modules"
          done
          npm --prefix "$RUNNER_TEMP/sidebar-baseline/harness-ui/frontend" run build
          cd harness-ui/frontend
          node scripts/benchmark-sidebar.mjs "$RUNNER_TEMP/sidebar-baseline/harness-ui/frontend/dist" 2>&1 | tee ../../evidence/benchmark.log
      - name: Component parity
        id: parity
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix harness-ui/frontend run test:componenti 2>&1 | tee evidence/component-parity.log
      - name: Full Windows server suite
        id: server
        if: runner.os == 'Windows'
        continue-on-error: true
        working-directory: harness-ui
        run: |
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee ../evidence/server-windows.log
      - name: Windows Electron dependencies
        if: runner.os == 'Windows'
        run: |
          npm ci --prefix harness-ui/desktop
          cp -R harness-ui/frontend/dist/. harness-ui/public/
      - name: Windows Electron and desktop pure tests
        id: electron
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          set -o pipefail
          npm --prefix harness-ui/desktop test 2>&1 | tee evidence/desktop-electron.log
      - name: Record true outcomes
        if: always()
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PARITY: ${{ steps.parity.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          BENCHMARK: ${{ steps.benchmark.outcome }}
          SERVER: ${{ steps.server.outcome }}
          ELECTRON: ${{ steps.electron.outcome }}
        run: |
          python - <<'PY'
          import os,json,pathlib
          gates=['FOCUSED','BUILD']+(['UNIT','PARITY','BROWSER','BENCHMARK'] if os.environ['RUNNER_OS']=='Linux' else ['SERVER','ELECTRON'])
          results={g:os.environ.get(g) for g in gates}
          pathlib.Path('evidence').mkdir(exist_ok=True)
          pathlib.Path('evidence/outcomes.json').write_text(json.dumps(results,indent=2))
          print(results)
          PY
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sidebar-candidate-${{ runner.os }}
          path: |
            evidence/
            harness-ui/frontend/artifacts/
            harness-ui/frontend/test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce every executed gate
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          results=json.loads(pathlib.Path('evidence/outcomes.json').read_text())
          assert all(v=='success' for v in results.values()),results
          PY
