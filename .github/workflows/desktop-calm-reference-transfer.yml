name: desktop-calm-reference-transfer
on:
  push:
    branches: ['refactor/desktop-ledger-2026-09-17']
    paths: ['docs/refactor/calm-lab/reference-transfer/**', '.github/workflows/desktop-calm-reference-transfer.yml']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Ninozzz95/talos' && github.ref == 'refs/heads/refactor/desktop-ledger-2026-09-17'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
      - name: Materialize guarded sources and remove the transport
        id: publish
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/refactor/desktop-ledger-2026-09-17 | cut -f1)" = "$GITHUB_SHA"
          node docs/refactor/calm-lab/publish-reference.mjs
          git config user.name 'TALOS checkpoint bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- harness-ui/frontend/prototypes/calm-lab harness-ui/frontend/src/styles/main.css harness-ui/frontend/src/design-system/calm-controls.css harness-ui/frontend/tests/qualification/settings-models-real.mjs harness-ui/frontend/tests/qualification/workspace-real.mjs docs/refactor/calm-lab .github/workflows/desktop-calm-reference-transfer.yml
          git diff --cached --check
          git commit -m 'feat(calm-lab): publish approved reference, complete theme controls and custom QA drivers (CP15)'
          test "$(git ls-remote origin refs/heads/refactor/desktop-ledger-2026-09-17 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/refactor/desktop-ledger-2026-09-17
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  qualify:
    needs: publish
    uses: ./.github/workflows/desktop-calm-review.yml
    with:
      source_sha: ${{ needs.publish.outputs.source_sha }}
