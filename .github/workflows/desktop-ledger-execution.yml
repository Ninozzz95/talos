name: desktop-ledger-execution
on:
  push:
    branches: ['refactor/desktop-ledger-2026-09-17']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-ledger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-verification:
    if: github.repository == 'Ninozzz95/talos' && github.ref == 'refs/heads/refactor/desktop-ledger-2026-09-17'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            harness-ui/package-lock.json
            harness-ui/frontend/package-lock.json
            context-engine/package-lock.json
      - name: Install locked dependencies and real browsers
        run: |
          set -euo pipefail
          npm ci --prefix harness-ui --no-audit --no-fund
          npm ci --prefix harness-ui/frontend --no-audit --no-fund
          npm ci --prefix context-engine --no-audit --no-fund
          node harness-ui/frontend/node_modules/playwright/cli.js install --with-deps chromium chrome
      - name: Build and typecheck actual frontend
        run: |
          set -euo pipefail
          npm --prefix harness-ui/frontend run build
          node harness-ui/node_modules/typescript/bin/tsc -p harness-ui/frontend/tsconfig.refactor.json
      - name: Targeted regression suite
        run: node --test harness-ui/frontend/tests/refactor/*.test.mjs
      - name: Complete frontend unit suite
        id: unit
        continue-on-error: true
        run: npm --prefix harness-ui/frontend run test:unit
      - name: Real server journeys, terminal, viewport and accessibility
        id: journeys
        continue-on-error: true
        run: node harness-ui/frontend/tests/qualification/workspace-real.mjs
      - name: Preserve product evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: talos-workspace-verification-${{ github.sha }}
          path: harness-ui/frontend/test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: All checks are required
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          JOURNEYS: ${{ steps.journeys.outcome }}
        run: test "$UNIT" = success && test "$JOURNEYS" = success
