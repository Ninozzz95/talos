name: diagnose-desktop-linux

on:
  push:
    branches: [fix/ci-linux-desktop-node-pty]

jobs:
  desktop-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: harness-ui/frontend/package-lock.json

      - name: dipendenze del server per il banco browser
        run: npm ci --ignore-scripts
        working-directory: harness-ui

      - name: dipendenze del frontend
        run: npm ci
        working-directory: harness-ui/frontend

      - name: dipendenze del motore di contesto
        run: npm ci
        working-directory: context-engine

      - name: Chromium e dipendenze di sistema
        run: npx playwright install --with-deps chromium
        working-directory: harness-ui/frontend

      - name: unit del frontend
        run: npm run test:unit
        working-directory: harness-ui/frontend

      - name: build del frontend
        run: npm run build
        working-directory: harness-ui/frontend

      - name: parita dei componenti col mockup
        run: npx playwright test -c playwright.componenti.config.mjs --reporter=line
        working-directory: harness-ui/frontend

      - name: lab dei componenti
        run: npx playwright test -c playwright.lab.config.mjs --reporter=line
        working-directory: harness-ui/frontend
