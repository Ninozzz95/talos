name: diagnose-desktop-linux

on:
  push:
    branches: [fix/ci-linux-desktop-node-pty]

jobs:
  desktop-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: harness-ui/frontend/package-lock.json

      - name: dipendenze del server per il banco browser
        run: npm ci --ignore-scripts
        working-directory: harness-ui

      - name: dipendenze del frontend
        run: npm ci
        working-directory: harness-ui/frontend

      - name: dipendenze del motore di contesto
        run: npm ci
        working-directory: context-engine

      - name: Chromium e dipendenze di sistema
        run: npx playwright install --with-deps chromium
        working-directory: harness-ui/frontend

      - name: unit del frontend
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee ../../desktop-frontend-linux.log
        working-directory: harness-ui/frontend

      - name: conserva il log frontend
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-frontend-linux-log
          path: desktop-frontend-linux.log
          if-no-files-found: error
          retention-days: 7
