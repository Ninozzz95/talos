name: desktop pretag installer

on:
  pull_request:
    paths:
      - .github/workflows/desktop-pretag-installer.yml
      - harness-ui/**
      - context-engine/**

permissions:
  contents: read

jobs:
  desktop-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      TALOS_R02_BUILDER_NETWORK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            harness-ui/package-lock.json
            harness-ui/frontend/package-lock.json
            harness-ui/desktop/package-lock.json
            context-engine/package-lock.json

      - name: dipendenze fissate dai lock
        timeout-minutes: 10
        run: |
          foreach ($path in @('harness-ui', 'harness-ui/frontend', 'harness-ui/desktop', 'context-engine')) {
            npm ci --prefix $path --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "npm ci fallito: $path" }
          }

      - name: Go 1.27.1 verificato
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'go1.27.1.windows-amd64.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'talos-go-1.27.1'
          Invoke-WebRequest -Uri 'https://go.dev/dl/go1.27.1.windows-amd64.zip' -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($hash -ne 'a3911b5e0e1b1053f25ed0675f4c1c6aad1e2bfcf253df2b9be4caabd2edd95d') { throw 'Archivio Go non conforme.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $go = Join-Path $directory 'go/bin/go.exe'
          $env:TALOS_GO_BINARY = $go
          "TALOS_GO_BINARY=$go" >> $env:GITHUB_ENV
          npm --prefix harness-ui run build:chat-upload
          if ($LASTEXITCODE -ne 0) { throw 'Build helper upload fallita.' }

      - name: frontend distribuito
        run: |
          npm --prefix harness-ui/frontend run build
          if ($LASTEXITCODE -ne 0) { throw 'Build frontend fallita.' }
          Copy-Item -Path harness-ui/frontend/dist/* -Destination harness-ui/public/ -Recurse -Force

      - name: costruisci NSIS e ZIP
        timeout-minutes: 15
        run: |
          npm --prefix harness-ui/desktop run dist
          if ($LASTEXITCODE -ne 0) { throw 'Build installer/ZIP fallita.' }

      - name: installa, avvia e disinstalla prima del tag
        timeout-minutes: 8
        run: |
          $version = (Get-Content harness-ui/desktop/package.json -Raw | ConvertFrom-Json).version
          $installer = "harness-ui/desktop/dist/TALOS-Setup-$version.exe"
          ./harness-ui/desktop/scripts/ci-smoke.ps1 -Installer $installer
          $reportPath = 'harness-ui/desktop/.prove/R04-ci-smoke.json'
          $report = Get-Content -LiteralPath $reportPath -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
          if ($report.schema -cne 'talos.desktop.ci-smoke.v1' -or $report.completato -cne $true) {
            throw "Smoke installer incompleto: $reportPath"
          }

      - if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: desktop-pretag-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: harness-ui/desktop/.prove/R04-ci-smoke.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
