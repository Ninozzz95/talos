<title>TALOS — Impostazioni & Laboratorio modelli · Scheda a pagina intera</title>
<style>/*
 * ⭐⭐⭐ I QUATTORDICI TEMI — 11/09/2026: ALLINEATI AL MOBILE, che e' la sorgente di verita'.
 *
 * Owner 11/09: «sistemare tutte le incongruenze fra i temi del desktop e quelli del mobile ⭐ il
 * mobile e' la sorgente di verita': li' funziona tutto alla perfezione».
 *
 * ⛔ COSA ERA DISALLINEATO, tema per tema. Il desktop aveva quattordici tavolozze scritte a mano
 *   (venivano da `TALOS_THEME_TOKENS` in `legacy/app.js`); il mobile ha quattordici SEMI —
 *   `mobile/src/lib/talosThemes.ts:182-425`, campo `preview` — da cui deriva tutto con `color-mix`.
 *   Confrontati uno per uno (accento desktop -> accento mobile):
 *     forge     #c08b3c -> #c98b32      paper     #9b5b2a -> #a96617
 *     terminal  #67d391 -> #63f08e      aurora    #a995ff -> #42e7c7   ⛔ viola contro verde-acqua
 *     glacier   #8fd8f3 -> #2367d1  ⛔  ember     #ef8b57 -> #ff5c62
 *     atlas     #74a8ff -> #d49a52  ⛔ azzurro contro bronzo
 *     noir      #d4d4d8 -> #f2f2f2      signal    #5ce1e6 -> #ff6f61   ⛔ ciano contro corallo
 *     violet    #d3a6ff -> #b794f6      claudius  #d2a96d -> #d97757
 *     basicus   #aeb4c0 -> #1976d2  ⛔  telemetry #75d0a4 -> #6ad4d4
 *     calm      #c08b3c -> #c08b3c   ✔ l'UNICO gia' identico, e infatti e' quello di serie
 *   ⛔ E quattro temi che sul mobile sono CHIARI (`isLight: true` — paper, glacier, claudius,
 *     basicus) sul desktop erano scuri: tre su quattro sbagliati.
 *   ⇒ Tredici temi su quattordici avevano un altro accento, quattro anche un'altra luce. Due
 *     prodotti che dicono «Aurora» e mostrano due cose diverse.
 *
 * ⇒ QUI i quattordici partono dagli STESSI QUATTRO SEMI del mobile (accento, fondo, secondario,
 *   linea) e i neutri si derivano con le formule del mobile, verbatim da
 *   `mobile/src/lib/talosThemes.ts:581-691` — `mixColor(c,amt,t) = color-mix(in srgb, c amt%, t)`:
 *     SCURO   fondo = isLight ? mix(accento,10,#06080d) : seme;  pannello = mix(fondo,86,#141a24);
 *             testo = #edf2f7;  tenue = mix(testo,68,fondo);  bordo = mix(linea,74,#111827)
 *     CHIARO  fondo = isLight ? seme : mix(accento,5,#f8fafc);   pannello = mix(fondo,92,#ffffff);
 *             testo = #111827;  tenue = mix(testo,68,fondo);  bordo = mix(linea,72,#d7dee8)
 *
 * ⛔ TRE COSE NON SONO STATE PORTATE, e non per svista:
 *   1. `calm` resta ESATTAMENTE com'e'. I suoi quattro semi sono gia' identici a quelli del mobile
 *      (#1e1f22 / #c08b3c / #8e9095 / #36373b), ma i neutri DERIVATI no (pannello desktop #25262a
 *      contro #1d1e22 del mobile, testo #f3f0e9 contro #edf2f7). E' il tema di serie, quello che
 *      l'owner sta guardando adesso, ed e' scritto e approvato a mano: cambiarlo non e' allineare
 *      due sistemi, e' cambiare il prodotto sotto gli occhi di chi lo usa. Registrato, non fatto.
 *   2. I CARATTERI per tema. Il mobile dà Manrope ad aurora/atlas/signal, Sora a violet, Source
 *      Serif 4 a paper/claudius. Sul desktop sono spediti DUE font soli (Instrument Sans e
 *      JetBrains Mono, verificato in `dist/fonts/`): scrivere quei nomi qui darebbe un ripiego di
 *      sistema silenzioso, cioe' una regressione travestita da allineamento.
 *   3. L'ACCENTO IN CHIARO resta scurito dal desktop (sezione 3) invece che preso grezzo come fa il
 *      mobile: l'accento di un tema scuro su carta non arriva a 3:1, e WCAG 2.2 SC 1.4.11 chiede
 *      almeno 3:1 per i componenti d'interfaccia. Qui il desktop e' piu' corretto del mobile.
 *
 * Come e' costruito, e perche' cosi':
 *   1. un blocco per tema dichiara i QUATTRO SEMI (`--talos-seme-*`) e il raggio. Vive a
 *      specificita' (0,2,0) e non tocca nessun token del contratto;
 *   2. due blocchi derivano i `--talos-tema-*` dai semi, uno per modo, con le formule del mobile;
 *   3. la palette SCURA completa sta in `…:not([data-theme="light"])` — (0,3,0), quindi vince su
 *      `:root` di `index.css` senza dover scrivere un `!important`;
 *   4. la palette CHIARA sta nel gemello `[data-theme="light"]`, e `calm` ne e' escluso.
 *   ⛔ I token derivati (`--talos-card-subtle`, `--talos-border-subtle`, …) non si ripetono qui:
 *     `index.css` li costruisce gia' con `color-mix` a partire da questi, e si ricalcolano da soli.
 *
 * Ricerca 10/09/2026 prima di scrivere — hirejeffgreen.com «Multi-Theme Design System: CSS Variables
 * + Data Attributes» e sprucecss.com «Cracking the Theme Switcher and Dark Mode»: l'attributo sulla
 * radice piu' i custom properties e' la forma consigliata per N temi.
 */

/* ---------- 1. I QUATTRO SEMI DI OGNI TEMA — gli stessi del mobile ----------
   ⛔ I raggi restano quelli del desktop: il mobile ha una scala a TRE gradini
   (sharp 0 / balanced 0,5rem / soft 0,75rem) invece di un valore per tema. Allinearli e' un'altra
   decisione, e cambierebbe la forma di ogni scheda senza che nessuno l'abbia chiesta. Registrato. */
:root[data-talos-theme="forge"]     { --talos-seme-accento:#c98b32; --talos-seme-fondo:#080b11; --talos-seme-secondario:#6ad4d4; --talos-seme-linea:#27313e; --talos-radius-card:14px; --talos-radius-control:14px; }
:root[data-talos-theme="paper"]     { --talos-seme-accento:#a96617; --talos-seme-fondo:#f8fafc; --talos-seme-secondario:#2f6f7d; --talos-seme-linea:#d7dee8; --talos-seme-fondo-chiaro:#f8fafc; --talos-seme-fondo-scuro:color-mix(in srgb, #a96617 10%, #06080d); --talos-radius-card:10px; --talos-radius-control:10px; }
:root[data-talos-theme="terminal"]  { --talos-seme-accento:#63f08e; --talos-seme-fondo:#020403; --talos-seme-secondario:#d6ff72; --talos-seme-linea:#163821; --talos-radius-card:6px; --talos-radius-control:6px;
  --talos-font-ui:"JetBrains Mono","SFMono-Regular",Consolas,monospace; --talos-font-display:"JetBrains Mono","SFMono-Regular",Consolas,monospace; }
:root[data-talos-theme="aurora"]    { --talos-seme-accento:#42e7c7; --talos-seme-fondo:#071113; --talos-seme-secondario:#ff6bb5; --talos-seme-linea:#233742; --talos-radius-card:16px; --talos-radius-control:16px; }
:root[data-talos-theme="glacier"]   { --talos-seme-accento:#2367d1; --talos-seme-fondo:#f4f9fb; --talos-seme-secondario:#ef7d30; --talos-seme-linea:#c9d7e3; --talos-seme-fondo-chiaro:#f4f9fb; --talos-seme-fondo-scuro:color-mix(in srgb, #2367d1 10%, #06080d); --talos-radius-card:14px; --talos-radius-control:14px; }
:root[data-talos-theme="ember"]     { --talos-seme-accento:#ff5c62; --talos-seme-fondo:#10090a; --talos-seme-secondario:#ffbd5c; --talos-seme-linea:#3b2224; --talos-radius-card:14px; --talos-radius-control:14px; }
:root[data-talos-theme="atlas"]     { --talos-seme-accento:#d49a52; --talos-seme-fondo:#07101f; --talos-seme-secondario:#57d49c; --talos-seme-linea:#243146; --talos-radius-card:12px; --talos-radius-control:12px; }
:root[data-talos-theme="noir"]      { --talos-seme-accento:#f2f2f2; --talos-seme-fondo:#050505; --talos-seme-secondario:#ff405a; --talos-seme-linea:#333333; --talos-radius-card:4px; --talos-radius-control:4px; }
:root[data-talos-theme="signal"]    { --talos-seme-accento:#ff6f61; --talos-seme-fondo:#091011; --talos-seme-secondario:#b4f06f; --talos-seme-linea:#213236; --talos-radius-card:10px; --talos-radius-control:10px; }
:root[data-talos-theme="violet"]    { --talos-seme-accento:#b794f6; --talos-seme-fondo:#0d0a19; --talos-seme-secondario:#6ee7b7; --talos-seme-linea:#2f2848; --talos-radius-card:18px; --talos-radius-control:18px; }
:root[data-talos-theme="claudius"]  { --talos-seme-accento:#d97757; --talos-seme-fondo:#faf9f5; --talos-seme-secondario:#6a9bcc; --talos-seme-linea:#e8e6dc; --talos-seme-fondo-chiaro:#faf9f5; --talos-seme-fondo-scuro:color-mix(in srgb, #d97757 10%, #06080d); --talos-radius-card:12px; --talos-radius-control:12px; }
:root[data-talos-theme="basicus"]   { --talos-seme-accento:#1976d2; --talos-seme-fondo:#fafafa; --talos-seme-secondario:#9c27b0; --talos-seme-linea:#e0e0e0; --talos-seme-fondo-chiaro:#fafafa; --talos-seme-fondo-scuro:color-mix(in srgb, #1976d2 10%, #06080d); --talos-radius-card:8px; --talos-radius-control:8px; }
:root[data-talos-theme="telemetry"] { --talos-seme-accento:#6ad4d4; --talos-seme-fondo:#0b0f11; --talos-seme-secondario:#63f08e; --talos-seme-linea:#1f3238; --talos-radius-card:10px; --talos-radius-control:10px;
  --talos-font-ui:"JetBrains Mono","SFMono-Regular",Consolas,monospace; --talos-font-display:"JetBrains Mono","SFMono-Regular",Consolas,monospace; }

/* ⛔ `calm` NON passa dai semi: tiene i suoi `--talos-tema-*` scritti a mano, identici a ieri. */
:root[data-talos-theme="calm"]     { --talos-seme-accento:#c08b3c; --talos-seme-fondo:#1e1f22; --talos-seme-secondario:#8e9095; --talos-seme-linea:#36373b;
  --talos-tema-accento:#c08b3c; --talos-tema-fondo:#1e1f22; --talos-tema-pannello:#25262a; --talos-tema-testo:#f3f0e9; --talos-tema-tenue:#9c9da2; --talos-tema-bordo:#36373b;
  --talos-radius-card:12px; --talos-radius-control:12px }

/* ---------- 1-bis. La SCENA: quale tema dipinge lo sfondo ----------
   `applicaThemeDesktop` scrive `data-talos-scene` sulla radice (vale il tema, oppure quello scelto
   a mano in «Scena»); `aspetto.css` usa questo accento per le macchie dello sfondo della chat.
   `follow-theme` non compare apposta: senza una regola sua, `--talos-scena-accento` resta non
   definito e il ripiego `var(…, var(--talos-accent))` fa seguire il tema.
   ⛔ Nel mobile `data-talos-scene` NON esiste: la scena viaggia come proprieta' JS
   (`scene_override ?? themeId`, `mobile/src/motion-v6/workspaceRuntime.ts:55`) perche' li' la
   disegna un canvas. Qui la disegna il CSS, quindi le serve un attributo. Stessa semantica —
   «la scena segue il tema, salvo scelta esplicita» — forma diversa perche' diverso e' il motore. */
:root[data-talos-scene="forge"]      { --talos-scena-accento:#c98b32 }
:root[data-talos-scene="paper"]      { --talos-scena-accento:#a96617 }
:root[data-talos-scene="terminal"]   { --talos-scena-accento:#63f08e }
:root[data-talos-scene="aurora"]     { --talos-scena-accento:#42e7c7 }
:root[data-talos-scene="glacier"]    { --talos-scena-accento:#2367d1 }
:root[data-talos-scene="ember"]      { --talos-scena-accento:#ff5c62 }
:root[data-talos-scene="atlas"]      { --talos-scena-accento:#d49a52 }
:root[data-talos-scene="noir"]       { --talos-scena-accento:#f2f2f2 }
:root[data-talos-scene="signal"]     { --talos-scena-accento:#ff6f61 }
:root[data-talos-scene="violet"]     { --talos-scena-accento:#b794f6 }
:root[data-talos-scene="claudius"]   { --talos-scena-accento:#d97757 }
:root[data-talos-scene="basicus"]    { --talos-scena-accento:#1976d2 }
:root[data-talos-scene="telemetry"]  { --talos-scena-accento:#6ad4d4 }
:root[data-talos-scene="calm"]       { --talos-scena-accento:#c08b3c }

/* ---------- 1-ter. DAI SEMI AL TEMA — le formule sono quelle del mobile ----------
   `mobile/src/lib/talosThemes.ts:581-691`. ⛔ `calm` e' escluso: i suoi `--talos-tema-*` sono
   scritti a mano nella sezione 1 e devono restare quelli. */
:root[data-talos-theme]:not([data-talos-theme="calm"]):not([data-theme="light"]) {
  --talos-tema-accento: var(--talos-seme-accento);
  --talos-tema-fondo: var(--talos-seme-fondo-scuro, var(--talos-seme-fondo));
  --talos-tema-pannello: color-mix(in srgb, var(--talos-tema-fondo) 86%, #141a24);
  --talos-tema-testo: #edf2f7;
  --talos-tema-tenue: color-mix(in srgb, var(--talos-tema-testo) 68%, var(--talos-tema-fondo));
  --talos-tema-bordo: color-mix(in srgb, var(--talos-seme-linea) 74%, #111827);
}
:root[data-talos-theme]:not([data-talos-theme="calm"])[data-theme="light"] {
  --talos-tema-accento: var(--talos-seme-accento);
  --talos-tema-fondo: var(--talos-seme-fondo-chiaro, color-mix(in srgb, var(--talos-seme-accento) 5%, #f8fafc));
  --talos-tema-pannello: color-mix(in srgb, var(--talos-tema-fondo) 92%, #ffffff);
  --talos-tema-testo: #111827;
  --talos-tema-tenue: color-mix(in srgb, var(--talos-tema-testo) 68%, var(--talos-tema-fondo));
  --talos-tema-bordo: color-mix(in srgb, var(--talos-seme-linea) 72%, #d7dee8);
}

/* ---------- 2. La palette scura: una regola sola, i valori vengono dal tema ----------
   ⛔ `:not([data-theme="light"])` non e' un vezzo: porta la specificita' a (0,3,0) e fa vincere
   questo blocco su `:root` di `index.css` senza `!important`, lasciando intatto il tema chiaro. */
:root[data-talos-theme]:not([data-theme="light"]) {
  --talos-background: var(--talos-tema-fondo);
  --talos-panel: var(--talos-tema-pannello);
  --talos-panel-soft: color-mix(in srgb, var(--talos-tema-pannello) 74%, #05070b);
  --talos-card: color-mix(in srgb, var(--talos-tema-pannello) 88%, #05070b);
  --talos-window-bg: color-mix(in srgb, var(--talos-tema-pannello) 92%, #05070b);
  --talos-text: var(--talos-tema-testo);
  --talos-assistant-text: color-mix(in srgb, var(--talos-tema-testo) 78%, var(--talos-tema-tenue));
  --talos-muted: var(--talos-tema-tenue);
  --talos-border: var(--talos-tema-bordo);
  --talos-border-strong: color-mix(in srgb, var(--talos-seme-linea, var(--talos-tema-bordo)) 82%, #dce7f5);
  --talos-accent: var(--talos-tema-accento);
  --talos-accent-hover: color-mix(in srgb, var(--talos-tema-accento) 78%, #fff);
  --talos-accent-soft: color-mix(in srgb, var(--talos-tema-accento) 18%, var(--talos-tema-fondo));
  --talos-accent-border: color-mix(in srgb, var(--talos-tema-accento) 34%, transparent);
  --talos-accent-text: color-mix(in srgb, var(--talos-tema-accento) 62%, #fff);
  --talos-ring: color-mix(in srgb, var(--talos-tema-accento) 84%, #fff);
  --talos-ring-soft: color-mix(in srgb, var(--talos-tema-accento) 9%, transparent);
  --talos-text-on-accent: color-mix(in srgb, var(--talos-tema-fondo) 78%, #000);
  --talos-measure-measured: var(--talos-tema-testo);
  --talos-measure-estimated: var(--talos-tema-tenue);
}
/* ⛔ `calm` tiene i due derivati che aveva prima dell'allineamento: `panel-soft` e `card` li
   calcolava verso il TESTO, non verso il nero, ed e' la sfumatura che l'owner vede da mesi. */
:root[data-talos-theme="calm"]:not([data-theme="light"]) {
  --talos-panel-soft: color-mix(in srgb, var(--talos-tema-pannello) 92%, var(--talos-tema-testo));
  --talos-card: color-mix(in srgb, var(--talos-tema-pannello) 86%, var(--talos-tema-testo));
  --talos-window-bg: color-mix(in srgb, var(--talos-tema-fondo) 86%, #000);
  --talos-border-strong: color-mix(in srgb, var(--talos-tema-bordo) 62%, var(--talos-tema-testo));
  --talos-accent-soft: color-mix(in srgb, var(--talos-tema-accento) 14%, transparent);
}

/* ⛔ Quattro temi sono CHIARI anche quando la modalita' colore e' «scuro» — non e' vero: sul mobile
   `isLight` decide solo il RIPIEGO, e in `system` comanda il sistema operativo
   (`mobile/src/lib/talosThemes.ts:461-475`). Qui, in scuro, un tema chiaro prende il fondo che il
   mobile calcola per lo scuro (`mix(accento,10,#06080d)`), che e' una regola sua, non una mia
   invenzione. Resta solo `color-scheme`: senza, le scrollbar e i controlli nativi litigherebbero. */
:root:is([data-talos-theme="paper"],[data-talos-theme="glacier"],[data-talos-theme="claudius"],[data-talos-theme="basicus"])[data-theme="light"] { color-scheme: light }

/* ---------- 2-bis. IL TESTO TENUE DI `calm` CHIARO NON ARRIVAVA AD AA — misurato in pixel ----------
 *
 * ⛔ Trovato dal cancello `aspetto-non-rende-illeggibile.spec.mjs`, non a occhio: nel tema di serie
 *   in modo CHIARO il testo tenue (`--talos-muted: #686a70`, cioè rgb 104 106 112) misurato sul
 *   fondo VERO sotto le lettere dà
 *     · 4,46:1 sulla riga del modello e dell'ora (`.talos-message__meta`, fondo rgb 236 233 226);
 *     · 4,30:1 sul sopratitolo (`.talos-eyebrow`, fondo rgb 232 229 222);
 *     · 4,26:1 sul corpo di una nota di sistema (fondo rgb 231 228 222).
 *   WCAG 2.2 AA chiede **4,5:1** per il testo normale. Sono tre mancati su tre superfici diverse,
 *   e sono l'UNICO testo ordinario della conversazione sotto la soglia in 28 combinazioni
 *   tema x modo. ⛔ Non c'entra lo sfondo animato: sotto il testo la scena cambia **0 pixel**
 *   (misurato), quindi questi numeri sono identici a scena spenta — è la tavolozza.
 *
 * ⇒ `#62646a` (rgb 98 100 106), cioè SEI punti più scuro, stessa tinta. Rimisurato sul banco:
 *     4,46 → **4,88**   4,30 → **4,70**   4,26 → **4,66**. Tutte e tre sopra la soglia, con margine.
 * ⛔ Sta QUI e non in `index.css` perché quel foglio è GENERATO dal mockup e si riscrive da solo;
 *   e vale per `calm` chiaro soltanto, perché gli altri tredici temi derivano il tenue con la
 *   formula del mobile (`mix(testo 68%, fondo)`) e nessuno di loro è sotto AA.
 * ⛔ È la sola tinta del tema di serie toccata da questo giro, ed è reversibile in una riga:
 *   togliere questo blocco riporta esattamente `#686a70`. Specificità (0,3,0), niente `!important`.
 *
 * Ricerca 11/09/2026 prima di scrivere: webability.io «Color Contrast for Accessibility: WCAG Guide
 * (2026)» e achecks.org «Gradients: Accessible Colour Contrasts with Gradient Backgrounds» — su un
 * fondo che varia si campiona nel punto di contrasto PIÙ BASSO sotto il testo, non un colore solo.
 */
:root[data-talos-theme="calm"][data-theme="light"] { --talos-muted: #62646a; }

/* ---------- 3. Il chiaro: neutri dal tema, accento SCURITO ----------
   ⛔ I neutri seguono il mobile (sezione 1-ter). L'ACCENTO no, e la ragione e' misurabile: in chiaro
   l'accento grezzo di un tema scuro (per es. `terminal` #63f08e) su carta non arriva a 3:1, e
   WCAG 2.2 SC 1.4.11 «Non-text Contrast» chiede almeno 3:1 per i componenti d'interfaccia (W3C WAI,
   letto il 10/09/2026). Qui viene scurito verso l'inchiostro finche' regge. E' l'unico punto in cui
   il desktop si allontana dal mobile di proposito, perche' e' piu' corretto.
   ⛔ `calm` e' ESCLUSO: il suo chiaro sta in `index.css`, scritto e approvato a mano dall'owner.
   Derivarlo di nuovo qui lo cambierebbe (misurato: accento su fondo da 4,37 a 5,82). */
:root[data-talos-theme][data-theme="light"]:not([data-talos-theme="calm"]) {
  --talos-background: var(--talos-tema-fondo);
  --talos-panel: var(--talos-tema-pannello);
  --talos-panel-soft: color-mix(in srgb, var(--talos-tema-fondo) 78%, #ffffff);
  --talos-card: color-mix(in srgb, var(--talos-tema-pannello) 96%, #ffffff);
  --talos-window-bg: color-mix(in srgb, var(--talos-tema-pannello) 96%, #ffffff);
  --talos-text: var(--talos-tema-testo);
  --talos-assistant-text: color-mix(in srgb, var(--talos-tema-testo) 88%, var(--talos-tema-tenue));
  --talos-muted: var(--talos-tema-tenue);
  --talos-border: var(--talos-tema-bordo);

/* CP06 · Catalogo e pagina modello: due destinazioni, nessun inspector. */
#lab-panel .catalog-full{display:block}
.catalog-full .model-row{min-height:91px}
.catalog-full .model-select{min-width:0}
.catalog-full .model-row-copy{flex:1;min-width:0}
.row-capacity{min-width:125px;text-align:right;margin:0 38px 0 20px;display:flex;flex-direction:column;gap:2px}
.row-capacity strong{font-family:var(--mono);font-weight:400;font-size:.875rem;color:var(--text)}
.row-capacity small{font-size:.6875rem;color:var(--muted)}
.catalog-full .list-group-label{margin-top:24px}
.catalog-full .list-group-label:first-child{margin-top:0}
.model-page{width:100%;min-width:0}
.model-page-toolbar{position:sticky;top:-32px;z-index:5;background:var(--bg);display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line-soft);min-height:67px;margin-top:-18px}
.model-page-toolbar>.button{padding-left:0;flex:none;color:var(--muted)}
.model-page-toolbar>.button:hover{background:transparent!important;color:var(--text)}
.toolbar-identity{font-size:.8125rem;font-weight:500;display:flex;gap:10px;align-items:center;padding-left:16px;border-left:1px solid var(--line);min-width:0}
.toolbar-identity>span{font-size:.625rem;font-weight:400;color:var(--muted)}
.model-page-actions{display:flex;gap:10px;align-items:center;margin-left:auto}
.model-page-actions .button{min-height:38px}
.model-hero{display:grid;grid-template-columns:1fr auto;gap:16px 24px;padding:33px 0 29px;align-items:start}
.model-hero-identity{display:flex;gap:20px;align-items:center;min-width:0}
.model-hero .model-glyph.large{width:70px;height:70px;border-radius:18px;background:var(--panel)}
.model-hero .model-glyph.large svg{width:38px;height:38px}
.model-hero h1{font-size:2.5rem;font-weight:550;letter-spacing:-.045em;line-height:1.14}
.model-hero .eyebrow{font-size:.5625rem;letter-spacing:.14em;margin-bottom:8px}
.model-repository{display:flex;align-items:center;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:.75rem;margin-top:9px;overflow-wrap:anywhere}
.model-repository .icon{width:13px;height:13px}
.model-repository>span{min-width:0}
.model-hero-caption{grid-column:1/-1;color:var(--muted);font-size:.875rem}
.model-page-favorite{align-self:start;margin-top:19px;font-weight:400}
.model-page-favorite.is-favorite{color:var(--accent-text)}
.model-context-strip{display:grid;grid-template-columns:1fr 1fr 1.3fr 1.1fr;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 0;margin-bottom:19px}
.model-context-strip>div{padding:0 21px;display:flex;gap:12px;align-items:center;border-right:1px solid var(--line)}
.model-context-strip>div:last-child{border-right:0}
.model-context-strip>div>.icon{color:var(--muted);width:18px;height:18px}
.model-context-strip small{font-size:.5625rem;letter-spacing:.08em;color:var(--muted);display:block;margin-bottom:6px}
.model-context-strip strong{display:block;font-size:.75rem;font-weight:500}
.model-context-strip .badge{font-size:.6875rem;padding:0;background:none;white-space:normal}
.model-page-tabs{display:flex;align-items:stretch;gap:26px;border-bottom:1px solid var(--line);margin-bottom:25px;min-width:0}
.model-page-tabs>[role=tab]{display:flex;align-items:center;gap:8px;font-size:.8125rem;padding:14px 0 16px;min-height:51px;border-bottom:2px solid transparent;color:var(--muted)}
.model-page-tabs>[role=tab][aria-selected=true]{border-bottom-color:var(--accent);color:var(--text)}
.model-page-tabs>[role=tab]:hover{color:var(--text)}
.model-page-tabs .icon{width:16px;height:16px}
.model-page-tab-note{font-size:.6875rem;color:var(--muted);margin-left:auto;display:flex;gap:7px;align-items:center}
.readme-surface{border:1px solid var(--line);border-radius:12px;background:var(--panel);min-width:0}
.readme-chrome{display:flex;align-items:center;justify-content:space-between;gap:15px;min-height:49px;padding:8px 22px;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.readme-chrome>span{display:flex;align-items:center;gap:10px;min-width:0}
.readme-chrome .icon{width:15px;height:15px;color:var(--muted)}
.readme-chrome strong{font:400 .75rem var(--mono)}
.readme-format{font-size:.6875rem;color:var(--muted);padding-left:13px;border-left:1px solid var(--line)}
.card-state-picker{display:flex;gap:6px;align-items:center;font-size:.625rem;color:var(--muted)}
.card-state-picker select{min-height:29px;border-color:transparent;padding:3px 26px 3px 6px;font-size:.6875rem;border-radius:5px;max-width:130px}
.readme-index{padding:11px 22px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line-soft)}
.readme-index>span{font-size:.5625rem;letter-spacing:.08em;color:var(--muted);margin-right:13px}
.readme-index button{font-size:.6875rem;color:var(--muted);padding:6px 9px;min-height:32px;border-radius:6px}
.readme-index button:hover{color:var(--text);background:var(--soft)}
.readme-body{max-width:960px;margin:0 auto;padding:40px 48px 46px;font-size:.9375rem;line-height:1.85;min-width:0}
.readme-body h2{font-size:1.85rem;letter-spacing:-.04em;font-weight:550;line-height:1.3;margin:9px 0 17px;overflow-wrap:anywhere}
.readme-body h3{font-size:1.15rem;letter-spacing:-.023em;line-height:1.4;margin-bottom:13px;font-weight:550}
.readme-body p{color:var(--muted)}
.readme-body .readme-lead{font-size:1.02rem;line-height:1.8;color:var(--text)}
.document-kicker{font-family:var(--mono);font-size:.625rem;letter-spacing:.11em;color:var(--muted)}
.document-kicker>span{color:var(--line);margin:0 8px}
.document-tags{display:flex;gap:7px;flex-wrap:wrap;margin:23px 0 32px}
.document-tags .badge{font-size:.625rem;font-weight:400;background:transparent;border:1px solid var(--line);border-radius:5px;padding:3px 8px}
.document-section+.document-section{border-top:1px solid var(--line);margin-top:35px;padding-top:32px}
.document-section [tabindex]{scroll-margin-top:95px}
.architecture-strip{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:0;margin:24px 0 13px;border:1px solid var(--line);border-radius:9px;padding:17px 0;background:var(--bg)}
.architecture-strip>div{padding:0 21px;border-right:1px solid var(--line)}
.architecture-strip>div:last-child{border:0}
.architecture-strip dt{color:var(--muted);font-size:.6875rem}
.architecture-strip dd{margin:6px 0 0;font:400 1.5rem var(--mono);letter-spacing:-.04em;color:var(--text)}
.architecture-strip small{font:400 .6875rem var(--ui);letter-spacing:0;color:var(--muted)}
.readme-body .source-caption{font-size:.6875rem;line-height:1.7}
.text-link{display:inline-flex;gap:5px;align-items:center;color:var(--accent-text);text-decoration:none;font-size:inherit}
.text-link:hover{text-decoration:underline;text-underline-offset:4px}
.text-link .icon{width:13px;height:13px}
.source-button{display:inline-flex;margin-top:23px;text-decoration:none}
.readme-body .editor-note{font-size:.5625rem;letter-spacing:.09em;color:var(--accent-text);margin:14px 0 9px}
.document-flow{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;margin:24px 0}
.document-flow>div{padding:17px 18px;border-right:1px solid var(--line)}
.document-flow>div:last-child{border:0}
.document-flow>div>span{font:400 .6875rem var(--mono);color:var(--accent-text);display:block;margin-bottom:8px}
.document-flow strong{font-size:.8125rem;font-weight:550;display:block;line-height:1.45}
.document-flow p{font-size:.75rem;line-height:1.6;margin-top:5px}
.document-code{border:1px solid var(--line);border-radius:9px;background:var(--bg);min-width:0}
.document-code>div{padding:10px 16px;font-size:.6875rem;color:var(--muted);display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line)}
.document-code .icon{width:14px;height:14px}
.document-code pre{margin:0;padding:18px;font:400 .8125rem/1.9 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.document-callout{border-left:2px solid var(--accent);padding:15px 18px;background:var(--bg);border-radius:0 7px 7px 0;display:flex;gap:12px;margin:21px 0}
.document-callout>.icon{color:var(--accent-text);margin-top:5px}
.document-callout strong{font-size:.875rem;font-weight:500}
.document-callout p{font-size:.8125rem;margin-top:4px}
.document-metadata{display:grid;margin:20px 0 0;font-size:.8125rem}
.document-metadata>div{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;border-bottom:1px solid var(--line-soft);padding:12px 0}
.document-metadata dt{color:var(--muted)}
.document-metadata dd{margin:0;color:var(--text);overflow-wrap:anywhere}
.model-page-end{color:var(--muted);font-size:.6875rem;display:flex;gap:7px;align-items:center;margin:22px 0 5px}
.model-page-end .icon{width:13px;height:13px;flex:none}
.document-notice{padding:12px 22px;border-bottom:1px solid var(--line);font-size:.75rem;display:flex;align-items:center;gap:10px}
.readme-state{padding:55px 35px 65px;max-width:720px;margin:0 auto;text-align:center;min-height:420px}
.readme-state>h2{font-size:1.5rem;margin:18px 0 13px}
.readme-state>p{color:var(--muted);font-size:.875rem;margin:0 auto 25px;max-width:500px;line-height:1.8}
.readme-state>.icon{width:32px;height:32px;color:var(--muted)}
.readme-state>.text-link{margin:14px;display:inline-flex;font-size:.8125rem}
.skeleton-document{padding:8px 0;max-width:490px;margin:0 auto 25px;display:grid;gap:13px}
.skeleton-document i{display:block;height:9px;background:var(--soft);border-radius:3px}
.skeleton-document i:first-child{width:65%;height:15px;margin-bottom:15px}
.skeleton-document i:nth-child(3){width:93%}
.skeleton-document i:last-child{width:75%}
.provider-document section{margin-top:32px;padding-top:25px;border-top:1px solid var(--line)}
.provider-document .button{margin-top:15px}
.detail-secondary{border:1px solid var(--line);border-radius:12px;padding:30px;background:var(--panel)}
.detail-secondary .subpage-heading{margin-top:0;margin-bottom:27px}
.detail-secondary .subpage-heading h2{font-size:1.4rem}
.detail-secondary .subpage-heading p{font-size:.8125rem;color:var(--muted);margin-top:8px}
.gguf-file{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:24px;min-width:0}
.gguf-file-identity{display:flex;gap:13px;align-items:center;min-width:0}

/* Custom controls use host tokens; hidden native nodes retain only value/event compatibility. */
[data-calm-source] { display:none!important; }
.calm-control { display:inline-flex; position:relative; min-width:0; max-width:100%; align-items:center; vertical-align:middle; }
.calm-control[hidden] { display:none!important; }
.calm-control--select { width:100%; }
.calm-select,.calm-check,.calm-range { font:inherit; color:var(--text,var(--talos-text,#e4e4e7)); box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

.calm-select:focus-visible,.calm-check:focus-visible,.calm-range:focus-visible { outline:2px solid var(--accent,var(--talos-ring,#d8a650)); outline-offset:3px; }
.calm-select:disabled,.calm-check:disabled,.calm-range[aria-disabled="true"] { opacity:.5; cursor:not-allowed; }

/** Pure route codec. Unknown models and malformed escapes fall back to the catalog. */
function parseModelRoute(hash,models){
 const [path,search='']=hash.split('?');
 const qp=new URLSearchParams(search);let catalogFilters=emptyCatalogFilters();try{catalogFilters=validateCatalogFilters(JSON.parse(qp.get('f')||'{}'));}catch{}
 const route={catalogFilters,query:(qp.get('q')||'').slice(0,240),section:'models',tab:'models',detailId:null,detailTab:'card'};
 if(path.includes('/aspetto'))return {...route,section:'appearance'};
 const parts=path.split('/');
 if(parts[3]==='scheda'){
  let id;try{id=decodeURIComponent(parts[4]||'');}catch{return route;}
  if(!models.some(m=>m.id===id))return route;
  return {...route,detailId:id,detailTab:['card','files','compatibility'].includes(parts[5])?parts[5]:'card'};
 }
 const last=parts.at(-1);
 return {...route,tab:['models','providers','downloads','system'].includes(last)?last:'models'};
}
function modelRoute(state){
 const qp=new URLSearchParams();if(state.query)qp.set('q',state.query.slice(0,240));const compact=compactCatalogFilters(state.catalogFilters);if(Object.keys(compact).length)qp.set('f',JSON.stringify(compact));const suffix=qp.size?'?'+qp.toString():'';
 if(state.section==='appearance')return '#/impostazioni/aspetto';
 if(state.detailId)return `#/impostazioni/modelli/scheda/${encodeURIComponent(state.detailId)}/${state.detailTab}${suffix}`;
 return `#/impostazioni/modelli/${state.tab}${suffix}`;
}

Apri sistema','system-tab',{ic:'cpu'})}</article></div><div class="inline-notice">${icon('shield')}<span><strong>Qui non inserire chiavi reali.</strong> Questa anteprima non contatta provider e non salva credenziali. Le destinazioni sono mostrate per valutarne l’esperienza.</span></div>`;

const $=(selector,scope=document)=>scope.querySelector(selector);
let storage;try{storage=window.localStorage;}catch{storage={getItem(){throw new Error('Storage assente')},setItem(){throw new Error('Storage assente')}};}

state.appearance=loadAppearance(storage);

let searchMatches=[];

const routeHash=()=>modelRoute(state);
function routeMetadata(extra={}){return {talosPrototype3:true,catalog:state.catalogReturn,detailId:state.detailId,...extra};}
function writeRoute(mode='replace',extra={}){try{history[mode+'State'](routeMetadata(extra),'',routeHash());}catch{/* Some opaque hosts do not support history. In-page navigation still works. */}}
function readHash(){
 if(location.hash==='#page-title')return;
 Object.assign(state,parseModelRoute(location.hash,state.models));
 const saved=history.state?.talosPrototype3?history.state.catalog:null;
 if(saved){state.catalogReturn=saved;if(!state.detailId)state.filtersOpen=saved.filtersOpen===true;} // La rotta è autoritativa per query e filtri; la history conserva solo il contesto di ritorno.
 if(state.detailId)state.selectedId=state.detailId;
}
function captureCatalog(id){
 state.catalogReturn={query:state.query,filter:state.filter,task:state.task,catalogFilters:structuredClone(state.catalogFilters),filtersOpen:state.filtersOpen,scrollTop:$('#main').scrollTop,focusId:id?'select-'+id.replace(':','-'):document.activeElement?.id};
}
function openModelPage(id){
 if(!state.models.some(m=>m.id===id))return;
 const cameFromCatalog=state.section==='models'&&state.tab==='models'&&!state.detailId;
 if(cameFromCatalog){captureCatalog(id);writeRoute('replace');}
 state.section='models';state.tab='models';state.detailId=id;state.selectedId=id;state.detailTab='card';state.cardStatus='ready';state.detailScroll={};
 writeRoute('push',{cameFromCatalog});render({focusTitle:true,preserve:false});
}
function restoreCatalogView(){
 if(state.detailId||state.section!=='models'||state.tab!=='models')return;
 const saved=state.catalogReturn;
 if(saved){$('#main').scrollTop=saved.scrollTop;const el=document.getElementById(saved.focusId);if(el)el.focus({preventScroll:true});else $('#model-query')?.focus({preventScroll:true});}
}
function backToCatalog(){
 if(history.state?.talosPrototype3&&history.state.cameFromCatalog){history.back();return;}
 state.detailId=null;state.section='models';state.tab='models';
 if(state.catalogReturn){state.query=state.catalogReturn.query;state.filter=state.catalogReturn.filter;state.task=state.catalogReturn.task;state.catalogFilters=validateCatalogFilters(state.catalogReturn.catalogFilters);state.filtersOpen=state.catalogReturn.filtersOpen===true;}
 writeRoute();render({focusTitle:true,preserve:false});restoreCatalogView();
}
function changeModelTab(tab){
 if(!['card','files','compatibility'].includes(tab))return;

 writeRoute('replace',{cameFromCatalog:!!history.state?.cameFromCatalog});render();

}
readHash();

function syncAppearanceControls(){
 for(const el of document.querySelectorAll('[data-appearance]')){const value=state.appearance[el.dataset.appearance];if(el.type==='checkbox')el.checked=!!value;else el.value=String(value);}
 for(const b of document.querySelectorAll('[data-theme-choice]')){const active=b.dataset.themeChoice===state.appearance.themePreset;b.setAttribute('aria-checked',String(active));b.tabIndex=active?0:-1;b.classList.toggle('selected',active);b.querySelector('.studio-theme-tick').textContent=active?'✓':'';}
 customControls.refresh();const name=APPEARANCE_FIELDS.find(f=>f.chiave==='themePreset').opzioni.find(([id])=>id===state.appearance.themePreset)?.[1];if($('#current-theme-name'))$('#current-theme-name').textContent=name;
 if($('#appearance-save-status'))$('#appearance-save-status').textContent=appearanceSaveFailed?'Non salvato: attivo solo per questa visita.':'Preferenze salvate in questa anteprima.';

function remember(){state.saveStatus=saveSnapshot(storage,state)&&!appearanceSaveFailed?'local':'error';}
function elementKey(el){if(!el)return null;if(el.id)return {id:el.id};const b=el.closest?.('[data-action]');return b?{action:b.dataset.action,model:b.dataset.model,value:b.dataset.value}:null;}
function locateKey(key){if(!key)return null;if(key.id)return document.getElementById(key.id);return [...document.querySelectorAll('[data-action]')].find(b=>b.dataset.action===key.action&&b.dataset.model===key.model&&b.dataset.value===key.value)||null;}

function render({focusTitle=false,preserve=true}={}){
 const active=document.activeElement;const key=preserve?elementKey(active):null;
 const selection=active instanceof HTMLInputElement&&['search','text'].includes(active.type)?[active.selectionStart,active.selectionEnd]:null;

 customControls.refresh();appearancePreviews.refresh(state.appearance);
 if(focusTitle){$('#main').scrollTop=0;$('#page-title')?.focus({preventScroll:true});}else{$('#main').scrollTop=scroll;if(key){const target=locateKey(key);if(target&&!target.disabled){target.focus({preventScroll:true});if(selection&&target instanceof HTMLInputElement)try{target.setSelectionRange(...selection);}catch{}}}}
 const resultText=$('#result-count')?.textContent;if(resultText&&$('#catalog-live').textContent!==resultText)$('#catalog-live').textContent=resultText+' nel catalogo dimostrativo.';

}
function renderNav(){return `<div class="nav-group"><div class="nav-label">COMPORTAMENTO</div><button class="nav-item ${state.section==='appearance'?'active':''}" data-action="navigate" data-value="appearance" ${state.section==='appearance'?'aria-current="page"':''}>${icon('sun')}Aspetto e movimento</button>${[['chat','Chat e composer'],['shield','Strumenti agente e permessi'],['memory','Memoria e contesto'],['key','Sicurezza e privacy']].map(([ic,label])=>`<button class="nav-item" disabled title="Fuori dal lotto dimostrativo">${icon(ic)}${label}</button>`).join('')}</div><div class="nav-group"><div class="nav-label">INFRASTRUTTURA</div><button class="nav-item ${state.section==='models'?'active':''}" data-action="navigate" data-value="models" ${state.section==='models'?'aria-current="page"':''}>${icon('models')}Laboratorio modelli</button><button class="nav-item" data-action="providers-tab">${icon('key')}Provider e accessi</button>${[['cost','Costi e consumo'],['folder','File e workspace'],['activity','Account, Doctor e backup']].map(([ic,label])=>`<button class="nav-item" disabled title="Fuori dal lotto dimostrativo">${icon(ic)}${label}</button>`).join('')}</div><p class="nav-scope">Le voci attenuate sono fuori da questo primo lotto.</p>`;}

function toast(message,{undo=null}={}){clearTimeout(toastTimer);undoAction=undo;$('#toast').innerHTML=`<div class="toast">${icon('check')}<span>${escapeHTML(message)}</span>${undo?'<button data-action="undo">Annulla</button>':''}<button class="icon-button" data-action="dismiss-toast" aria-label="Chiudi notifica">${icon('close')}</button></div>`;toastTimer=setTimeout(()=>{$('#toast').innerHTML='';undoAction=null;},undo?18000:7000);}

function queueModel(id){const m=state.models.find(m=>m.id===id);if(!m||!m.file||!m.format||m.destination!=='local'||m.installed||state.downloads.some(j=>j.modelId===id&&['running','paused','error'].includes(j.status)))return;state.downloads.push({id:'job-'+(++nextJobId),modelId:id,name:m.name,status:state.scenario==='offline'?'error':'running',progress:0});if(state.scenario==='empty')state.scenario='ready';closeModal(false);navigate('models','downloads');toast('Download dimostrativo aggiunto. Nessun file viene scaricato.');}

function setScenario(scenario){if(scenario==='empty')state.detailId=null;clearTimeout(providerTimer);clearTimeout(runtimeTimer);clearTimeout(testTimer);state.scenario=scenario;state.probe='idle';state.providerStatus=scenario==='empty'?'missing':scenario==='denied'?'denied':'connected';if(scenario==='empty'){state.models=DEMO_MODELS.map(m=>({...m,installed:false}));state.defaultId=null;state.downloads=[];}else if(state.models.every(m=>!m.installed)){state.models=DEMO_MODELS.map(m=>({...m}));state.defaultId='local:qwen8';}if(scenario==='offline')state.downloads=state.downloads.map(j=>j.status==='running'?{...j,status:'error'}:j);render();}

document.addEventListener('toggle',event=>{if(event.target.matches?.('.advanced-settings'))state.advanced=event.target.open;},true);
document.addEventListener('keydown',event=>{
 const theme=event.target.closest?.('[data-theme-choice]');if(theme&&['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();const all=[...document.querySelectorAll('[data-theme-choice]')];const current=all.indexOf(theme);const next=event.key==='Home'?0:event.key==='End'?all.length-1:(current+(['ArrowRight','ArrowDown'].includes(event.key)?1:-1)+all.length)%all.length;updateAppearance('themePreset',all[next].dataset.themeChoice);all[next].focus();return;}
 const dialog=$('#dialog');
 // A search input may otherwise consume Escape to clear itself before dialog cancel.
 if(dialog.open&&event.key==='Escape'){event.preventDefault();event.stopPropagation();closeModal();return;}
 if(dialog.open&&event.key==='Tab'){
   const stops=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),a[href],summary,[tabindex]:not([tabindex="-1"])')].filter(el=>el.getClientRects().length&&el.tabIndex>=0);
   const first=stops[0],last=stops.at(-1),active=document.activeElement;
   if(!first){event.preventDefault();$('#dialog-title').focus();return;}
   if(event.shiftKey&&(active===first||!stops.includes(active))){event.preventDefault();last.focus();}
   else if(!event.shiftKey&&(active===last||!stops.includes(active))){event.preventDefault();first.focus();}
 }
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!$('#dialog').open)openSearch();return;}
 const tab=event.target.closest?.('[role=tab]');
 if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const tabs=[...tab.parentElement.querySelectorAll('[role=tab]')];const i=tabs.indexOf(tab);const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs.forEach((t,j)=>t.tabIndex=j===next?0:-1);tabs[next].focus();}
 if(modalKind==='search'&&['ArrowDown','ArrowUp'].includes(event.key)){const results=[...$('#dialog').querySelectorAll('.search-result')];if(!results.length)return;event.preventDefault();const i=results.indexOf(document.activeElement);results[event.key==='ArrowDown'?(i+1)%results.length:(i<0?results.length-1:(i-1+results.length)%results.length)].focus();}
});
$('#dialog').addEventListener('cancel',event=>{event.preventDefault();closeModal();});
$('#dialog').addEventListener('click',event=>{if(event.target!==$('#dialog'))return;const rect=$('#dialog').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)closeModal();});
modeMedia.addEventListener('change',applyAppearance);reduceMedia.addEventListener('change',applyAppearance);
window.addEventListener('hashchange',()=>{readHash();render({focusTitle:true,preserve:false});restoreCatalogView();});
window.addEventListener('beforeunload',()=>{clearTimeout(toastTimer);clearTimeout(providerTimer);clearTimeout(runtimeTimer);clearTimeout(testTimer);clearInterval(queueTimer);customControls.dispose();appearancePreviews.dispose();});
queueTimer=setInterval(tickQueue,450);
render({preserve:false});

})();</script>
</body></html>
