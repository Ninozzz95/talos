<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- A chip, not a logo. Every other provider here is a company and gets its
         brand mark; this one is the phone in your hand, and inventing a badge
         for it would suggest a vendor that does not exist. Drawn in currentColor
         so it belongs to whichever theme is on rather than to a palette of its
         own. -->
    <rect x="6" y="6" width="12" height="12" rx="2" />
    <rect x="9.5" y="9.5" width="5" height="5" rx="1" />
    <path d="M9 3v3M12 3v3M15 3v3M9 18v3M12 18v3M15 18v3" />
    <path d="M3 9h3M3 12h3M3 15h3M18 9h3M18 12h3M18 15h3" />
</svg>
