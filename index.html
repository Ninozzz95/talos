<!doctype html>
<html lang="en">
    <head>
    <!--
      ⛔⛔⛔ La policy sta QUI, prima di qualunque altra cosa nel head: il browser
      la applica da dove la incontra in poi, e una riga di ritardo e una riga
      non protetta.

      ## Perche in un'app impacchettata conta piu che su una pagina web

      Non e stata trovata nessuna XSS attuale — il markdown passa da una
      allowlist, e i punti che scrivono HTML sono pochi e sanificati. Il motivo
      e il RAGGIO: dentro questa WebView, JavaScript arriva ai plugin nativi.
      Una regressione futura qui non ruberebbe una sessione: userebbe il
      telefono.

      ## Le voci, e da dove viene ciascuna

      ⛔⛔⛔ 'wasm-unsafe-eval' NON e una concessione di comodo.

      Argon2id gira in WebAssembly (hash-wasm). Senza questa parola la CSP
      blocca la compilazione del modulo, e allora: nessuno sblocca piu il
      proprio database col PIN, nessun backup si scrive, nessun backup si apre.
      In silenzio — la CSP non fa fallire un build, toglie un pezzo.

      L'ho scoperto perche il test carica l'app in un browser vero e chiede se
      ha dovuto bloccare qualcosa: due violazioni «script-src ← wasm-eval».
      Scritta a memoria dal modello di una revisione, questa policy avrebbe
      chiuso fuori tutti dalle proprie chat.

      ⇒ E la parola GIUSTA: permette WebAssembly e NON permette eval() di
      JavaScript. La protezione che conta resta intera.

      script-src 'self'   il build ha ZERO script inline — verificato sul file
                          prodotto, non supposto. E la voce che vale davvero:
                          senza, un HTML iniettato puo eseguire.
      style-src           'unsafe-inline' e OBBLIGATO: i componenti impostano
                          stili sugli elementi, e senza sparirebbero. Non
                          indebolisce cio che protegge script-src.
      worker-src          l'analisi degli allegati gira in un worker; a seconda
                          di come lo impacchetta il bundler arriva come file o
                          come blob, quindi tutti e due.
      img-src             le schede della libreria tengono i byte in locale
                          (data:, blob:), ma il markdown puo mostrare immagini
                          remote.
      object-src 'none'   nessun plugin incorporato, mai.
      base-uri 'none'     un <base> iniettato dirotta OGNI percorso relativo
                          della pagina: e un modo di riscrivere dove va a
                          prendere il codice, senza toccare il codice.
      form-action 'none'  l'app non invia form: un form iniettato che spedisce
                          altrove non deve nemmeno partire.

      ⛔ connect-src NON e ristretta, e non e una dimenticanza.

      TALOS parla con l'endpoint che la persona configura, compreso un modello
      che gira in casa sua su un indirizzo privato. La CSP non sa esprimere un
      intervallo di indirizzi, quindi l'unico modo di stringerla sarebbe
      elencare i provider conosciuti — cioe togliere la funzione che permette
      di usare il proprio. Il confine di rete e altrove: nella politica sugli
      endpoint locali e nel rifiuto dei redirect.

      ⛔ E in un meta non si possono mettere frame-ancestors, report-uri,
      sandbox ne la modalita di solo rapporto: sono limiti del veicolo, non
      scelte.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob:; connect-src *">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <title>TALOS Mobile</title>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
