apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = 'ai.talos.voice.pocket'
    compileSdk = rootProject.ext.compileSdkVersion
    /*
     * Lo STESSO NDK dell'app (`app/build.gradle`), mai un secondo (owner 10/09, «allineare l'NDK»). Era rimasto a r27, l'NDK del
     * progetto prima del passaggio a r29 per Hexagon: `libtalos_pocket_sentencepiece.so` usciva allineata a 4 KB e Android 17 avvisava
     * «non compatibile con dimensioni pagina di 16 kB» (foto dell'owner dal OnePlus 13, 28/10). Da r28 l'allineamento a 16 KB è di
     * serie (developer.android.com/guide/practices/page-sizes); Play blocca gli aggiornamenti non allineati dal 01/02/2027. Nessuna
     * libreria precompilata qui: sentencepiece e libsamplerate si compilano dai sorgenti. Prova: PAGINE-16K-01/02.
     */
    ndkVersion = '29.0.14206865'

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release'
                cppFlags '-std=c++17', '-fvisibility=hidden', '-fvisibility-inlines-hidden'
                targets 'talos_pocket_sentencepiece'
            }
        }
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    api 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
}
