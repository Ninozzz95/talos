distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
# ⛔ Il checksum di quella distribuzione, dal file .sha256 che Gradle pubblica
# accanto all archivio. Senza, il wrapper scarica ed ESEGUE qualunque cosa
# risponda a quell indirizzo: un build che si fida di una connessione invece
# che di un contenuto.
#
# ⛔ Non l ho potuto confrontare con la copia locale, perche Gradle cancella
# l archivio dopo averlo scompattato. Ma il pin si verifica DA SOLO: al primo
# scaricamento pulito, se non coincide, il build si ferma.
distributionSha256Sum=ed1a8d686605fd7c23bdf62c7fc7add1c5b23b2bbc3721e661934ef4a4911d7c
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
