<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Banco di prova del controllo «veli sani»</title>
<!--
  ⛔ 07/09/2026 — QUESTA PAGINA ESISTE PER FAR FALLIRE IL CONTROLLO.

  Un cancello che non ha mai respinto niente non è un cancello: è una decorazione. In questo stesso
  progetto il cancello semantico del kernel non aveva MAI respinto una scrittura, e nessuno se n'era
  accorto — perché ogni prova gli chiedeva soltanto di lasciar passare ciò che era lecito.

  È il metodo che la letteratura chiama mutation testing: si introducono di proposito piccoli
  difetti e si verifica che il controllo li prenda, altrimenti non si sa se prenderebbe quelli veri
  (QASkills, «Mutation Testing With Stryker: Complete Guide 2026», letto il 07/09/2026 — e la sua
  frase che vale anche qui: il 90% di copertura con prove cattive è peggio del 70% con prove buone).

  Tre veli:
    · «veloSano» non ha niente che non va, e il controllo deve TACERE (un falso allarme lo rende
      inutile: è successo al primo giro, quando accusava la palette dei comandi, che scorre);
    · «veloTagliato» ha il contenuto oltre il bordo di un corpo che NON scorre — il difetto vero del
      velo Modello, dove il cursore del ragionamento finiva 42 px fuori;
    · «veloNudo» ha una regola che dice `border: 1px solid var(--linea-che-non-esiste)`: la
      dichiarazione cade e il controllo resta senza bordo, come `.sheet-input` dentro un velo.

  Si apre da `file://`: qui non c'è la CSP della app, e i due difetti si possono mettere davvero —
  dentro la app un `<style>` iniettato viene bloccato, e la prova non proverebbe niente.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #1e1f22; color: #f3f0e9; font: 14px system-ui, sans-serif; }
  .overlay-layer { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.5); }
  .overlay-layer[hidden] { display: none; }
  .talos-dialog { width: 520px; max-height: 300px; display: flex; flex-direction: column;
                  background: #25262a; border: 1px solid #36373b; border-radius: 14px; overflow: hidden; }
  .talos-dialog__header { padding: 14px 18px; border-bottom: 1px solid #36373b; }
  .talos-dialog__footer { padding: 12px 18px; border-top: 1px solid #36373b; }

  /* il velo sano: il corpo scorre, e i controlli hanno colori veri */
  #veloSano .talos-dialog__body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; }
  #veloSano .campo { border: 1px solid #4a4b50; background: #2b2c30; border-radius: 8px; padding: 10px; }

  /* ⛔ difetto 1: il corpo TAGLIA invece di scorrere */
  #veloTagliato .talos-dialog__body { flex: 1 1 auto; min-height: 0; overflow-y: hidden; padding: 16px; }
  #veloTagliato .lungo { height: 600px; background: #2b2c30; border: 1px solid #4a4b50; }

  /* ⛔ difetto 2: la regola c'è, la variabile no — la dichiarazione cade e il campo resta nudo */
  #veloNudo .talos-dialog__body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px; }
  #veloNudo .campo { border: 1px solid var(--linea-che-non-esiste); background: var(--fondo-che-non-esiste); border-radius: 8px; padding: 10px; }
</style>
</head>
<body>

<div class="overlay-layer" id="veloSano" hidden>
  <div class="talos-dialog">
    <div class="talos-dialog__header">Velo sano</div>
    <div class="talos-dialog__body"><div class="campo">Un campo con bordo e fondo veri.</div></div>
    <div class="talos-dialog__footer">Fatto</div>
  </div>
</div>

<div class="overlay-layer" id="veloTagliato" hidden>
  <div class="talos-dialog">
    <div class="talos-dialog__header">Velo che taglia</div>
    <div class="talos-dialog__body"><div class="lungo">Alto 600 px dentro un corpo che non scorre.</div></div>
    <div class="talos-dialog__footer">Fatto</div>
  </div>
</div>

<div class="overlay-layer" id="veloNudo" hidden>
  <div class="talos-dialog">
    <div class="talos-dialog__header">Velo col controllo nudo</div>
    <div class="talos-dialog__body"><div class="campo">Il bordo e il fondo di questo campo non arriveranno mai.</div></div>
    <div class="talos-dialog__footer">Fatto</div>
  </div>
</div>

</body>
</html>
